<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hearth</title>
<!-- Hearth Cast receiver: plays what Hearth sends to Chromecast / Google TV / Nest devices.
     Video uses Google's standard player; audio (radio, music, podcasts) gets a Hearth "now playing" screen. -->
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
html, body { margin: 0; height: 100%; background: #14101f; overflow: hidden; font-family: "Google Sans", Roboto, Arial, sans-serif; color: #fff; }
cast-media-player {
  --theme-hue: 20; --progress-color: #f2845c;
  --splash-image: url("logo.png"); --splash-size: 22%;
  --logo-image: url("logo.png"); --logo-size: 7%;
  --background-image: radial-gradient(circle at 50% 40%, #3a2350 0%, #14101f 70%);
}
#ara { position: fixed; inset: 0; display: none; align-items: center; padding: 0 8vw; box-sizing: border-box;
  background: radial-gradient(circle at 25% 45%, #3a2350 0%, #14101f 75%); }
#ara.on { display: flex; }
#fons { position: absolute; inset: -40px; background: center/cover no-repeat; filter: blur(60px) brightness(.35) saturate(1.3); opacity: 0; transition: opacity 1s; }
#art { position: relative; width: 38vh; height: 38vh; border-radius: 4vh; flex: none; background: #2a2140 center/cover no-repeat; box-shadow: 0 3vh 8vh rgba(0,0,0,.5); }
#art.buit { background-image: url("logo.png"); background-size: 100%; background-color: transparent; box-shadow: none; }
#txt { position: relative; margin-left: 6vw; min-width: 0; }
#tit { font-size: 6.5vh; font-weight: 700; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#sub { font-size: 3.6vh; color: #c9bfd9; margin-top: 2vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#estat { font-size: 2.6vh; color: #f2845c; margin-top: 3vh; letter-spacing: .1em; text-transform: uppercase; }
#peu { position: absolute; left: 5vw; right: 5vw; bottom: 5vh; display: flex; align-items: center; color: #b8aecb; font-size: 2.8vh; }
#peu img { width: 4.5vh; height: 4.5vh; border-radius: 1vh; margin-right: 1.5vh; }
#hora { margin-left: auto; font-size: 4vh; color: #fff; font-weight: 300; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="ara">
  <div id="fons"></div>
  <div id="art" class="buit"></div>
  <div id="txt"><div id="tit"></div><div id="sub"></div><div id="estat"></div></div>
  <div id="peu"><img src="logo.png" alt="">Hearth<span id="hora"></span></div>
</div>
<script>
var ctx = cast.framework.CastReceiverContext.getInstance();
var pm = ctx.getPlayerManager();
var $ = function (id) { return document.getElementById(id); };

function pinta() {
  var m = pm.getMediaInformation();
  var audio = !!m && /^audio\//.test(m.contentType || '');
  $('ara').className = audio ? 'on' : '';
  if (!audio) return;
  var md = m.metadata || {};
  $('tit').textContent = md.title || '';
  $('sub').textContent = [md.artist, md.albumName, md.subtitle].filter(Boolean).join(' · ');
  var img = md.images && md.images[0] && md.images[0].url;
  $('art').className = img ? '' : 'buit';
  $('art').style.backgroundImage = img ? 'url("' + img + '")' : '';
  $('fons').style.backgroundImage = img ? 'url("' + img + '")' : '';
  $('fons').style.opacity = img ? 1 : 0;
  estat();
}
function estat() {
  var s = pm.getPlayerState(), P = cast.framework.messages.PlayerState;
  $('estat').textContent = s === P.PAUSED ? 'Paused' : s === P.BUFFERING ? 'Loading…' : '';
}
function hora() { var d = new Date(); $('hora').textContent = d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }

var E = cast.framework.events.EventType;
pm.addEventListener(E.PLAYER_LOAD_COMPLETE, pinta);
pm.addEventListener(E.MEDIA_STATUS, pinta);
pm.addEventListener([E.PAUSE, E.PLAY, E.PLAYING, E.BUFFERING], estat);
pm.addEventListener(E.MEDIA_FINISHED, function () { $('ara').className = ''; });
setInterval(hora, 10000); hora();

var opts = new cast.framework.CastReceiverOptions();
opts.maxInactivity = 3600;          /* keep the session while a radio plays for hours */
opts.skipPlayersLoad = false;
ctx.start(opts);
</script>
</body>
</html>
