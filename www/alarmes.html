<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<script src="i18n.js"></script>
<title>Alarmes</title>
<style>
#pag{position:absolute;top:0;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.cx{max-width:820px;margin:0 auto;padding:22px 22px 60px}
.sec{background:#16191e;border-radius:22px;padding:18px 18px 8px;margin-top:18px}
.sec-cap{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:14px}
.sec-cap h2{-webkit-flex:1;flex:1;margin:0;font-size:21px;font-weight:700}
.sec-cap .ic{width:24px;height:24px;margin-right:10px;fill:#ffab3d}
.etq{font-size:13px;color:#8d95a1;text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 8px}
option{background:#fff;color:#111}
select,input[type=time]{background:#262a31;color:#fff;border:0;border-radius:12px;padding:11px 14px;font-size:16px;-webkit-appearance:none;appearance:none;outline:none;max-width:100%;color-scheme:dark}
/* temporitzadors en marxa */
.tm{position:relative;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#22262d;border-radius:18px;padding:14px 14px 18px 18px;margin-bottom:10px;overflow:hidden}
.tm .t{font-size:46px;font-weight:250;font-weight:300;letter-spacing:-1px;min-width:0;font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum";line-height:1}
.tm .n{-webkit-flex:1;flex:1;min-width:0;margin-left:18px}
.tm .n b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .n small{display:block;color:#8d95a1;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .pr{position:absolute;left:0;bottom:0;height:4px;background:#ffab3d;border-radius:0 2px 2px 0}
.tm.fet .t{color:#ffab3d}
.rod{width:44px;height:44px;border-radius:22px;padding:0;-webkit-flex:none;flex:none;margin-left:10px}
.rod .ic{width:22px;height:22px;margin:0}
/* botons ràpids */
.rap{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -5px}
.rap button{width:calc(20% - 10px);margin:5px;padding:12px 0 10px;border-radius:16px;background:#262a31;line-height:1}
.rap button b{display:block;font-size:26px;font-weight:600}
.rap button small{display:block;font-size:12px;color:#8d95a1;margin-top:4px}
.nou{display:-webkit-flex;display:flex;margin:8px 0 6px}
.nou input{border-radius:14px}
.nou #t-min{width:96px;-webkit-flex:none;flex:none;margin-right:8px;text-align:center}
.nou #t-nom{-webkit-flex:1;flex:1;min-width:0;margin-right:8px}
.nou button{-webkit-flex:none;flex:none;border-radius:14px;padding:0 20px}
.on-sona{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin:4px 0 14px}
.on-sona span{color:#8d95a1;font-size:15px;margin-right:10px}
.on-sona select{-webkit-flex:1;flex:1;min-width:0}
/* despertadors */
.dp{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#22262d;border-radius:18px;padding:14px 16px 14px 18px;margin-bottom:10px;cursor:pointer}
.dp .e{-webkit-flex:1;flex:1;min-width:0}
.dp .h{font-size:46px;font-weight:300;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;-webkit-font-feature-settings:"tnum";font-feature-settings:"tnum"}
.dp .d{margin-top:8px;font-size:14px;color:#aeb5bf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp .d i{font-style:normal;display:inline-block;width:22px;text-align:center;color:#5b626c;font-weight:600;font-size:12px}
.dp .d i.si{color:#ffab3d}
.dp .d em{font-style:normal;margin-left:6px}
.dp.off .h,.dp.off .d{opacity:.45}
.sw{width:54px;height:33px;border-radius:17px;background:#3a3f47;position:relative;-webkit-flex:none;flex:none;cursor:pointer;margin-left:12px;-webkit-transition:background .2s;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);-webkit-transition:left .2s;transition:left .2s}
.sw.on{background:#30d158}
.sw.on i{left:24px}
.buit{color:#8d95a1;padding:6px 2px 14px}
.afegeix{display:block;width:100%;margin:4px 0 12px;padding:14px;border-radius:16px;background:rgba(255,171,61,.13);color:#ffab3d;font-weight:600}
/* full per editar un despertador */
#full{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#full .fx{max-width:520px;margin:28px auto;background:#1c1f24;border-radius:24px;padding:20px 22px 22px}
#full .fc{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-bottom:6px}
#full .fc h3{-webkit-flex:1;flex:1;margin:0;font-size:20px}
#full .fc button{background:none;font-size:22px;padding:4px 10px;color:#8d95a1}
#d-hora{display:block;width:100%;font-size:54px;font-weight:300;text-align:center;padding:10px;border-radius:18px;margin:8px 0 4px;height:auto}
#full input[type=text]{border-radius:12px}
#full select{width:100%}
.dies{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.dies span{width:13%;max-width:46px;height:42px;line-height:42px;text-align:center;border-radius:21px;background:#262a31;cursor:pointer;font-weight:600;font-size:14px}
.dies span.on{background:#ffab3d;color:#1a1206}
.dreceres{margin-top:8px}
.dreceres span{display:inline-block;margin:0 6px 6px 0;padding:6px 12px;border-radius:14px;background:#262a31;font-size:13px;cursor:pointer;color:#aeb5bf}
#full .peu{display:-webkit-flex;display:flex;margin-top:22px}
#full .peu .esb{background:none;color:#ff453a;padding-left:4px}
#full .peu .esp{-webkit-flex:1;flex:1}
#full .peu button{margin-left:8px}
@media (max-width:600px){
  .cx{padding:16px 14px 60px}
  .sec{padding:16px 14px 6px;border-radius:20px}
  .rap button{width:calc(33.33% - 10px)}
  .rap button:nth-child(10){display:none}
  .tm .t,.dp .h{font-size:40px}
  .nou{-webkit-flex-wrap:wrap;flex-wrap:wrap}
  .nou button{width:100%;margin-top:8px;padding:12px}
  .nou #t-nom{margin-right:0}
  #full .fx{margin:0;min-height:100%;border-radius:0;padding-top:16px}
}
</style>
</head>
<body>
<div id="pag"><div class="cx">
  <h1>Alarmes</h1>
  <div class="sec">
    <div class="sec-cap"><span id="ic-t"></span><h2>Temporitzadors</h2></div>
    <div id="temps"></div>
    <div class="rap" id="rap"></div>
    <div class="nou"><input type="number" id="t-min" placeholder="min" min="1" max="600" inputmode="numeric"><input type="text" id="t-nom" placeholder="Nom (p. ex. Pasta)"><button class="pri" onclick="tempNou()">Engega</button></div>
    <div class="on-sona"><span>Sona a</span><select id="t-disp" onchange="ls('alTdisp', this.value)"></select></div>
  </div>
  <div class="sec">
    <div class="sec-cap"><span id="ic-d"></span><h2>Despertadors</h2></div>
    <div id="desps"></div>
    <button class="afegeix" onclick="formObre(-1)">+ Nou despertador</button>
  </div>
</div></div>
<div id="full" onclick="if(event.target==this)formTanca()"><div class="fx">
  <div class="fc"><h3 id="f-tit"></h3><button onclick="formTanca()">✕</button></div>
  <input type="time" id="d-hora" value="07:30">
  <div class="etq">Nom</div><input type="text" id="d-nom" placeholder="Despertador">
  <div class="etq">Dies</div><div class="dies" id="d-dies"></div>
  <div class="dreceres"><span onclick="diesPosa([1,2,3,4,5])">Feiners</span><span onclick="diesPosa([0,6])">Cap de setmana</span><span onclick="diesPosa([0,1,2,3,4,5,6])">Cada dia</span><span onclick="diesPosa([])">Una sola vegada</span></div>
  <div class="etq">So</div><select id="d-so"></select>
  <div class="etq">Sona a</div><select id="d-disp"></select>
  <div class="peu" id="f-peu"></div>
</div></div>
<script src="comu.js"></script>
<script>
dinsCasa('alarmes');
var AL = { l: [], ed: -1, dies: [], pant: [], casts: [], t: null };
var DIESC = [T('dg'), T('dl'), T('dt'), T('dc'), T('dj'), T('dv'), T('ds')];
function id() { return 'a' + Date.now().toString(36) + Math.floor(Math.random() * 1e4).toString(36); }
function carrega(ok) { dades('alarmes', function (d) { AL.l = d || []; pinta(); if (ok) ok(); }); }
/* desa i avisa la pantalla d'inici (que és qui fa sonar les alarmes) */
function desa(l, ok) {
  AL.l = l;
  post(api('dades', { n: 'alarmes' }), JSON.stringify(l), function () { try { if (Casa && Casa.alarmes) Casa.alarmes(l); } catch (e) { } pinta(); if (ok) ok(); }, errXarxa(T('desar')));
}
/* llegeix, canvia i desa (per no trepitjar el que hagi canviat una altra pantalla) */
function canvia(f, ok) { dades('alarmes', function (d) { var l = d || []; f(l); desa(l, ok); }); }

/* ---------- Temporitzadors de cuina ---------- */
function tempPosa(min, nom) {
  if (!(min > 0)) return;
  var dsp = $('t-disp').value || DISP.id;
  try { ls('alTdisp', dsp); } catch (e) { }
  var a = { id: id(), tipus: 'cuina', nom: nom || (min + ' min'), min: min, fi: Date.now() + min * 60000, disp: dsp, dispNom: nomPant(dsp) };
  canvia(function (l) { l.push(a); }, function () { avis(T('Temporitzador') + ': ' + a.nom); });
}
function tempNou() {
  var m = parseFloat($('t-min').value);
  if (!(m > 0)) { avis(T('Escriu els minuts'), 2500); return; }
  tempPosa(m, retalla($('t-nom').value));
  $('t-min').value = ''; $('t-nom').value = '';
}
function tempTreu(i) { var x = AL.l[i]; canvia(function (l) { for (var k = l.length - 1; k >= 0; k--) if (l[k].id == x.id) l.splice(k, 1); }); }
function falta(ms) { ms = Math.max(0, ms); var s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s = s % 60; return (h ? h + ':' + dos(m) : m) + ':' + dos(s); }
function ompleIcones() {
  $('ic-t').innerHTML = svg('M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61l1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0012 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z');
  $('ic-d').innerHTML = svg('M22 5.72l-4.6-3.86-1.29 1.53 4.6 3.86L22 5.72zM7.88 3.39L6.6 1.86 2 5.71l1.29 1.53 4.59-3.85zM12.5 8H11v6l4.75 2.85.75-1.23-4-2.37V8zM12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9a9 9 0 000-18zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z');
}
function nomPant(d) { if (!d || d == 'tots') return T('Totes les pantalles'); if (d == DISP.id) return T('Aquesta pantalla'); if (d == 'pc') return '🖥 ' + T('El PC'); if (d.indexOf('cast:') === 0) { for (var j = 0; j < AL.casts.length; j++) if ('cast:' + AL.casts[j].id == d) return '🔊 ' + AL.casts[j].nom; return '🔊 ' + T('Altaveu'); } for (var i = 0; i < AL.pant.length; i++) if (AL.pant[i].id == d) return AL.pant[i].nom; return T('Una altra pantalla'); }

/* ---------- Despertadors ---------- */
function radiosPare() { try { return window.parent.A.radios || []; } catch (e) { return []; } }
function textDies(d) {
  if (!d || !d.length || d.length == 7) return T('Cada dia');
  if (d.length == 5 && d.indexOf(0) < 0 && d.indexOf(6) < 0) return T('Feiners');
  if (d.length == 2 && d.indexOf(0) >= 0 && d.indexOf(6) >= 0) return T('Cap de setmana');
  var o = [1, 2, 3, 4, 5, 6, 0], r = [];
  for (var i = 0; i < o.length; i++) if (d.indexOf(o[i]) >= 0) r.push(DIESC[o[i]]);
  return r.join(' ');
}
function textSo(s) {
  if (s && s.indexOf('radio:') === 0) { var x = radiosPare()[+s.substring(6)]; return x ? '📻 ' + x.t : T('Ràdio'); }
  return T('So d\'alarma');
}
function despOn(i) { var x = AL.l[i]; canvia(function (l) { for (var k = 0; k < l.length; k++) if (l[k].id == x.id) l[k].on = l[k].on === false; }); }
function despTreu(i) { var x = AL.l[i]; if (!confirm(T('Esborrar aquest despertador?'))) return; canvia(function (l) { for (var k = l.length - 1; k >= 0; k--) if (l[k].id == x.id) l.splice(k, 1); }); formTanca(); }

var IC_X = 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z';
function pinta() {
  var i, x, n = Date.now(), tp = '', dp = '', o = [1, 2, 3, 4, 5, 6, 0];
  for (i = 0; i < AL.l.length; i++) {
    x = AL.l[i];
    if (x.tipus == 'cuina') {
      var tot = (x.min || 1) * 60000, fet = n >= x.fi;
      tp += '<div class="tm' + (fet ? ' fet' : '') + '"><div class="t" data-fi="' + x.fi + '">' + (fet ? '0:00' : falta(x.fi - n)) + '</div>' +
        '<div class="n"><b>' + esc(x.nom) + '</b><small>' + esc(nomPant(x.disp)) + '</small></div>' +
        '<button class="rod" onclick="tempTreu(' + i + ')" title="' + esc(T('Cancel·la')) + '">' + svg(IC_X) + '</button>' +
        '<div class="pr" data-fi="' + x.fi + '" data-tot="' + tot + '" style="width:' + Math.max(0, Math.min(100, 100 * (x.fi - n) / tot)) + '%"></div></div>';
    } else {
      var d = '';
      for (var k = 0; k < o.length; k++) d += '<i class="' + (!x.dies || !x.dies.length || x.dies.indexOf(o[k]) >= 0 ? 'si' : '') + '">' + esc(DIESC[o[k]].charAt(0).toUpperCase()) + '</i>';
      dp += '<div class="dp' + (x.on === false ? ' off' : '') + '" onclick="formObre(' + i + ')"><div class="e"><div class="h">' + esc(x.hora) + '</div>' +
        '<div class="d">' + (!x.dies || !x.dies.length ? '<em style="margin:0">' + esc(T('Una sola vegada')) + '</em>' : d) + '<em>' + esc((x.nom ? x.nom + ' · ' : '') + textSo(x.so) + ' · ' + nomPant(x.disp)) + '</em></div></div>' +
        '<div class="sw' + (x.on === false ? '' : ' on') + '" onclick="event.stopPropagation();despOn(' + i + ')"><i></i></div></div>';
    }
  }
  $('temps').innerHTML = tp;
  $('desps').innerHTML = dp || '<div class="buit">' + esc(T('Encara no hi ha cap despertador.')) + '</div>';
}
/* el compte enrere i la barra es mouen cada segon sense tornar a dibuixar-ho tot */
setInterval(function () {
  var l = document.querySelectorAll('[data-fi]'), n = Date.now();
  for (var i = 0; i < l.length; i++) {
    var fi = +l[i].getAttribute('data-fi');
    if (l[i].className == 'pr') l[i].style.width = Math.max(0, Math.min(100, 100 * (fi - n) / +l[i].getAttribute('data-tot'))) + '%';
    else l[i].textContent = falta(fi - n);
  }
}, 1000);

function pintaRapids() {
  var m = [1, 3, 5, 10, 15, 20, 30, 45, 60, 90], h = '';
  for (var i = 0; i < m.length; i++) h += '<button onclick="tempPosa(' + m[i] + ')"><b>' + m[i] + '</b><small>min</small></button>';
  $('rap').innerHTML = h;
}
function pintaDies() {
  var o = [1, 2, 3, 4, 5, 6, 0], h = '';
  for (var i = 0; i < o.length; i++) h += '<span class="' + (AL.dies.indexOf(o[i]) >= 0 ? 'on' : '') + '" onclick="triaDia(' + o[i] + ')">' + esc(DIESC[o[i]].charAt(0).toUpperCase() + DIESC[o[i]].substring(1)) + '</span>';
  $('d-dies').innerHTML = h;
}
function diesPosa(l) { AL.dies = l.slice(); pintaDies(); }
function triaDia(d) { var p = AL.dies.indexOf(d); if (p >= 0) AL.dies.splice(p, 1); else AL.dies.push(d); pintaDies(); }
function formObre(i) {
  AL.ed = i;
  var x = i >= 0 ? AL.l[i] : { hora: '07:30', nom: '', dies: [1, 2, 3, 4, 5], so: 'bip', disp: DISP.id };
  $('d-hora').value = x.hora; $('d-nom').value = x.nom || '';
  AL.dies = (x.dies || []).slice(); pintaDies();
  var r = [], h = '<option value="bip">' + esc(T('So d\'alarma')) + '</option>';
  r = radiosPare();
  for (var k = 0; k < r.length; k++) h += '<option value="radio:' + k + '">📻 ' + esc(r[k].t) + '</option>';
  $('d-so').innerHTML = h; $('d-so').value = x.so || 'bip';
  var p = opcionsDisp();
  if (x.disp && x.disp != 'tots' && x.disp != DISP.id && p.indexOf('value="' + x.disp + '"') < 0) p += '<option value="' + esc(x.disp) + '">' + esc(T('Una altra pantalla')) + '</option>';
  $('d-disp').innerHTML = p; $('d-disp').value = x.disp || DISP.id;
  $('f-tit').textContent = T(i >= 0 ? 'Edita el despertador' : 'Nou despertador');
  $('f-peu').innerHTML = (i >= 0 ? '<button class="esb" onclick="despTreu(' + i + ')">' + esc(T('Esborra')) + '</button>' : '') + '<span class="esp"></span><button onclick="formProva()">' + esc(T('Prova')) + '</button><button class="pri" onclick="formDesa()">' + esc(T('Desa')) + '</button>';
  $('full').style.display = 'block';
}
/* a on pot sonar: pantalles de Hearth (si estan enceses), altaveus i teles Cast/DLNA i el PC (sonen sempre: ho fa el servidor) */
function opcionsDisp() {
  var p = '<option value="' + esc(DISP.id) + '">' + esc(T('Aquesta pantalla')) + '</option><option value="tots">' + esc(T('Totes les pantalles')) + '</option>', k;
  for (k = 0; k < AL.pant.length; k++) p += '<option value="' + esc(AL.pant[k].id) + '">' + esc(AL.pant[k].nom) + '</option>';
  for (k = 0; k < AL.casts.length; k++) p += '<option value="cast:' + esc(AL.casts[k].id) + '">🔊 ' + esc(AL.casts[k].nom) + '</option>';
  p += '<option value="pc">🖥 ' + esc(T('El PC')) + '</option>';
  return p;
}
function pintaTdisp() { var v = $('t-disp').value || ls('alTdisp') || DISP.id; $('t-disp').innerHTML = opcionsDisp(); $('t-disp').value = v; if ($('t-disp').value != v) $('t-disp').value = DISP.id; }
function formTanca() { $('full').style.display = 'none'; AL.ed = -1; }
function formDades() { return { hora: $('d-hora').value || '07:30', nom: retalla($('d-nom').value), dies: AL.dies.slice(), so: $('d-so').value, disp: $('d-disp').value, dispNom: nomPant($('d-disp').value) }; }
function formProva() {
  var a = formDades(); a.id = 'prova'; a.tipus = 'desp';
  /* a un altaveu o al PC: un temporitzador de prova que sona d'aquí a uns segons (el servidor el mira cada 10 s) */
  if (/^(cast:|pc$)/.test(a.disp)) { tempProva(a); return; }
  if (Casa && Casa.alarmaProva) Casa.alarmaProva(a);
}
function tempProva(a) {
  var t = { id: id(), tipus: 'cuina', nom: T('Prova'), min: 0, fi: Date.now() + 3000, disp: a.disp, dispNom: a.dispNom, so: a.so };
  canvia(function (l) { l.push(t); }, function () { avis(T('Sonarà d\'aquí a uns segons a') + ' ' + a.dispNom, 4000); });
}
function formDesa() {
  var d = formDades(), ed = AL.ed >= 0 ? AL.l[AL.ed] : null;
  if (!/^\d{1,2}:\d\d$/.test(d.hora)) { avis(T('Hora no vàlida'), 2500); return; }
  canvia(function (l) {
    if (ed) { for (var k = 0; k < l.length; k++) if (l[k].id == ed.id) { for (var c in d) if (d.hasOwnProperty(c)) l[k][c] = d[c]; l[k].on = true; delete l[k].aturat; delete l[k].pospos; } }
    else { d.id = id(); d.tipus = 'desp'; d.on = true; l.push(d); }
  }, function () { formTanca(); avis(T('Desat')); });
}
function pantalles() {
  getJson(api('pantalles/llista', { d: DISP.id, _: Date.now() }), function (l) { AL.pant = l || []; pinta(); pintaTdisp(); }, function () { });
  getJson(api('cast/dispositius'), function (l) { AL.casts = l || []; pinta(); pintaTdisp(); }, function () { });
}

window.casaMostra = function () { carrega(); pantalles(); clearInterval(AL.t); AL.t = setInterval(carrega, 15000); };
window.casaAmaga = function () { clearInterval(AL.t); };
ompleIcones();
pintaRapids();
pintaTdisp();
window.casaMostra();
</script>
</body>
</html>
