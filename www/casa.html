<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>Casa</title>
<script src="i18n.js"></script>
<style>
.esc{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:16px}
.esc span{display:inline-block;padding:11px 18px;border-radius:14px;background:rgba(255,255,255,.08);margin-right:10px;font-weight:600;cursor:pointer}
.esc span:active{background:#ffab3d;color:#111}
h2.g{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#8d95a1;margin:18px 0 10px}
.rj{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -6px}
.ap{width:25%;padding:6px}
.ap .c{background:rgba(255,255,255,.07);border-radius:20px;padding:14px;height:150px;position:relative;cursor:pointer;-webkit-transition:background .2s;transition:background .2s}
.ap.on .c{background:#f5f1e8;color:#1a1a1a}
.ap.off-line .c{opacity:.45}
.ap .ic{width:34px;height:34px;fill:#8d95a1}
.ap.on .ic{fill:#ff9f1c}
.ap .nm{font-weight:600;font-size:16px;margin-top:10px;line-height:1.2;max-height:2.4em;overflow:hidden}
.ap .es{font-size:13px;color:#8d95a1;margin-top:3px}
.ap.on .es{color:#6b6458}
.ap .fav{position:absolute;right:8px;top:8px;background:none;padding:4px}
.ap .fav .ic{width:22px;height:22px;fill:#5d6673}
.ap .fav.si .ic{fill:#ffab3d}
.ap input[type=range]{position:absolute;left:14px;right:14px;bottom:14px;width:auto;-webkit-appearance:none;height:28px;background:transparent}
.ap input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(128,128,128,.35)}
.ap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#ff9f1c;margin-top:-9px}
.ap .bts{position:absolute;left:10px;right:10px;bottom:10px;display:-webkit-flex;display:flex}
.ap .bts button{-webkit-flex:1;flex:1;margin:0 3px;padding:8px 0;font-size:13px}
.ap .inf{position:absolute;right:40px;top:8px;background:none;padding:4px 8px;font:700 15px Georgia,serif;color:#5d6673}
.ap .gran{font-size:30px;font-weight:300;margin-top:6px;line-height:1}
.ap .gran small{font-size:16px;color:#8d95a1;margin-left:6px}
#det{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:50;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#det .cx{max-width:560px;margin:30px auto;background:#1f242b;border-radius:22px;padding:20px;position:relative}
#det h3{margin:0 40px 4px 0;font-size:22px}
#det .tanca{position:absolute;right:14px;top:12px;background:none;font-size:26px;padding:4px 10px;color:#8d95a1}
#det .grans{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:14px -6px 6px}
#det .gv{-webkit-flex:1;flex:1;min-width:120px;margin:6px;background:rgba(255,255,255,.06);border-radius:16px;padding:12px 14px;cursor:pointer}
#det .gv.sel{background:rgba(255,171,61,.18)}
#det .gv b{display:block;font-size:30px;font-weight:300}
#det .gv span{font-size:13px;color:#8d95a1}
#det canvas{width:100%;height:150px;display:block;margin:6px 0 4px}
#det .fl{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;padding:10px 0;border-top:1px solid rgba(255,255,255,.07);font-size:15px}
#det .fl .k{-webkit-flex:1;flex:1;color:#aeb5bf}
#det .fl .v{text-align:right;max-width:60%;word-break:break-all;margin-left:8px}
#det .fl button{margin-left:6px;padding:7px 12px;font-size:13px}
#det .fl button.si{background:#ffab3d;color:#111}
#det .fl input[type=range]{width:150px;margin-left:8px;-webkit-appearance:none;height:28px;background:transparent}
#det input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:rgba(128,128,128,.35)}
#det input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:12px;background:#ff9f1c;margin-top:-9px}
#det .gris{font-size:13px}
.cams{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -6px}
.cam{width:50%;padding:6px}
.cam .c{position:relative;border-radius:20px;overflow:hidden;background:#000 center/cover no-repeat;padding-top:56.25%;cursor:pointer}
.cam .nm{position:absolute;left:12px;bottom:10px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:10px;font-weight:600;font-size:14px}
.cam .ld{position:absolute;left:0;right:0;top:45%;text-align:center;color:#8d95a1;font-size:13px}
#camg{position:fixed;left:0;top:0;right:0;bottom:0;background:#000;z-index:60;display:none}
#camg img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
#camg .bts{position:absolute;top:12px;right:12px}
#camg .bts .bt{position:static;margin-left:8px}
#camg .bt{position:absolute;top:12px;background:rgba(0,0,0,.55);color:#fff;border-radius:14px;padding:10px 16px;font-size:15px}
#camg .tn{position:absolute;left:16px;bottom:14px;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:10px;font-weight:600}
@media (orientation:portrait) and (max-width:600px){ .cam{width:100%} }
.ap.m-m,.ap.m-g{width:50%}
.ap.m-g .c{height:312px}
.ap .mes{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-top:8px;font-size:13px}
.ap .mes div{width:50%;padding:2px 8px 2px 0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ap .mes span{color:#8d95a1;margin-right:6px}
.ap.on .mes span{color:#6b6458}
.ap.m-p .mes{display:none}
.ap.m-m .mes{position:absolute;left:50%;right:14px;top:16px;margin:0;display:block}
.ap.m-m .mes div{width:auto;padding:3px 0}
.ap.m-m .nm,.ap.m-m .es{max-width:48%}
.ap canvas.gc.dr{left:50%;top:auto;bottom:14px;height:116px;width:calc(50% - 14px)}
.ap canvas.gc{position:absolute;left:14px;right:14px;bottom:12px;height:110px;width:calc(100% - 28px)}
#det .mides button{margin-left:6px}
@media (orientation:portrait){ .ap{width:33.33%} .ap.m-m,.ap.m-g{width:66.66%} }
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>Casa</h1></div>
  <div class="esc" id="esc"></div>
  <div id="cont"><div class="gris">Carregant…</div></div>
</div>
<div id="camg"></div>
<div id="det" onclick="if(event.target==this)tancaDet()"><div class="cx" id="detc"></div></div>
<script src="comu.js"></script>
<script>
dinsCasa('casa');
var ICA = {
  llum: 'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7z',
  endoll: 'M16 7V3h-2v4h-4V3H8v4c-1.1 0-2 .9-2 2v5.5L9.5 18v3h5v-3l3.5-3.5V9c0-1.1-.9-2-2-2z',
  persiana: 'M20 19V3H4v16H2v2h20v-2h-2zM16 9h2v2h-2V9zm-2 2H6V9h8v2zm4-4H6V5h12v2zm-4 6v2H6v-2h8zm2 0h2v2h-2v-2zm-10 4h12v2H6v-2z',

  altre: 'M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z',
  estrella: 'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z'
};
var GRUPS_CAT = [['llum', 'Llums', ['dj', 'dd', 'fwd', 'tgq', 'xdd', 'dc', 'tyndj', 'gyd']], ['endoll', 'Endolls i interruptors', ['cz', 'pc', 'kg', 'tdq', 'dlq', 'qjdcz']], ['persiana', 'Persianes i cortines', ['cl', 'clkg', 'mc']], ['clima', 'Clima', ['wk', 'kt', 'qn', 'rs', 'fs', 'kj', 'cs', 'wkf']], ['sensor', 'Sensors', ['wsdcg', 'mcs', 'pir', 'ywbj', 'rqbj', 'sj', 'co2bj', 'pm2.5', 'hjjcy', 'ldcg']]];

var CA = { l: [], fav: [], t: null, ocupat: 0, sp: {}, det: null, graf: null, punts: null, mides: {}, hist: {} };

function tipus(d) {

  return 'altre';
}

  if (typeof d.estat.bright_value == 'number') return { codi: 'bright_value', min: 25, max: 255 };
  return null;
}
var NOMS = {
  va_temperature: 'Temperatura', temp_current: 'Temperatura', temp_indoor: 'Temperatura', temp_set: 'Temperatura desitjada',
  va_humidity: 'Humitat', humidity_value: 'Humitat', humidity_current: 'Humitat', humidity_set: 'Humitat desitjada',
  battery_percentage: 'Bateria', va_battery: 'Bateria', battery_state: 'Bateria', battery_value: 'Bateria',
  temp_unit_convert: 'Unitat', maxtemp_set: 'Alarma temp. màxima', minitemp_set: 'Alarma temp. mínima', maxhum_set: 'Alarma humitat màxima', minihum_set: 'Alarma humitat mínima',
  temp_alarm: 'Alarma temperatura', hum_alarm: 'Alarma humitat', temp_sensitivity: 'Sensibilitat temperatura', hum_sensitivity: 'Sensibilitat humitat',
  bright_value: 'Brillantor', bright_value_v2: 'Brillantor', temp_value: 'Temperatura de color', temp_value_v2: 'Temperatura de color', colour_data: 'Color', colour_data_v2: 'Color',
  work_mode: 'Mode', mode: 'Mode', countdown: 'Temporitzador', countdown_1: 'Temporitzador', cur_power: 'Potència', cur_voltage: 'Voltatge', cur_current: 'Corrent', add_ele: 'Consum',
  doorcontact_state: 'Porta', pir: 'Moviment', percent_control: 'Posició', percent_state: 'Posició', control: 'Control', co2_value: 'CO₂', pm25_value: 'PM2.5', voc_value: 'COV',
  bright_state: 'Llum ambient', relay_status: 'En tornar el corrent', light_mode: 'Indicador', child_lock: 'Bloqueig infantil', fan_speed: 'Ventilador', fan_speed_enum: 'Ventilador',
  switch: 'Encès', switch_led: 'Encès', switch_1: 'Interruptor 1', switch_2: 'Interruptor 2', switch_3: 'Interruptor 3', switch_4: 'Interruptor 4', switch_usb1: 'USB', led_switch: 'Llum', start: 'Encès',
  smoke_sensor_status: 'Fum', gas_sensor_status: 'Gas', watersensor_state: 'Aigua', tamper_alarm: 'Manipulació'
};
var TEMPS = ['va_temperature', 'temp_current', 'temp_indoor'], HUMS = ['va_humidity', 'humidity_value', 'humidity_current'], BATS = ['battery_percentage', 'va_battery', 'battery_value'];
function specDe(d, codi) {
  var sp = CA.sp[d.id], l, i;
  if (!sp) return null;
  l = (sp.status || []).concat(sp.functions || []);
  for (i = 0; i < l.length; i++) if (l[i].code == codi) {
    if (!l[i]._v) { try { l[i]._v = typeof l[i].values == 'string' ? JSON.parse(l[i].values) : (l[i].values || {}); } catch (e) { l[i]._v = {}; } }
    return l[i];
  }
  return null;
}
function escriptura(d, codi) {
  var sp = CA.sp[d.id], l = (sp && sp.functions) || [];
  for (var i = 0; i < l.length; i++) if (l[i].code == codi) { specDe(d, codi); if (!l[i]._v) { try { l[i]._v = typeof l[i].values == 'string' ? JSON.parse(l[i].values) : (l[i].values || {}); } catch (e) { l[i]._v = {}; } } return l[i]; }
  return null;
}
// numeric value with the right scale and unit (from the device specification when known)
function valorNum(d, codi) {
  var v = d.estat[codi], s = specDe(d, codi), sc, u = '';
  if (typeof v != 'number') return null;
  if (s && s._v && typeof s._v.scale == 'number') sc = s._v.scale;
  else if (codi == 'va_temperature' || codi == 'temp_indoor' || (codi == 'temp_current' && Math.abs(v) > 60)) sc = 1;
  else if (codi == 'cur_power' || codi == 'cur_voltage') sc = 1;
  else if (codi == 'add_ele') sc = 3;
  else sc = 0;
  if (s && s._v && s._v.unit) u = s._v.unit;
  else if (TEMPS.indexOf(codi) >= 0 || /^(temp_set|maxtemp|minitemp)/.test(codi)) u = '°';
  else if (HUMS.indexOf(codi) >= 0 || BATS.indexOf(codi) >= 0 || /percent|humidity_set|hum_set/.test(codi)) u = '%';
  else if (codi == 'cur_power') u = 'W'; else if (codi == 'cur_voltage') u = 'V'; else if (codi == 'cur_current') u = 'mA'; else if (codi == 'add_ele') u = 'kWh';
  if (u == '℃' || u == 'C' || u == '°C') u = '°';
  var n = v / Math.pow(10, sc);
  return { n: n, t: n.toFixed(sc ? 1 : 0) + (u == '°' || u == '%' || !u ? '' : ' ') + u };
}
function primer(d, l) { for (var i = 0; i < l.length; i++) if (typeof d.estat[l[i]] == 'number') return l[i]; return null; }
function textValor(d, codi) {
  var v = d.estat[codi], n, br = brillantor(d);
  if (br && br.codi == codi && typeof v == 'number') return Math.round(100 * (v - br.min) / (br.max - br.min)) + '%';
  n = valorNum(d, codi);
  if (n) return n.t;
  if (typeof v == 'boolean') {
    if (codi == 'doorcontact_state') return v ? T('Obert') : T('Tancat');
    if (/alarm|sensor_status|state$|lock/.test(codi)) return v ? T('Sí') : T('No');
    return v ? T('Encès') : T('Apagat');
  }
  if (codi == 'battery_state') return { low: T('Baixa'), middle: T('Mitjana'), high: T('Alta') }[v] || v;
  if (codi == 'pir') return v == 'pir' ? T('Sí') : T('No');
  if (codi == 'temp_unit_convert') return v == 'f' ? '°F' : '°C';
  if (typeof v == 'string') return textEnum(codi, v);
  if (v && typeof v == 'object') return JSON.stringify(v);
  return v == null ? '' : String(v);
}
function textEnum(c, v) {
  if (c == 'temp_unit_convert') return v == 'f' ? '°F' : '°C';
  var m = { white: T('Blanc'), colour: T('Color'), scene: T('Escena'), music: T('Música'), on: T('Encès'), off: T('Apagat'), memory: T('Recorda'), relay: T('Estat'), pos: T('Posició'), none: T('Cap'), open: '▲', stop: '■', close: '▼', auto: T('Automàtic'), manual: T('Manual'), low: T('Baix'), middle: T('Mitjà'), high: T('Alt') };
  return m[v] || v;
}
function nomCodi(c) { return NOMS[c] ? T(NOMS[c]) : c.replace(/_/g, ' ').replace(/^./, function (x) { return x.toUpperCase(); }); }
function textBat(d) {
  var c = primer(d, BATS);
  if (c) return '🔋 ' + textValor(d, c);
  if (d.estat.battery_state) return '🔋 ' + textValor(d, 'battery_state');
  return '';
}
function textEstat(d) {
  var e = d.estat, s = [], b;
  if (!d.online) return T('Desconnectat');
  if (primer(d, TEMPS) || primer(d, HUMS)) return textBat(d);
  if (typeof e.percent_state == 'number') s.push(e.percent_state + '%');
  if (typeof e.doorcontact_state == 'boolean') s.push(textValor(d, 'doorcontact_state'));
  if (e.pir != null) s.push(T('Moviment') + ': ' + textValor(d, 'pir'));
  if (typeof e.cur_power == 'number' && e.cur_power > 0) s.push(textValor(d, 'cur_power'));
  b = textBat(d); if (b) s.push(b);
  var sw = interruptor(d);
  if (sw && !s.length) s.push(e[sw] ? T('Encès') : T('Apagat'));
  b = brillantor(d);
  if (b && sw && e[sw]) s.push(Math.round(100 * (e[b.codi] - b.min) / (b.max - b.min)) + '%');
  return s.join(' · ');
}
// big reading on the tile (thermometers and the like)
function lecturaGran(d) {
  if (!d.online) return '';
  var t = primer(d, TEMPS), h = primer(d, HUMS);
  if (!t && !h) return '';
  return '<div class="gran">' + (t ? esc(textValor(d, t)) : '') + (h ? (t ? '<small>' : '') + esc(textValor(d, h)) + (t ? '</small>' : '') : '') + '</div>';
}
// load the specifications (scale, units, writable functions) once per device
function carregaSpecs() {
  for (var i = 0; i < CA.l.length; i++) (function (d) {
    if (CA.sp[d.id] || CA.sp['_' + d.id]) return;
    CA.sp['_' + d.id] = 1;
    getJson(api('tuya/especificacions', { id: d.id }), function (r) { CA.sp[d.id] = r || {}; pinta(); if (CA.det == d.id) pintaDet(); }, function () { });
  })(CA.l[i]);

function carrega(fresc) {
  clearTimeout(CA.t);

  getJson(api('tuya/dispositius', fresc ? { fresc: 1 } : {}), function (l) {
    CA.l = l || []; CA.err = null;
    pinta();
    carregaSpecs();
    if (CA.det) pintaDet();
    CA.t = setTimeout(carrega, 6000);

    CA.t = setTimeout(carrega, 20000);
  });

function pinta() {
  var grups = {}, i, d, h = '';

  for (i = 0; i < CA.l.length; i++) {

    var t = tipus(d);

  var ordre = GRUPS_CAT.concat([['altre', 'Altres', []]]);
  for (i = 0; i < ordre.length; i++) {
    var g = grups[ordre[i][0]];

  $('cont').innerHTML = h || '<div class="gris">' + T('No hi ha cap aparell.') + '</div>';
  camRefresca();
  grafsCaixes();
}
function rajola(i) {
  var d = CA.l[i], sw = interruptor(d), on = sw && d.estat[sw], b = brillantor(d), t = tipus(d), fav = CA.fav.indexOf(d.id) >= 0, extra = '';
  if (b && sw) extra = '<input type="range" min="' + b.min + '" max="' + b.max + '" value="' + d.estat[b.codi] + '" onclick="event.stopPropagation()" ontouchstart="event.stopPropagation();CA.ocupat=Date.now()" onchange="brillo(' + i + ',this.value)">';
  else if (d.cat == 'cl' || d.estat.control != null) extra = '<div class="bts"><button onclick="event.stopPropagation();ordre(' + i + ',\'control\',\'open\')">▲</button><button onclick="event.stopPropagation();ordre(' + i + ',\'control\',\'stop\')">■</button><button onclick="event.stopPropagation();ordre(' + i + ',\'control\',\'close\')">▼</button></div>';
  var m = mida(d), mes = '', gc = primer(d, TEMPS) || primer(d, HUMS);

  return '<div class="ap m-' + m + (on ? ' on' : '') + (d.online ? '' : ' off-line') + '"><div class="c" onclick="toca(' + i + ')">' +
    svg(ICA[t] || ICA.altre) + (sw ? '<button class="inf" onclick="event.stopPropagation();obreDet(' + i + ')">i</button>' : '') + '<button class="fav' + (fav ? ' si' : '') + '" onclick="event.stopPropagation();canviaFav(' + i + ')">' + svg(ICA.estrella) + '</button>' +
    '<div class="nm">' + esc(d.nom) + '</div>' + lecturaGran(d) + '<div class="es">' + esc(textEstat(d)) + '</div>' + mes + extra + '</div></div>';
}
function toca(i) {
  var d = CA.l[i], sw = interruptor(d);
  if (!sw) { obreDet(i); return; }
  if (!d.online) return;
  ordre(i, sw, !d.estat[sw]);
}
function brillo(i, v) { ordre(i, brillantor(CA.l[i]).codi, parseInt(v, 10)); }
function ordre(i, codi, valor) {
  var d = CA.l[i];
  CA.ocupat = Date.now();
  if (typeof valor != 'string') { d.estat[codi] = valor; pinta(); }
  peticio('POST', api('tuya/ordre'), JSON.stringify({ id: d.id, codi: codi, valor: valor }), function () {
    CA.ocupat = 0; setTimeout(function () { carrega(true); }, 800);
  }, function (st, txt) { var m = ''; try { m = JSON.parse(txt).error; } catch (e) { } avis(m || T('No s\'ha pogut'), 5000); CA.ocupat = 0; carrega(true); });
}
function trobaDisp(id) { for (var i = 0; i < CA.l.length; i++) if (CA.l[i].id == id) return i; return -1; }
function obreDet(i) {
  var d = CA.l[i];
  CA.det = d.id;
  CA.graf = primer(d, TEMPS) || primer(d, HUMS) || null;
  CA.punts = null;
  $('detc').innerHTML = '';
  $('det').style.display = 'block';
  pintaDet();
  if (CA.graf) carregaGraf();
}
function tancaDet() { CA.det = null; $('det').style.display = 'none'; }
function pintaDet() {
  var i = trobaDisp(CA.det);
  if (i < 0) return tancaDet();
  if (Date.now() - CA.ocupat < 3000 && $('detc').innerHTML) return;
  var d = CA.l[i], e = d.estat, h = '', k, grans = [], l = [];
  h += '<button class="tanca" onclick="tancaDet()">✕</button><h3>' + esc(d.nom) + '</h3><div class="gris">' + (d.online ? T('Connectat') : T('Desconnectat')) + '</div>';
  for (k in e) if (e.hasOwnProperty(k)) {
    if (TEMPS.indexOf(k) >= 0 || HUMS.indexOf(k) >= 0 || k == 'co2_value' || k == 'pm25_value' || k == 'cur_power') grans.push(k); else l.push(k);
  }
  if (grans.length) {
    h += '<div class="grans">';
    for (k = 0; k < grans.length; k++) h += '<div class="gv' + (grans[k] == CA.graf ? ' sel' : '') + '" onclick="triaGraf(' + k + ')"><b>' + esc(textValor(d, grans[k])) + '</b><span>' + esc(nomCodi(grans[k])) + '</span></div>';
    h += '</div>';
    if (CA.graf) h += '<canvas id="graf"></canvas><div class="gris" id="grafi">' + T('Carregant…') + '</div>';
  }
  CA.grans = grans; CA.files = l;
  for (k = 0; k < l.length; k++) h += filaDet(d, i, k);
  var md = mida(d), ms = [['p', 'Petita'], ['m', 'Mitjana'], ['g', 'Gran']];
  h += '<div class="fl mides"><span class="k">' + esc(T('Mida de la caixa')) + '</span>';
  for (k = 0; k < ms.length; k++) h += '<button class="' + (md == ms[k][0] ? 'si' : '') + '" onclick="canviaMida(\'' + ms[k][0] + '\')">' + esc(T(ms[k][1])) + '</button>';
  h += '</div>';
  $('detc').innerHTML = h;
  if (CA.graf && CA.punts && CA.punts.codi == CA.graf) dibuixaGraf();
}
function filaDet(d, i, k) {
  var c = CA.files[k], v = d.estat[c], f = d.online ? escriptura(d, c) : null, ctl = '', j;
  if (f && typeof v == 'boolean') ctl = '<button class="' + (v ? 'si' : '') + '" onclick="canviDet(' + k + ',' + (!v) + ')">' + (v ? T('Encès') : T('Apagat')) + '</button>';
  else if (f && f.type == 'Enum' && f._v.range && f._v.range.length <= 6) {
    for (j = 0; j < f._v.range.length; j++) ctl += '<button class="' + (f._v.range[j] == v ? 'si' : '') + '" onclick="canviDet(' + k + ',null,' + j + ')">' + esc(textEnum(c, f._v.range[j])) + '</button>';
  } else if (f && f.type == 'Integer' && typeof v == 'number' && typeof f._v.max == 'number') {
    ctl = '<span class="v" id="dv' + k + '">' + esc(textValor(d, c)) + '</span><input type="range" min="' + f._v.min + '" max="' + f._v.max + '" step="' + (f._v.step || 1) + '" value="' + v + '" ontouchstart="CA.ocupat=Date.now()" onchange="canviDet(' + k + ',parseInt(this.value,10))">';
  }
  return '<div class="fl"><span class="k">' + esc(nomCodi(c)) + '</span>' + (ctl ? '' : '<span class="v">' + esc(textValor(d, c)) + '</span>') + ctl + '</div>';
}
function canviDet(k, v, j) {
  var i = trobaDisp(CA.det), c = CA.files[k];
  if (i < 0) return;
  if (j != null) { v = escriptura(CA.l[i], c)._v.range[j]; CA.l[i].estat[c] = v; }
  ordre(i, c, v);
  CA.ocupat = 0; pintaDet();
}
function triaGraf(k) { CA.graf = CA.grans[k]; CA.punts = null; pintaDet(); carregaGraf(); }
function carregaGraf() {
  var id = CA.det, c = CA.graf;
  getJson(api('tuya/historial', { id: id, codi: c }), function (r) {
    if (CA.det != id || CA.graf != c) return;
    CA.punts = { codi: c, l: (r && r.punts) || [] };
    dibuixaGraf();
  }, function (st, txt) {
    var m = ''; try { m = JSON.parse(txt).error; } catch (e) { }
    if ($('grafi')) $('grafi').innerHTML = esc(T('No hi ha historial disponible') + (m ? ' (' + m + ')' : ''));
    var g = $('graf'); if (g) g.style.display = 'none';
  });
}
/* dibuixa 24 h d'una lectura en un canvas; compacte = sense eixos (per a les caixes grans) */
function tracaGraf(g, d, c, punts, compacte) {
  var p = [], k, n, o, mn = 1e9, mx = -1e9, ara = Date.now(), t0 = ara - 864e5;
  for (k = 0; k < punts.length; k++) {
    var x = +punts[k][0], y = parseFloat(punts[k][1]);
    if (isNaN(x) || isNaN(y)) continue;
    o = {}; o[c] = y;
    n = valorNum({ id: d.id, estat: o }, c);
    if (n) p.push([x, n.n]);
  }
  if (p.length < 2) return null;
  p.sort(function (a, b) { return a[0] - b[0]; });
  /* a les caixes, l'eix comença on comencen les dades (si n'hi ha menys de 24 h) */
  if (compacte && p[0][0] > t0 && ara - p[0][0] > 36e5) t0 = p[0][0];
  for (k = 0; k < p.length; k++) { if (p[k][1] < mn) mn = p[k][1]; if (p[k][1] > mx) mx = p[k][1]; }
  var rmn = mn, rmx = mx;
  if (mx - mn < 1) { mx += .5; mn -= .5; }
  var r = window.devicePixelRatio || 1, W = g.offsetWidth, H = g.offsetHeight;
  if (!W || !H) return null;
  g.width = W * r; g.height = H * r;
  var cx = g.getContext('2d'); cx.scale(r, r);
  var L = compacte ? 2 : 34, B = compacte ? 4 : 18, Tp = compacte ? 18 : 6;
  function fx(t) { return L + (W - L - 4) * (t - t0) / (ara - t0); }
  function fy(v) { return Tp + (H - B - Tp - (compacte ? 0 : 6)) * (1 - (v - mn) / (mx - mn)); }
  if (!compacte) {
    cx.font = '11px sans-serif'; cx.fillStyle = '#8d95a1'; cx.strokeStyle = 'rgba(255,255,255,.08)'; cx.lineWidth = 1;
    for (k = 0; k <= 2; k++) { var v = mn + (mx - mn) * k / 2, yy = fy(v); cx.beginPath(); cx.moveTo(L, yy); cx.lineTo(W, yy); cx.stroke(); cx.fillText(v.toFixed(mx - mn < 5 ? 1 : 0), 2, yy + 4); }
    for (k = 0; k <= 4; k++) { var tt = t0 + 864e5 * k / 4, dt = new Date(tt); cx.fillText((dt.getHours() < 10 ? '0' : '') + dt.getHours() + 'h', Math.max(L, Math.min(fx(tt) - 8, W - 24)), H - 3); }
  } else {
    cx.beginPath(); cx.moveTo(fx(p[0][0]), H);
    for (k = 0; k < p.length; k++) cx.lineTo(fx(p[k][0]), fy(p[k][1]));
    cx.lineTo(fx(p[p.length - 1][0]), H); cx.closePath();
    cx.fillStyle = 'rgba(255,171,61,.14)'; cx.fill();
    var hr = Math.round((ara - t0) / 36e5);
    cx.font = '11px sans-serif'; cx.fillStyle = '#8d95a1';
    cx.fillText(hr + ' h · ' + T('mín.') + ' ' + rmn.toFixed(1) + ' · ' + T('màx.') + ' ' + rmx.toFixed(1), 2, 11);
  }
  cx.strokeStyle = '#ffab3d'; cx.lineWidth = 2; cx.beginPath();
  for (k = 0; k < p.length; k++) { if (k) cx.lineTo(fx(p[k][0]), fy(p[k][1])); else cx.moveTo(fx(p[k][0]), fy(p[k][1])); }
  cx.stroke();
  return { mn: rmn, mx: rmx };
}
function dibuixaGraf() {
  var g = $('graf'), i = trobaDisp(CA.det);
  if (!g || i < 0) return;
  var m = tracaGraf(g, CA.l[i], CA.punts.codi, CA.punts.l, false);
  if (!m) { $('grafi').innerHTML = T('Encara no hi ha prou dades de les últimes 24 hores.'); g.style.display = 'none'; return; }
  $('grafi').innerHTML = esc(T('Últimes 24 hores') + ' · ' + T('mín.') + ' ' + m.mn.toFixed(1) + ' · ' + T('màx.') + ' ' + m.mx.toFixed(1));
}
/* ---------- Mides de les caixes: petita (1 casella), mitjana (2 d'ample) i gran (2×2) ---------- */
function mida(d) { return CA.mides[d.id] || 'p'; }
function canviaMida(m) {
  var i = trobaDisp(CA.det); if (i < 0) return;
  if (m == 'p') delete CA.mides[CA.l[i].id]; else CA.mides[CA.l[i].id] = m;
  post(api('dades', { n: 'casa_mides' }), JSON.stringify(CA.mides), function () { }, errXarxa(T('desar')));
  CA.ocupat = 0; pinta(); pintaDet();
}
/* les lectures que no surten en gran: a la caixa mitjana unes quantes, a la gran totes */
function mesDades(d, max) {
  var e = d.estat, k, h = '', n = 0, fora = [primer(d, TEMPS), primer(d, HUMS), interruptor(d), 'battery_state', 'temp_unit_convert'].concat(BATS);
  var b = brillantor(d); if (b) fora.push(b.codi);
  for (k in e) if (e.hasOwnProperty(k)) {
    if (fora.indexOf(k) >= 0 || e[k] == null || typeof e[k] == 'object' || /^colour_data|countdown/.test(k)) continue;
    if (n >= max) break;
    h += '<div><span>' + esc(nomCodi(k)) + '</span>' + esc(textValor(d, k)) + '</div>'; n++;
  }
  return n ? '<div class="mes">' + h + '</div>' : '';
}
/* l'historial de les caixes grans, guardat 10 minuts */
function grafsCaixes() {
  var cs = document.querySelectorAll('canvas.gc'), k;
  for (k = 0; k < cs.length; k++) (function (g) {
    var id = g.getAttribute('data-id'), c = g.getAttribute('data-c'), i = trobaDisp(id), clau = id + '|' + c, h = CA.hist[clau];
    if (i < 0) return;
    if (h && h.l) tracaGraf(g, CA.l[i], c, h.l, true);
    if (h && Date.now() - h.t < 6e5) return;
    CA.hist[clau] = { t: Date.now(), l: h ? h.l : null };
    getJson(api('tuya/historial', { id: id, codi: c }), function (r) {
      CA.hist[clau] = { t: Date.now(), l: (r && r.punts) || [] };
      var gs = document.querySelectorAll('canvas.gc'), j;
      for (j = 0; j < gs.length; j++) if (gs[j].getAttribute('data-id') == id && gs[j].getAttribute('data-c') == c) tracaGraf(gs[j], CA.l[trobaDisp(id)], c, CA.hist[clau].l, true);
    }, function () { });
  })(cs[k]);
}
function canviaFav(i) {
  var id = CA.l[i].id, p = CA.fav.indexOf(id);
  if (p >= 0) CA.fav.splice(p, 1); else CA.fav.push(id);
  desaDades('casa_fav', CA.fav);
  if (Casa && Casa.casaCanviada) Casa.casaCanviada();
  pinta();
}
/* ---------- Càmeres: trossos de webs (CloudEdge...) retallats des del navegador i desats a Casa ---------- */
var CM = { l: [], ts: {}, gran: null, tg: null, gen: 0 };
function pintaErr() {
  var cfg = CA.err == 'cfg';
  $('cont').innerHTML = camHtml() + (cfg && CM.l.length ? '' : '<div class="ajuda">' + (cfg ? T('Encara no has connectat Tuya. Ves a Configuració ▸ Casa (Tuya) i segueix els passos.') : esc(CA.err)) + '</div>');
  camRefresca();
}
function camCarrega() {
  dades('webs', function (d) {
    CM.l = (d || []).filter(function (w) { return w.lloc == 'casa'; });
    if (CA.err) pintaErr(); else pinta();
  });
}
function camHtml() {
  if (!CM.l.length) return '';
  var h = '<h2 class="g">' + esc(T('Càmeres')) + '</h2><div class="cams">';
  for (var i = 0; i < CM.l.length; i++) h += '<div class="cam"><div class="c" id="cam-' + esc(CM.l[i].id) + '" onclick="camObre(' + i + ')"' + (CM[CM.l[i].id] ? ' style="background-image:' + bg(CM[CM.l[i].id]) + '"' : '') + '>' + (CM[CM.l[i].id] ? '' : '<div class="ld">' + esc(T('Connectant…')) + '</div>') + '<div class="nm">' + esc(CM.l[i].nom || '') + '</div></div></div>';
  return h + '</div>';
}
function camRefresca() {
  var gen = CM.gen;
  for (var i = 0; i < CM.l.length; i++) (function (w) {
    if (CM.ts[w.id]) return;
    function va() {
      CM.ts[w.id] = 0;
      if (gen != CM.gen || !CA.visible || CM.gran || !$('cam-' + w.id)) return;
      var u = api('web/imatge', { id: w.id, min: 2500, t: Date.now() }), im = new Image();
      CM.ts[w.id] = -1;
      im.onload = function () { if (gen != CM.gen) return; CM[w.id] = u; var e = $('cam-' + w.id); if (e) { e.style.backgroundImage = bg(u); var l = e.querySelector('.ld'); if (l) l.parentNode.removeChild(l); } CM.ts[w.id] = setTimeout(va, 3000); };
      im.onerror = function () { if (gen == CM.gen) CM.ts[w.id] = setTimeout(va, 10000); };
      im.src = u;
    }
    va();
  })(CM.l[i]);
}
function camAtura() { CM.gen++; for (var k in CM.ts) if (CM.ts.hasOwnProperty(k)) { if (CM.ts[k] > 0) clearTimeout(CM.ts[k]); } CM.ts = {}; }
/* a pantalla completa, tan de pressa com arribin les imatges */
function camObre(i) {
  var w = CM.l[i];
  CM.gran = w;
  camAtura();
  $('camg').innerHTML = '<img id="camg-i" onclick="camToc(event)"' + (CM[w.id] ? ' src="' + esc(CM[w.id]) + '"' : '') + '><div class="tn">' + esc(w.nom || '') + '</div>' +
    '<div class="bts"><button class="bt" onclick="camEdita()">✎ ' + esc(T('Edita')) + '</button><button class="bt" onclick="camWeb()">' + esc(T('Controls')) + '</button><button class="bt" onclick="camTanca()">✕</button></div>' +
    (CM.l.length > 1 ? '<button class="bt" style="left:12px" onclick="camObre(' + ((i + 1) % CM.l.length) + ')">' + esc(T('Següent')) + ' ›</button>' : '');
  $('camg').style.display = 'block';
  clearTimeout(CM.tg);
  (function va() {
    if (CM.gran != w) return;
    var u = api('web/imatge', { id: w.id, min: 700, t: Date.now() }), im = new Image();
    im.onload = function () { if (CM.gran != w) return; CM[w.id] = u; $('camg-i').src = u; CM.tg = setTimeout(va, 250); };
    im.onerror = function () { CM.tg = setTimeout(va, 3000); };
    im.src = u;
  })();
}
/* el nom i el text que el servidor toca per engegar el directe (p. ex. «Jardí» a CloudEdge) */
function camEdita() {
  var w = CM.gran; if (!w) return;
  var nom = prompt(T('Nom de la càmera'), w.nom || ''); if (nom == null) return;
  var cl = prompt(T('Què s\'ha de tocar a la web per arribar al vídeo? Els textos dels botons, per ordre i separats per comes (p. ex. Entrar, Jardí)'), w.clica || ('Entrar, ' + nom)); if (cl == null) return;
  dades('webs', function (l) {
    l = l || [];
    for (var i = 0; i < l.length; i++) if (l[i].id == w.id) { l[i].nom = nom; l[i].clica = cl.replace(/^\s+|\s+$/g, ''); }
    post(api('dades', { n: 'webs' }), JSON.stringify(l), function () {
      w.nom = nom; w.clica = cl;
      try { if (Casa && Casa.websCanviades) Casa.websCanviades(l); } catch (e) { }
      var t = document.querySelector('#camg .tn'); if (t) t.textContent = nom;
      avis(T('Desat'), 2000);
    }, errXarxa(T('desar')));
  });
}
/* un toc a la imatge en gran és un toc a la web de la càmera (per entrar al compte, triar la càmera...) */
function camToc(ev) {
  var w = CM.gran, im = $('camg-i'); if (!w || !im.naturalWidth) return;
  var W = im.clientWidth, H = im.clientHeight, sc = Math.min(W / im.naturalWidth, H / im.naturalHeight);
  var dw = im.naturalWidth * sc, dh = im.naturalHeight * sc, r = im.getBoundingClientRect();
  var fx = (ev.clientX - r.left - (W - dw) / 2) / dw, fy = (ev.clientY - r.top - (H - dh) / 2) / dh;
  if (fx < 0 || fy < 0 || fx > 1 || fy > 1) return;
  post(api('web/clic', { id: w.id, x: fx.toFixed(4), y: fy.toFixed(4) }), '', function () { }, function () { });
}
function camTanca() { CM.gran = null; clearTimeout(CM.tg); $('camg').style.display = 'none'; camRefresca(); }
/* per moure la càmera, parlar o veure gravacions: la web sencera al navegador */
function camWeb() { var w = CM.gran; camTanca(); if (Casa && Casa.obre) Casa.obre('webs', w.url); }
function escenes() {
  getJson(api('tuya/escenes'), function (d) {
    var l = (d && d.escenes) || [], h = '';
    CA.esc = l;
    for (var i = 0; i < l.length; i++) h += '<span onclick="escena(' + i + ')">' + esc(l[i].nom) + '</span>';
    $('esc').innerHTML = h;
  }, function () { });
}
function escena(i) {
  var e = CA.esc[i];
  post(api('tuya/escena', { casa: e.casa, id: e.id }), '', function () { avis(Tf('«{1}» activada', e.nom)); setTimeout(function () { carrega(true); }, 1500); }, errXarxa(T('activar l\'escena')));
}
window.casaMostra = function () { CA.visible = true; carrega(true); camCarrega(); };
window.casaAmaga = function () { CA.visible = false; clearTimeout(CA.t); tancaDet(); camTanca(); camAtura(); };
CA.visible = true;
dades('casa_fav', function (f) { CA.fav = f || []; dades('casa_mides', function (m) { CA.mides = m && typeof m == 'object' && !m.length ? m : {}; carrega(); escenes(); camCarrega(); }); });
