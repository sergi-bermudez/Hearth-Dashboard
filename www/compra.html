<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<script src="i18n.js"></script>
<title>Compra</title>
<style>
html,body{height:100%;overflow:hidden}
#app{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex}
#esq{-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#dre{width:340px;-webkit-flex:none;flex:none;background:#141416;border-left:1px solid rgba(255,255,255,.07);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.cap{padding:14px 14px 8px;-webkit-flex:none;flex:none}
.cerca{display:-webkit-flex;display:flex}
.cerca input{-webkit-flex:1;flex:1;font-size:17px}
.cerca button{margin-left:8px;width:48px;padding:0}
.cerca button .ic{width:24px;height:24px}
.chips{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0 2px}
.chips span{display:inline-block;margin-right:6px;padding:8px 13px;border-radius:18px;background:#2c2c2e;cursor:pointer;font-size:15px}
.chips span.on{background:#fff;color:#111}
.chips.b span{padding:5px 11px;font-size:13px;background:transparent;border:1.5px solid #3a3a3c}
.chips.b span.on{background:#3a3a3c;color:#fff}
.chips.b span i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
#graella{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 20px}
.t{display:inline-block;vertical-align:top;width:calc(25% - 8px);margin:4px;background:#1c1c1e;border-radius:14px;position:relative;cursor:pointer;overflow:hidden}
.t .im{height:96px;background:#fff center/contain no-repeat;border-bottom:1px solid rgba(255,255,255,.05)}
.t .em{height:96px;line-height:96px;text-align:center;font-size:46px;background:#232326}
.t .tx{padding:7px 9px 9px}
.t .nm{font-size:14px;line-height:1.25;height:2.5em;overflow:hidden}
.t .qn{font-size:12px;color:#8d95a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.t .pr{font-size:17px;font-weight:700;margin-top:3px}
.t .pr s{font-size:12px;font-weight:400;color:#8d95a1;margin-left:5px}
.t .bt{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:8px}
.t .dc{position:absolute;right:8px;top:8px;background:#ff453a;color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px}
.t .st{position:absolute;right:4px;top:64px;width:34px;height:34px;line-height:34px;text-align:center;font-size:20px;color:#ffd60a;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.t .qt{position:absolute;left:8px;top:64px;min-width:28px;height:28px;line-height:28px;border-radius:14px;background:#30d158;color:#04210f;font-weight:700;text-align:center;font-size:15px;padding:0 6px}
.t.esg{opacity:.5}
.t.lliure .em{font-size:30px}
.buit{padding:30px 10px;color:#8d95a1;text-align:center}
#dre .cap h2{margin:0;font-size:22px}
#dre .cap .tot{color:#8d95a1;font-size:13px;margin-top:3px}
#llista{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px}
.ci{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#1c1c1e;border-radius:12px;margin-bottom:6px;min-height:50px}
.ci .ck{width:44px;height:50px;-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer}
.ci .ck i{display:block;width:22px;height:22px;border-radius:11px;border:2px solid #636366}
.ci.fet .ck i{background:#30d158;border-color:#30d158}
.ci .tx{-webkit-flex:1;flex:1;min-width:0;padding:6px 0;cursor:pointer}
.ci .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tx small{display:block;color:#8d95a1;font-size:12px}
.ci.fet .tx b{text-decoration:line-through;color:#8d95a1}
.ci .qb{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex:none;flex:none;margin-right:6px}
.ci .qb button{width:34px;height:34px;padding:0;border-radius:17px;font-size:18px;line-height:34px;background:#2c2c2e}
.ci .qb span{min-width:24px;text-align:center;font-weight:700}
.sec{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#8d95a1;margin:14px 4px 6px}
.peu{padding:10px;-webkit-flex:none;flex:none;border-top:1px solid rgba(255,255,255,.07)}
.peu button{margin:0 6px 6px 0}
.peu .wa{background:#25d366;color:#04210f;font-weight:600}
.peu .wa .ic{width:18px;height:18px;fill:#04210f;vertical-align:-3px;margin-right:6px}
#seg{display:none}
#tria{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:50;display:none}
#tria .card{position:absolute;left:50%;top:40px;width:460px;margin-left:-230px;max-height:85%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1c1c1e;border-radius:20px;padding:18px}
#tria h3{margin:0 0 10px}
#tria .xt{padding:13px 6px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:17px}
#tria .xt small{display:block;color:#8d95a1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tria input{margin-bottom:8px}
@media (max-width:900px){ .t{width:calc(33.333% - 8px)} #dre{width:300px} }
@media (max-width:700px){
  #app{display:block}
  #esq,#dre{position:absolute;top:52px;left:0;right:0;bottom:0;width:auto;border:0}
  body.v-llista #esq{display:none}
  body.v-prod #dre{display:none}
  #seg{display:-webkit-flex;display:flex;position:absolute;top:8px;left:10px;right:10px;height:38px;background:#2c2c2e;border-radius:10px;padding:3px}
  #seg span{-webkit-flex:1;flex:1;text-align:center;line-height:32px;border-radius:8px;cursor:pointer;font-size:15px}
  #seg span.on{background:#636366;font-weight:600}
  .t{width:calc(50% - 8px)}
  #tria .card{left:10px;right:10px;width:auto;margin-left:0;top:20px}
}
</style>
</head>
<body class="v-prod">
<div id="seg"><span id="sg-p" onclick="vista('p')">Productes</span><span id="sg-l" onclick="vista('l')">Llista</span></div>
<div id="app">
  <div id="esq">
    <div class="cap">
      <div class="cerca"><input type="search" id="q" placeholder="Cerca o escriu un producte" autocomplete="off" autocorrect="off"><button id="b-afg" onclick="afegeixText()"></button></div>
      <div class="chips" id="cats"></div>
      <div class="chips b" id="bots"></div>
    </div>
    <div id="graella"><div class="buit">Carregant…</div></div>
  </div>
  <div id="dre">
    <div class="cap"><h2>Llista</h2><div class="tot" id="tot"></div></div>
    <div id="llista"></div>
    <div class="peu" id="accions"></div>
  </div>
</div>
<div id="tria" onclick="if(event.target==this)this.style.display='none'"><div class="card" id="tria-c"></div></div>
<script src="comu.js"></script>
<script>
var Casa = null;
try { if (window.parent !== window && window.parent.Casa) Casa = window.parent.Casa; } catch (e) { Casa = null; }
var IC_MES = 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z';
var IC_WA = 'M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.02c-.24.68-1.42 1.3-1.95 1.35-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.82s.7-2 .95-2.27c.24-.27.53-.34.71-.34l.51.01c.16.01.38-.06.6.46.24.55.79 1.89.86 2.03.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.89 1.04.93 1.92 1.22 2.19 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.61-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.06.11.06.68-.18 1.36z';
/* Categories comunes (el servidor hi classifica els productes de totes les botigues) */
var CATS = [['fruita', '🍎', 'Fruita i verdura'], ['carn', '🥩', 'Carn'], ['peix', '🐟', 'Peix'], ['pa', '🥖', 'Pa i pastisseria'], ['xarcuteria', '🧀', 'Xarcuteria i formatges'], ['lactis', '🥛', 'Làctics i ous'],
  ['rebost', '🥫', 'Rebost'], ['begudes', '🧃', 'Begudes'], ['congelats', '🧊', 'Congelats'], ['neteja', '🧽', 'Neteja'], ['higiene', '🧴', 'Higiene i bellesa'], ['bebe', '🍼', 'Bebè'], ['animals', '🐾', 'Animals']];
var COLORS = ['#e3262e', '#2e8b3a', '#0a84ff', '#ff9f0a', '#bf5af2', '#64d2ff', '#ff375f'];
var L = { items: [], hist: {}, fav: [] }, VERSIO = '', EDITA = 0;
var V = { cat: 'fav', bot: '', q: '', res: [], est: null, tq: null };
$('b-afg').innerHTML = svg(IC_MES);
$('q').placeholder = T('Cerca o escriu un producte');
$('q').oninput = function () { clearTimeout(V.tq); V.tq = setTimeout(function () { V.q = $('q').value.replace(/^\s+|\s+$/g, ''); carregaGraella(); }, 350); };
$('q').onkeydown = function (e) { if ((e.keyCode || e.which) == 13) { e.preventDefault(); afegeixText(); } };

function vista(v) { document.body.className = v == 'l' ? 'v-llista' : 'v-prod'; $('sg-p').className = v == 'l' ? '' : 'on'; $('sg-l').className = v == 'l' ? 'on' : ''; }
vista('p');

/* ---------- Dades compartides entre aparells ---------- */
function carrega(primer) {
  dades('compra', function (d) {
    if (Date.now() - EDITA < 2500) return;
    var j = JSON.stringify(d || {});
    if (!primer && j == VERSIO) return;
    VERSIO = j;
    L = d && d.items ? d : { items: [], hist: (d && d.hist) || {} };
    if (!L.hist) L.hist = {};
    if (!L.fav) L.fav = [];
    /* llistes antigues: cada article necessita una clau */
    for (var i = 0; i < L.items.length; i++) if (!L.items[i].k) L.items[i].k = 'txt:' + clau(L.items[i].t);
    pintaLlista();
    if (primer || (V.cat == 'fav' && !V.q)) pintaGraella();
    else marcaQuantitats();
  });
}
function desa() { EDITA = Date.now(); VERSIO = JSON.stringify(L); desaDades('compra', L); }

/* ---------- Botigues i categories ---------- */
function botigues() { return (V.est && V.est.botigues) || []; }
function idxBot(id) { var l = botigues(); for (var i = 0; i < l.length; i++) if (l[i].id == id) return i; return -1; }
function colorBot(id) { var i = idxBot(id); return i >= 0 ? COLORS[i % COLORS.length] : '#636366'; }
function nomBot(id) { var i = idxBot(id); return i >= 0 ? botigues()[i].nom : ''; }
function pintaChips() {
  var n = (V.est && V.est.cats) || {}, h = '<span id="c-fav" onclick="triaCat(\'fav\')">⭐ ' + esc(T('Preferits')) + '</span>', i;
  if (V.est && V.est.promos) h += '<span id="c-promo" onclick="triaCat(\'promo\')">🏷️ ' + esc(T('Promocions')) + '</span>';
  for (i = 0; i < CATS.length; i++) if (n[CATS[i][0]]) h += '<span id="c-' + CATS[i][0] + '" onclick="triaCat(\'' + CATS[i][0] + '\')">' + CATS[i][1] + ' ' + esc(T(CATS[i][2])) + '</span>';
  $('cats').innerHTML = h;
  var bl = botigues(), b = '';
  if (bl.length > 1) {
    b = '<span id="b-" onclick="triaBot(\'\')">' + esc(T('Totes')) + '</span>';
    for (i = 0; i < bl.length; i++) b += '<span id="b-' + esc(bl[i].id) + '" onclick="triaBot(\'' + esc(bl[i].id) + '\')"><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(bl[i].nom) + '</span>';
  }
  $('bots').innerHTML = b; $('bots').style.display = b && V.est && V.est.n ? '' : 'none';
  marcaChips();
}
function marcaChips() {
  var l = $('cats').children, i;
  for (i = 0; i < l.length; i++) l[i].className = l[i].id == 'c-' + V.cat && !V.q ? 'on' : '';
  l = $('bots').children;
  for (i = 0; i < l.length; i++) l[i].className = l[i].id == 'b-' + V.bot ? 'on' : '';
}
function triaCat(c) { V.cat = c; V.q = ''; $('q').value = ''; carregaGraella(); $('graella').scrollTop = 0; }
function triaBot(b) { V.bot = b; carregaGraella(); }

/* ---------- Graella de productes (com la caixa d'un restaurant) ---------- */
function carregaGraella() {
  marcaChips();
  if (!V.q && V.cat == 'fav') { pintaGraella(); return; }
  if (!(V.est && V.est.n)) { V.res = []; pintaGraella(); return; }
  var p = { max: 80 };
  if (V.q) p.q = V.q; else if (V.cat == 'promo') p.promo = 1; else p.cat = V.cat;
  if (V.bot) p.b = V.bot;
  $('graella').innerHTML = '<div class="buit">' + T('Carregant…') + '</div>';
  getJson(api('compra/productes', p), function (r) { V.res = r || []; pintaGraella(); }, function () { V.res = []; pintaGraella(); });
}
function clau(t) { return String(t || '').toLowerCase().replace(/^\s*\d+([.,]\d+)?\s*(x|kg|g|l|ml|un)?\.?\s+/, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
function clauP(p) { return p.u ? p.u : 'txt:' + clau(p.n); }
function esFav(k) { for (var i = 0; i < L.fav.length; i++) if (L.fav[i].k == k) return true; return false; }
function euro(v) { return v ? (Math.round(v * 100) / 100).toFixed(2).replace('.', ',') + ' €' : ''; }
function htmlTile(p, i) {
  var k = clauP(p), h = '<div class="t' + (p.esg ? ' esg' : '') + (p.u ? '' : ' lliure') + '" data-k="' + esc(k) + '" onclick="tocaTile(' + i + ')">';
  h += p.img ? '<div class="im" style="background-image:' + bg(imgx(p.img, 200)) + '"></div>' : '<div class="em">' + (p.e || '🛒') + '</div>';
  if (p.b) h += '<span class="bt" style="background:' + colorBot(p.b) + '">' + esc(nomBot(p.b) || p.b) + '</span>';
  if (p.pv && p.pv > p.p) h += '<span class="dc">-' + Math.round((1 - p.p / p.pv) * 100) + '%</span>';
  if (!p.nou) h += '<span class="st" onclick="event.stopPropagation();commutaFav(' + i + ')">' + (esFav(k) ? '★' : '☆') + '</span>';
  h += '<span class="qt" style="display:none"></span>';
  h += '<div class="tx"><div class="nm">' + esc(p.n) + '</div><div class="qn">' + esc(p.q || '') + (p.pu ? ' · ' + euro(p.pu) + '/' + esc(p.uu || '') : '') + '</div>';
  if (p.p) h += '<div class="pr">' + euro(p.p) + (p.pv && p.pv > p.p ? '<s>' + euro(p.pv) + '</s>' : '') + '</div>';
  return h + '</div></div>';
}
var VIS = [];
function pintaGraella() {
  var l = [], h = '', i, k;
  if (!V.q && V.cat == 'fav') {
    for (i = 0; i < L.fav.length; i++) l.push(L.fav[i]);
    /* i el que s'acostuma a afegir escrivint */
    var hs = [];
    for (k in L.hist) if (L.hist.hasOwnProperty(k) && !esFav('txt:' + k)) hs.push(k);
    hs.sort(function (a, b) { return L.hist[b] - L.hist[a]; });
    for (i = 0; i < hs.length && i < 24; i++) l.push({ n: hs[i], e: '📝' });
    if (!l.length) h = '<div class="buit">' + (V.est && V.est.n ? T('Toca l\'estrella ☆ d\'un producte per tenir-lo aquí.') : T('Escriu el que vols a dalt. Per veure productes i preus de les teves botigues, afegeix-les a Configuració ▸ Compra.')) + '</div>';
  } else {
    l = V.res.slice(0);
    if (V.q) l.unshift({ n: V.q, e: '➕', nou: 1 });
    if (!V.res.length) h = '<div class="buit">' + (V.q ? T('Cap producte de les botigues amb aquest nom. Toca ➕ per afegir-lo igualment.') : T('No hi ha productes en aquesta categoria.')) + '</div>';
  }
  VIS = l;
  var t = '';
  for (i = 0; i < l.length; i++) t += htmlTile(l[i], i);
  $('graella').innerHTML = t + h;
  marcaQuantitats();
}
function marcaQuantitats() {
  var q = {}, i;
  for (i = 0; i < L.items.length; i++) if (!L.items[i].fet) q[L.items[i].k] = (q[L.items[i].k] || 0) + (L.items[i].q || 1);
  var ts = document.querySelectorAll('#graella .t');
  for (i = 0; i < ts.length; i++) {
    var n = q[ts[i].getAttribute('data-k')], b = ts[i].querySelector('.qt');
    b.style.display = n ? '' : 'none'; b.textContent = n || '';
  }
}
function tocaTile(i) {
  var p = VIS[i]; if (!p) return;
  afegeixProducte(p);
  if (p.nou) { $('q').value = ''; V.q = ''; carregaGraella(); }
}
function commutaFav(i) {
  var p = VIS[i], k = clauP(p);
  for (var j = 0; j < L.fav.length; j++) if (L.fav[j].k == k) { L.fav.splice(j, 1); desa(); pintaGraella(); return; }
  L.fav.unshift({ k: k, n: p.n, u: p.u || '', img: p.img || '', p: p.p || 0, pv: p.pv || 0, b: p.b || '', q: p.q || '', e: p.u ? '' : '📝' });
  desa(); pintaGraella();
}

/* ---------- Llista ---------- */
function afegeixProducte(p) {
  var k = clauP(p);
  for (var i = 0; i < L.items.length; i++) if (L.items[i].k == k) {
    if (L.items[i].fet) { L.items[i].fet = false; L.items[i].q = 1; } else L.items[i].q = (L.items[i].q || 1) + 1;
    desa(); pintaLlista(); marcaQuantitats(); return;
  }
  L.items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).substring(2, 5), k: k, t: p.n, q: 1, fet: false, p: p.p || 0, b: p.b || '', u: p.u || '', qn: p.q || '' });
  if (!p.u) L.hist[clau(p.n)] = (L.hist[clau(p.n)] || 0) + 1;
  desa(); pintaLlista(); marcaQuantitats();
}
function afegeixText() {
  var t = ($('q').value || '').replace(/^\s+|\s+$/g, '');
  if (!t) return;
  afegeixProducte({ n: t });
  $('q').value = ''; V.q = ''; carregaGraella();
}
function troba(id) { for (var i = 0; i < L.items.length; i++) if (L.items[i].id == id) return i; return -1; }
function commuta(id) { var i = troba(id); if (i >= 0) L.items[i].fet = !L.items[i].fet; desa(); pintaLlista(); marcaQuantitats(); }
function quant(id, d) {
  var i = troba(id); if (i < 0) return;
  L.items[i].q = (L.items[i].q || 1) + d;
  if (L.items[i].q <= 0) L.items.splice(i, 1);
  desa(); pintaLlista(); marcaQuantitats();
}
function netejaFets() { var r = []; for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]); L.items = r; desa(); pintaLlista(); marcaQuantitats(); }
function pendents() { var r = []; for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]); return r; }
function htmlItem(it) {
  var sub = [];
  if (it.b) sub.push(nomBot(it.b) || it.b);
  if (it.qn) sub.push(it.qn);
  if (it.p) sub.push(euro(it.p * (it.q || 1)));
  return '<div class="ci' + (it.fet ? ' fet' : '') + '"><div class="ck" onclick="commuta(\'' + it.id + '\')"><i></i></div>' +
    '<div class="tx" onclick="commuta(\'' + it.id + '\')"><b>' + esc(it.t) + '</b>' + (sub.length ? '<small>' + esc(sub.join(' · ')) + '</small>' : '') + '</div>' +
    (it.fet ? '' : '<div class="qb"><button onclick="quant(\'' + it.id + '\',-1)">−</button><span>' + (it.q || 1) + '</span><button onclick="quant(\'' + it.id + '\',1)">+</button></div>') + '</div>';
}
function pintaLlista() {
  var p = pendents(), f = [], h = '', i, tot = 0, nP = 0;
  for (i = 0; i < L.items.length; i++) if (L.items[i].fet) f.push(L.items[i]);
  for (i = 0; i < p.length; i++) { h += htmlItem(p[i]); if (p[i].p) { tot += p[i].p * (p[i].q || 1); nP++; } }
  if (!L.items.length) h = '<div class="buit">' + T('La llista és buida. Toca els productes per afegir-los.') + '</div>';
  if (f.length) { h += '<div class="sec">' + T('Al carro') + ' · ' + f.length + '</div>'; for (i = 0; i < f.length; i++) h += htmlItem(f[i]); }
  $('llista').innerHTML = h;
  $('tot').textContent = p.length ? Tf('{1} articles', p.length) + (nP ? ' · ' + (nP < p.length ? '≈ ' : '') + euro(tot) : '') : '';
  $('sg-l').textContent = T('Llista') + (p.length ? ' (' + p.length + ')' : '');
  var a = '';
  if (p.length) a += '<button class="wa" onclick="enviaWa()">' + svg(IC_WA) + T('Envia per WhatsApp') + '</button>';
  if (f.length) a += '<button onclick="netejaFets()">' + T('Treu els comprats') + '</button>';
  $('accions').innerHTML = a; $('accions').style.display = a ? '' : 'none';
}
/* Text per enviar: agrupat per botiga, amb quantitats i preus */
function textLlista() {
  var p = pendents(), g = {}, ord = [], i, j, t = '🛒 ' + T('Llista de la compra');
  for (i = 0; i < p.length; i++) { var b = p[i].b || ''; if (!g[b]) { g[b] = []; ord.push(b); } g[b].push(p[i]); }
  ord.sort(function (a, b) { return a && !b ? -1 : !a && b ? 1 : 0; });
  for (i = 0; i < ord.length; i++) {
    if (ord.length > 1 || ord[i]) t += '\n\n' + (ord[i] ? nomBot(ord[i]) || ord[i] : T('Altres')) + ':';
    else t += '\n';
    for (j = 0; j < g[ord[i]].length; j++) {
      var it = g[ord[i]][j];
      t += '\n• ' + ((it.q || 1) > 1 ? it.q + '× ' : '') + it.t + (it.qn ? ' (' + it.qn + ')' : '') + (it.p ? ' – ' + euro(it.p * (it.q || 1)) : '');
    }
  }
  return t;
}
function waActiu() { try { return !!(window.parent && window.parent.A && window.parent.A.ajustos.whatsapp); } catch (e) { return false; } }
function enviaWa() {
  if (!waActiu()) { obreWaMe(); return; }
  $('tria').style.display = 'block';
  $('tria-c').innerHTML = '<h3>' + T('Envia a…') + '</h3><div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('admin/wa/xats'), function (l) {
    l = l || [];
    var h = '<h3>' + T('Envia a…') + '</h3><input type="search" id="cerca" placeholder="' + esc(T('Cerca')) + '" oninput="filtra()"><div id="xts">';
    for (var i = 0; i < l.length; i++) h += '<div class="xt" data-n="' + esc(l[i].nom) + '" onclick="enviaA(this.getAttribute(\'data-n\'))">' + esc(l[i].nom) + (l[i].darrer ? '<small>' + esc(l[i].darrer) + '</small>' : '') + '</div>';
    if (!l.length) h += '<div class="gris" style="padding:10px 0">' + T('Encara no hi ha xats (o s\'estan carregant).') + '</div>';
    h += '</div><p><button onclick="obreWaMe()">' + T('Obre WhatsApp en aquest aparell') + '</button></p>';
    $('tria-c').innerHTML = h;
  }, function () { obreWaMe(); });
}
function filtra() {
  var q = ($('cerca').value || '').toLowerCase(), l = document.querySelectorAll('#xts .xt');
  for (var i = 0; i < l.length; i++) l[i].style.display = l[i].getAttribute('data-n').toLowerCase().indexOf(q) >= 0 ? '' : 'none';
}
function enviaA(nom) {
  $('tria-c').innerHTML = '<h3>' + esc(nom) + '</h3><div class="gris">' + T('Enviant…') + '</div>';
  peticio('POST', api('admin/wa/envia', { xat: nom }), textLlista(), function () {
    $('tria').style.display = 'none';
    avis(Tf('Llista enviada a {1}', nom));
  }, function () {
    $('tria-c').innerHTML = '<h3>' + esc(nom) + '</h3><p>' + T('No s\'ha pogut enviar.') + '</p><p><button onclick="obreWaMe()">' + T('Obre WhatsApp en aquest aparell') + '</button></p>';
  });
}
function obreWaMe() { $('tria').style.display = 'none'; window.open('https://wa.me/?text=' + encodeURIComponent(textLlista()), '_blank'); }

getJson(api('compra/estat'), function (d) { V.est = d; pintaChips(); pintaGraella(); pintaLlista(); }, function () { pintaChips(); });
carrega(true);
setInterval(function () { if (!document.hidden) carrega(false); }, 5000);
</script>
