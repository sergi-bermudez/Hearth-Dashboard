<!DOCTYPE html>
<html lang="ca">
<head>

<title>Compra</title>
<style>
html,body{height:100%;overflow:hidden}
#app{position:absolute;top:0;left:0;right:0;bottom:0;display:-webkit-flex;display:flex}
#esq{-webkit-flex:1;flex:1;min-width:0;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
#dre{width:340px;-webkit-flex:none;flex:none;background:#141416;border-left:1px solid rgba(255,255,255,.07);display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column}
.cap{padding:14px 14px 8px;-webkit-flex:none;flex:none}
.cerca{display:-webkit-flex;display:flex}
.cerca input{-webkit-flex:1;flex:1;font-size:17px}
.cerca button{margin-left:8px;width:48px;padding:0}
.cerca button .ic{width:24px;height:24px}
.chips{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0 2px}
.chips span{display:inline-block;margin-right:6px;padding:8px 13px;border-radius:18px;background:#2c2c2e;cursor:pointer;font-size:15px}
.chips span.on{background:#fff;color:#111}
.chips.b span{padding:5px 11px;font-size:13px;background:transparent;border:1.5px solid #3a3a3c}
.chips.b span.on{background:#3a3a3c;color:#fff}
.chips.b span i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;vertical-align:1px}
#graella{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 20px}
.t{display:inline-block;vertical-align:top;width:calc(25% - 8px);margin:4px;background:#1c1c1e;border-radius:14px;position:relative;cursor:pointer;overflow:hidden}
.t .im{height:96px;background:#fff center/contain no-repeat;border-bottom:1px solid rgba(255,255,255,.05)}
.t .em{height:96px;line-height:96px;text-align:center;font-size:46px;background:#232326}
.t .tx{padding:7px 9px 9px}
.t .nm{font-size:14px;line-height:1.25;height:2.5em;overflow:hidden}
.t .qn{font-size:12px;color:#8d95a1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}
.t .pr{font-size:17px;font-weight:700;margin-top:3px}
.t .pr s{font-size:12px;font-weight:400;color:#8d95a1;margin-left:5px}
.t .bt{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;color:#fff;padding:2px 7px;border-radius:8px}
.t .dc{position:absolute;right:8px;top:8px;background:#ff453a;color:#fff;font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px}
.t .st{position:absolute;right:4px;top:64px;width:34px;height:34px;line-height:34px;text-align:center;font-size:20px;color:#ffd60a;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.t .qt{position:absolute;left:8px;top:64px;min-width:28px;height:28px;line-height:28px;border-radius:14px;background:#30d158;color:#04210f;font-weight:700;text-align:center;font-size:15px;padding:0 6px}
.t.esg{opacity:.5}
.t.lliure .em{font-size:30px}
.buit{padding:30px 10px;color:#8d95a1;text-align:center}
#dre .cap h2{margin:0;font-size:22px}
#dre .cap .tot{color:#8d95a1;font-size:13px;margin-top:3px}
#llista{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px}
.ci{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#1c1c1e;border-radius:12px;margin-bottom:6px;min-height:50px}
.ci .ck{width:44px;height:50px;-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer}
.ci .ck i{display:block;width:22px;height:22px;border-radius:11px;border:2px solid #636366}
.ci.fet .ck i{background:#30d158;border-color:#30d158}
.ci .tx{-webkit-flex:1;flex:1;min-width:0;padding:6px 0;cursor:pointer}
.ci .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .tx small{display:block;color:#8d95a1;font-size:12px}
.ci.fet .tx b{text-decoration:line-through;color:#8d95a1}
.ci .qb{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex:none;flex:none;margin-right:6px}
.ci .qb button{width:34px;height:34px;padding:0;border-radius:17px;font-size:18px;line-height:34px;background:#2c2c2e}
.ci .qb span{min-width:24px;text-align:center;font-weight:700}
.sec{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:#8d95a1;margin:14px 4px 6px}
.peu{padding:10px;-webkit-flex:none;flex:none;border-top:1px solid rgba(255,255,255,.07)}
.peu button{margin:0 6px 6px 0}
.peu .wa{background:#25d366;color:#04210f;font-weight:600}
.peu .wa .ic{width:18px;height:18px;fill:#04210f;vertical-align:-3px;margin-right:6px}
.t .ds{font-size:13px;color:#c7ccd3;margin-top:4px;height:34px;overflow:hidden;line-height:1.3}
.t.conc .em{height:84px;line-height:84px}
.grup{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;margin:14px 4px 6px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#c7ccd3}
.grup:first-child{margin-top:4px}
.grup i{display:inline-block;width:10px;height:10px;border-radius:5px;margin-right:7px}
.grup b{font-size:15px;letter-spacing:0;color:#fff}
.carro{display:block;width:100%;margin:0 0 8px;padding:9px;font-size:14px;background:#2c2c2e}
.resum{background:#1c1c1e;border-radius:12px;padding:10px 12px;margin:10px 0}
.resum .rf{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;padding:4px 0;font-size:14px}
.resum .rf:first-child{border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:7px;margin-bottom:3px;font-size:15px}
.resum .rf i{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
.resum small{color:#8d95a1}
#tria .op{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
#tria .op div{-webkit-flex:1;flex:1;min-width:0}
#tria .op div b{font-weight:500;font-size:15px}
#tria .op .oi{width:48px;height:48px;-webkit-flex:none;flex:none;border-radius:8px;background:#fff center/contain no-repeat;margin-right:10px}
#tria .op .pp{margin-left:10px}
#tria .op.on{background:rgba(48,209,88,.12);border-radius:10px}
#dre .cap{position:relative;padding-left:58px}
#b-pleg{position:absolute;left:10px;top:12px;width:40px;height:40px;padding:0;border-radius:20px;font-size:20px;line-height:40px}
#mini{display:none}
/* Llista plegada: una franja estreta amb el recompte; la graella aprofita tot l'ample */
body.plegada #dre{width:64px;cursor:pointer}
body.plegada #dre .cap,body.plegada #llista,body.plegada #accions{display:none}
body.plegada #mini{display:block;-webkit-flex:1;flex:1;text-align:center;padding-top:14px}
#mini .n{display:inline-block;min-width:40px;height:40px;line-height:40px;border-radius:20px;background:#30d158;color:#04210f;font-weight:700;font-size:17px;margin-bottom:10px}
#mini .n.zero{background:#2c2c2e;color:#8d95a1}
#mini .e{font-size:22px;line-height:1.5}
#mini .v{writing-mode:vertical-rl;-webkit-writing-mode:vertical-rl;color:#8d95a1;font-size:13px;margin:8px auto 0;letter-spacing:1px}
body.plegada .t{width:calc(20% - 8px)}
@media (max-width:900px){ body.plegada .t{width:calc(25% - 8px)} }
#seg{display:none}
#tria{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:50;display:none}
#tria .card{position:absolute;left:50%;top:40px;width:460px;margin-left:-230px;max-height:85%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1c1c1e;border-radius:20px;padding:18px}
#tria h3{margin:0 0 10px}
#tria .xt{padding:13px 6px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:17px}
#tria .xt small{display:block;color:#8d95a1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tria input{margin-bottom:8px}
@media (max-width:900px){ .t{width:calc(33.333% - 8px)} #dre{width:300px} }
/* Tauleta en vertical: la graella a dalt a tot l'ample i la llista a baix, plegable a una barra */
@media (min-width:701px) and (max-width:1000px) and (orientation:portrait){
  #app{-webkit-flex-direction:column;flex-direction:column}
  #esq{min-height:0;-webkit-flex:1 1 0;flex:1 1 0}
  #dre{-webkit-flex:none;flex:none}
  #dre{width:auto;height:40%;border-left:0;border-top:1px solid rgba(255,255,255,.1)}
  .t{width:calc(25% - 8px)}
  body.plegada .t{width:calc(25% - 8px)}
  body.plegada #dre{width:auto;height:58px}
  body.plegada #mini{padding:9px 14px 0;text-align:left;white-space:nowrap;overflow:hidden}
  #mini .n{min-width:40px;margin:0 12px 0 0;vertical-align:middle;text-align:center}
  #mini .e{display:inline-block;vertical-align:middle;margin-right:4px}
  #mini .v{writing-mode:horizontal-tb;-webkit-writing-mode:horizontal-tb;display:inline-block;margin:0 0 0 10px;vertical-align:middle}
  #dre .cap{padding-top:10px;padding-bottom:6px}
  #b-pleg{top:8px}
  #dre .resum{display:inline-block;width:calc(50% - 6px);vertical-align:top}
}
@media (max-width:700px){
  #app{display:block}
  #esq,#dre{position:absolute;top:52px;left:0;right:0;bottom:0;width:auto;border:0}
  body.v-llista #esq{display:none}
  body.v-prod #dre{display:none}
  #seg{display:-webkit-flex;display:flex;position:absolute;top:8px;left:10px;right:10px;height:38px;background:#2c2c2e;border-radius:10px;padding:3px}
  #seg span{-webkit-flex:1;flex:1;text-align:center;line-height:32px;border-radius:8px;cursor:pointer;font-size:15px}
  #seg span.on{background:#636366;font-weight:600}
  .t,body.plegada .t{width:calc(50% - 8px)}
  body.plegada #dre{width:auto} body.plegada #dre .cap,body.plegada #llista,body.plegada #accions{display:block} body.plegada #mini,#b-pleg{display:none !important}
  #dre .cap{padding-left:14px}
  #tria .card{left:10px;right:10px;width:auto;margin-left:0;top:20px}
}
</style>
</head>
<body class="v-prod">
<div id="seg"><span id="sg-p" onclick="vista('p')">Productes</span><span id="sg-l" onclick="vista('l')">Llista</span></div>
<div id="app">
  <div id="esq">
    <div class="cap">
      <div class="cerca"><input type="search" id="q" placeholder="Cerca o escriu un producte" autocomplete="off" autocorrect="off"><button id="b-afg" onclick="afegeixText()"></button></div>

    <div id="llista"></div>
    <div class="peu" id="accions"></div>

</div>
<div id="tria" onclick="if(event.target==this)this.style.display='none'"><div class="card" id="tria-c"></div></div>
<script src="comu.js"></script>
<script src="conceptes.js"></script>
<script>
var Casa = null;
try { if (window.parent !== window && window.parent.Casa) Casa = window.parent.Casa; } catch (e) { Casa = null; }
var IC_MES = 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z';
var IC_WA = 'M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.02c-.24.68-1.42 1.3-1.95 1.35-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.82s.7-2 .95-2.27c.24-.27.53-.34.71-.34l.51.01c.16.01.38-.06.6.46.24.55.79 1.89.86 2.03.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.89 1.04.93 1.92 1.22 2.19 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.61-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.06.11.06.68-.18 1.36z';
/* Categories comunes (el servidor hi classifica els productes de totes les botigues) */
var CATS = [['fruita', '🍎', 'Fruita i verdura'], ['congelats', '🧊', 'Congelats'], ['xarcuteria', '🧀', 'Formatges i embotit'], ['snacks', '🥜', 'Pica-pica'], ['rebost', '🥫', 'Rebost'],
  ['vegetal', '🌱', 'Vegetarià'], ['lactis', '🥛', 'Làctics i ous'], ['pa', '🥖', 'Pa'], ['begudes', '🧃', 'Begudes'], ['carn', '🥩', 'Carn'], ['peix', '🐟', 'Peix'],
  ['neteja', '🧽', 'Neteja i casa'], ['higiene', '🧴', 'Higiene'], ['bebe', '🍼', 'Bebè'], ['animals', '🐾', 'Animals']];
var COLORS = ['#e3262e', '#2e8b3a', '#0a84ff', '#ff9f0a', '#bf5af2', '#64d2ff', '#ff375f'];
var L = { items: [], hist: {}, fav: [] }, VERSIO = '', EDITA = 0;
var V = { cat: 'fruita', bot: '', q: '', res: [], est: null, tq: null };
$('b-afg').innerHTML = svg(IC_MES);
$('q').placeholder = T('Cerca o escriu un producte');
$('q').oninput = function () { clearTimeout(V.tq); V.tq = setTimeout(function () { V.q = $('q').value.replace(/^\s+|\s+$/g, ''); carregaGraella(); }, 350); };
$('q').onkeydown = function (e) { if ((e.keyCode || e.which) == 13) { e.preventDefault(); afegeixText(); } };

function vertical() { return window.innerHeight > window.innerWidth && window.innerWidth > 700; }
window.addEventListener('resize', function () { plega(document.body.className.indexOf('plegada') >= 0); });
function plega(v) {
  var p = typeof v == 'boolean' ? v : document.body.className.indexOf('plegada') < 0;
  document.body.className = document.body.className.replace(/\s*plegada/g, '') + (p ? ' plegada' : '');
  ls('compra.plegada', p);
  $('b-pleg').innerHTML = vertical() ? (p ? '⌃' : '⌄') : (p ? '‹' : '›');
}
function pintaMini() {
  var p = pendents(), h = '<div class="n' + (p.length ? '' : ' zero') + '">' + p.length + '</div>';
  for (var i = 0; i < p.length && i < 9; i++) h += '<div class="e">' + (p[i].e || '•') + '</div>';
  if (p.length > 9) h += '<div class="e">…</div>';
  if (vertical()) h += '<div class="v">' + esc(T('Toca per veure la llista')) + '</div>'; else
  h += '<div class="v">' + esc(T('Llista')) + '</div>';
  $('mini').innerHTML = h;
}
function vista(v) { document.body.className = (v == 'l' ? 'v-llista' : 'v-prod') + (document.body.className.indexOf('plegada') >= 0 ? ' plegada' : ''); $('sg-p').className = v == 'l' ? '' : 'on'; $('sg-l').className = v == 'l' ? 'on' : ''; }
vista('p');
plega(!!ls('compra.plegada'));

/* ---------- Dades compartides entre aparells ---------- */
function carrega(primer) {
  dades('compra', function (d) {
    if (Date.now() - EDITA < 2500) return;
    var j = JSON.stringify(d || {});
    if (!primer && j == VERSIO) return;
    VERSIO = j;
    L = d && d.items ? d : { items: [], hist: (d && d.hist) || {} };
    if (!L.hist) L.hist = {};
    if (!L.fav) L.fav = [];
    /* llistes antigues: cada article necessita una clau */
    for (var i = 0; i < L.items.length; i++) if (!L.items[i].k) L.items[i].k = 'txt:' + clau(L.items[i].t);
    pintaLlista();
    if (primer || (V.cat == 'fav' && !V.q)) pintaGraella();
    else marcaQuantitats();
  });
}
function desa() { EDITA = Date.now(); VERSIO = JSON.stringify(L); desaDades('compra', L); }

/* ---------- Botigues i categories ---------- */
function botigues() { return (V.est && V.est.botigues) || []; }
function idxBot(id) { var l = botigues(); for (var i = 0; i < l.length; i++) if (l[i].id == id) return i; return -1; }
function colorBot(id) { var i = idxBot(id); return i >= 0 ? COLORS[i % COLORS.length] : '#636366'; }
function nomBot(id) { var i = idxBot(id); return i >= 0 ? botigues()[i].nom : ''; }
function pintaChips() {
  var n = (V.est && V.est.cats) || {}, h = '<span id="c-fav" onclick="triaCat(\'fav\')">⭐ ' + esc(T('Preferits')) + '</span>', i;
  if (V.est && V.est.promos) h += '<span id="c-promo" onclick="triaCat(\'promo\')">🏷️ ' + esc(T('Promocions')) + '</span>';
  for (i = 0; i < CATS.length; i++) if (conceptesDe(CATS[i][0]).length) h += '<span id="c-' + CATS[i][0] + '" onclick="triaCat(\'' + CATS[i][0] + '\')">' + CATS[i][1] + ' ' + esc(T(CATS[i][2])) + '</span>';
  $('cats').innerHTML = h;
  var bl = botigues(), b = '';
  if (bl.length > 1) {
    b = '<span id="b-" onclick="triaBot(\'\')">' + esc(T('Totes')) + '</span>';
    for (i = 0; i < bl.length; i++) b += '<span id="b-' + esc(bl[i].id) + '" onclick="triaBot(\'' + esc(bl[i].id) + '\')"><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + esc(bl[i].nom) + '</span>';
  }
  $('bots').innerHTML = b; $('bots').style.display = b && V.est && V.est.n ? '' : 'none';
  marcaChips();
}
function marcaChips() {
  var l = $('cats').children, i;
  for (i = 0; i < l.length; i++) l[i].className = l[i].id == 'c-' + V.cat && !V.q ? 'on' : '';
  l = $('bots').children;
  for (i = 0; i < l.length; i++) l[i].className = l[i].id == 'b-' + V.bot ? 'on' : '';
}
function triaCat(c) { V.cat = c; V.q = ''; $('q').value = ''; carregaGraella(); $('graella').scrollTop = 0; }
function triaBot(b) { V.bot = b; carregaGraella(); }

/* ---------- Graella: conceptes («Ous», «Llet»…) com la caixa d'un restaurant ---------- */
var VIS = [], MILL = {}, MPEND = {};
function concepteObj(c) { return { cc: 1, n: concNom(c), cq: concCerca(c), e: c[1], cat: c[0] }; }
function conceptesDe(cat) {
  var r = [], i;
  for (i = 0; i < CONCEPTES.length; i++) if (CONCEPTES[i][0] == cat) r.push(concepteObj(CONCEPTES[i]));
  var m = L.conc || [];
  for (i = 0; i < m.length; i++) if (m[i].cat == cat) r.push({ cc: 1, n: m[i].n, cq: m[i].n, e: m[i].e || '📝', cat: cat });
  return r;
}
function carregaGraella() {
  marcaChips();
  if (V.cat == 'promo' && !V.q) {
    if (!(V.est && V.est.n)) { V.res = []; pintaGraella(); return; }
    $('graella').innerHTML = '<div class="buit">' + T('Carregant…') + '</div>';
    getJson(api('compra/productes', V.bot ? { promo: 1, max: 80, b: V.bot } : { promo: 1, max: 80 }), function (r) { V.res = r || []; pintaGraella(); }, function () { V.res = []; pintaGraella(); });
    return;
  }
  V.res = [];
  pintaGraella();
  if (V.q && V.est && V.est.n) getJson(api('compra/productes', V.bot ? { q: V.q, max: 40, b: V.bot } : { q: V.q, max: 40 }), function (r) { V.res = r || []; pintaGraella(); }, function () { });
}
function clau(t) { return String(t || '').toLowerCase().replace(/^\s*\d+([.,]\d+)?\s*(x|kg|g|l|ml|un)?\.?\s+/, '').replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, ''); }
function clauP(p) { return p.cc ? 'c:' + clau(p.cq || p.n) : p.u ? p.u : 'txt:' + clau(p.n); }
function esFav(k) { for (var i = 0; i < L.fav.length; i++) if (L.fav[i].k == k) return true; return false; }
function euro(v) { return v ? (Math.round(v * 100) / 100).toFixed(2).replace('.', ',') + ' €' : ''; }
function sensePla(s) { return String(s || '').toLowerCase().replace(/[àáâã]/g, 'a').replace(/[èéê]/g, 'e').replace(/[ìíï]/g, 'i').replace(/[òóôõ]/g, 'o').replace(/[ùúü]/g, 'u').replace(/ç/g, 'c'); }
function htmlTile(p, i) {
  var k = clauP(p), h = '<div class="t' + (p.esg ? ' esg' : '') + (p.cc ? ' conc' : p.u ? '' : ' lliure') + '" data-k="' + esc(k) + '"' + (p.cc ? ' data-q="' + esc(p.cq) + '"' : '') + ' onclick="tocaTile(' + i + ')">';

function pintaGraella() {
  var l = [], h = '', i, k;
  if (V.q) {
    /* conceptes que coincideixen + el text com a concepte nou + productes concrets de les botigues */
    var qq = sensePla(V.q);
    var tots = CONCEPTES.concat(CONCEPTES_MES);
    for (i = 0; i < tots.length; i++) if (sensePla(concNom(tots[i])).indexOf(qq) >= 0 || sensePla(concCerca(tots[i]).split(' -')[0]).indexOf(qq) >= 0) l.push(concepteObj(tots[i]));
    var m = L.conc || [];
    for (i = 0; i < m.length; i++) if (sensePla(m[i].n).indexOf(qq) >= 0) l.push({ cc: 1, n: m[i].n, cq: m[i].n, e: m[i].e || '📝', cat: m[i].cat });
    var ja = false;
    for (i = 0; i < l.length; i++) if (sensePla(l[i].n) == qq) ja = true;
    if (!ja) l.unshift({ cc: 1, n: V.q, cq: V.q, e: '➕', nou: 1, cat: V.cat != 'fav' && V.cat != 'promo' ? V.cat : '' });
    for (i = 0; i < V.res.length; i++) l.push(V.res[i]);
  } else if (V.cat == 'fav') {
    for (i = 0; i < L.fav.length; i++) l.push(L.fav[i]);
    if (!l.length) h = '<div class="buit">' + T('Toca l\'estrella ☆ del que compres sovint per tenir-ho aquí.') + '</div>';
  } else if (V.cat == 'promo') {
    l = V.res.slice(0);
    if (!l.length) h = '<div class="buit">' + T('No hi ha promocions (o encara no s\'han llegit les botigues).') + '</div>';
  } else l = conceptesDe(V.cat);
  VIS = l;
  var t = '';
  for (i = 0; i < l.length; i++) t += htmlTile(l[i], i);
  $('graella').innerHTML = t + h;
  marcaQuantitats();
  preusConceptes();
}
/* «des de 1,39 € · Continente» a cada concepte visible */
function preusConceptes() {
  if (!(V.est && V.est.n)) return;
  var ts = document.querySelectorAll('#graella .t.conc'), falta = [], i;
  for (i = 0; i < ts.length; i++) { var q = ts[i].getAttribute('data-q'); if (!MILL[q] && !MPEND[q]) { falta.push(q); MPEND[q] = 1; } }
  if (!falta.length) { pintaDes(); return; }
  millors(falta, pintaDes);
}
function millors(qs, ok) {
  peticio('POST', api('compra/millors'), JSON.stringify(qs), function (txt) {
    var r = []; try { r = JSON.parse(txt) || []; } catch (e) { }
    for (var i = 0; i < qs.length; i++) { MILL[qs[i]] = r[i] || { n: 0, top: [], perBotiga: {} }; delete MPEND[qs[i]]; }
    if (ok) ok();
  }, function () { for (var i = 0; i < qs.length; i++) delete MPEND[qs[i]]; });
}
function millor(m) { return m && m.top && m.top.length ? m.top[0] : null; }
function pintaDes() {
  var ts = document.querySelectorAll('#graella .t.conc');
  for (var i = 0; i < ts.length; i++) {
    var m = MILL[ts[i].getAttribute('data-q')], b = millor(m), d = ts[i].querySelector('.ds');
    if (!d) continue;
    if (!m) d.innerHTML = '';
    else if (!b) d.innerHTML = '<span class="gris">' + T('No el trobo a les botigues') + '</span>';
    else d.innerHTML = T('des de') + ' <b>' + euro(b.p) + '</b> · <span style="color:' + colorBot(b.b) + '">' + esc(nomBot(b.b)) + '</span>';
  }
}
function marcaQuantitats() {
  var q = {}, i;
  for (i = 0; i < L.items.length; i++) if (!L.items[i].fet) q[L.items[i].k] = (q[L.items[i].k] || 0) + (L.items[i].q || 1);
  var ts = document.querySelectorAll('#graella .t');
  for (i = 0; i < ts.length; i++) {
    var n = q[ts[i].getAttribute('data-k')], b = ts[i].querySelector('.qt');

}
function tocaTile(i) {
  var p = VIS[i]; if (!p) return;
  if (p.nou) {
    /* concepte nou: es guarda per tenir-lo a la seva categoria */
    if (!L.conc) L.conc = [];
    if (p.cat) L.conc.push({ n: p.n, cat: p.cat, e: '📝' });
  }
  afegeixProducte(p);
  if (p.cc) {
    var it = L.items[troba(ultimId)];
    var ensenya = function () { var b = millor(MILL[p.cq]); if (b) avis(p.n + ': ' + T('més barat a') + ' ' + nomBot(b.b) + ', ' + euro(b.p) + ' (' + b.n + ')', 4000); };
    if (MILL[p.cq]) ensenya(); else if (V.est && V.est.n) millors([p.cq], function () { pintaLlista(); ensenya(); });
  }
  if (p.nou) { $('q').value = ''; V.q = ''; carregaGraella(); }

function commutaFav(i) {
  var p = VIS[i], k = clauP(p);
  for (var j = 0; j < L.fav.length; j++) if (L.fav[j].k == k) { L.fav.splice(j, 1); desa(); pintaGraella(); return; }
  var f = { k: k, n: p.n, e: p.e || '' };
  if (p.cc) { f.cc = 1; f.cq = p.cq; f.cat = p.cat || ''; }
  else { f.u = p.u || ''; f.img = p.img || ''; f.p = p.p || 0; f.pv = p.pv || 0; f.b = p.b || ''; f.q = p.q || ''; }
  L.fav.unshift(f);
  desa(); pintaGraella();
}

/* ---------- Llista ---------- */
var ultimId = '';
function afegeixProducte(p) {
  var k = clauP(p);
  for (var i = 0; i < L.items.length; i++) if (L.items[i].k == k) {
    if (L.items[i].fet) { L.items[i].fet = false; L.items[i].q = 1; } else L.items[i].q = (L.items[i].q || 1) + 1;
    ultimId = L.items[i].id;
    desa(); pintaLlista(); marcaQuantitats(); return;
  }
  var it = { id: Date.now().toString(36) + Math.random().toString(36).substring(2, 5), k: k, t: p.n, q: 1, fet: false };
  if (p.cc) { it.cq = p.cq; it.e = p.e; }
  else { it.p = p.p || 0; it.b = p.b || ''; it.u = p.u || ''; it.qn = p.q || ''; }
  L.items.unshift(it); ultimId = it.id;
  desa(); pintaLlista(); marcaQuantitats();
}
function afegeixText() {
  var t = ($('q').value || '').replace(/^\s+|\s+$/g, '');
  if (!t) return;
  var cat = V.cat != 'fav' && V.cat != 'promo' ? V.cat : '';
  if (cat) { if (!L.conc) L.conc = []; L.conc.push({ n: t, cat: cat, e: '📝' }); }
  afegeixProducte({ cc: 1, n: t, cq: t, e: '📝' });
  $('q').value = ''; V.q = ''; carregaGraella();
}
function troba(id) { for (var i = 0; i < L.items.length; i++) if (L.items[i].id == id) return i; return -1; }
function commuta(id) { var i = troba(id); if (i >= 0) L.items[i].fet = !L.items[i].fet; desa(); pintaLlista(); marcaQuantitats(); }
function quant(id, d) {
  var i = troba(id); if (i < 0) return;
  L.items[i].q = (L.items[i].q || 1) + d;
  if (L.items[i].q <= 0) L.items.splice(i, 1);
  desa(); pintaLlista(); marcaQuantitats();
}
function netejaFets() { var r = []; for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]); L.items = r; desa(); pintaLlista(); marcaQuantitats(); }
function pendents() { var r = []; for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]); return r; }
/* L'opció que toca per a un article: la que s'ha triat, o la més barata */
function opcio(it) {
  if (!it.cq) return it.p ? { n: it.t, p: it.p, b: it.b, q: it.qn } : null;
  if (it.tria) return it.tria;
  return millor(MILL[it.cq]);
}
function htmlItem(it) {
  var o = opcio(it), sub = '';
  if (o) sub = '<small><span style="color:' + colorBot(o.b) + '">' + esc(nomBot(o.b) || '') + '</span>' + (it.cq ? ' · ' + esc(o.n) : '') + (o.q ? ' · ' + esc(o.q) : '') + ' · <b>' + euro(o.p * (it.q || 1)) + '</b>' + (it.cq && !it.tria ? ' ' + T('(el més barat)') : '') + '</small>';
  else if (it.cq && MILL[it.cq]) sub = '<small>' + T('No el trobo a les botigues') + '</small>';
  return '<div class="ci' + (it.fet ? ' fet' : '') + '"><div class="ck" onclick="commuta(\'' + it.id + '\')"><i></i></div>' +
    '<div class="tx" onclick="' + (it.cq && !it.fet ? 'opcions(\'' + it.id + '\')' : 'commuta(\'' + it.id + '\')') + '"><b>' + (it.e ? it.e + ' ' : '') + esc(it.t) + '</b>' + sub + '</div>' +
    (it.fet ? '' : '<div class="qb"><button onclick="quant(\'' + it.id + '\',-1)">−</button><span>' + (it.q || 1) + '</span><button onclick="quant(\'' + it.id + '\',1)">+</button></div>') + '</div>';
}
/* Totals: comprant cada cosa on és més barata, o tot en una sola botiga */
function resum(p) {
  var mix = 0, nMix = 0, perB = {}, falta = {}, bl = botigues(), i, j;
  for (j = 0; j < bl.length; j++) { perB[bl[j].id] = 0; falta[bl[j].id] = 0; }
  for (i = 0; i < p.length; i++) {
    var it = p[i], q = it.q || 1, o = opcio(it);
    if (o) { mix += o.p * q; nMix++; }
    for (j = 0; j < bl.length; j++) {
      var id = bl[j].id, x = null;
      if (it.cq) { var m = MILL[it.cq]; x = it.tria && it.tria.b == id ? it.tria : m && m.perBotiga ? m.perBotiga[id] : null; }
      else if (it.b == id) x = it;
      if (x) perB[id] += x.p * q; else falta[id]++;
    }
  }
  return { mix: mix, nMix: nMix, perB: perB, falta: falta };
}
function pintaLlista() {
  var p = pendents(), f = [], h = '', i;

  for (i = 0; i < p.length; i++) if (p[i].cq && !MILL[p[i].cq] && !MPEND[p[i].cq]) { cal.push(p[i].cq); MPEND[p[i].cq] = 1; }
  if (cal.length && V.est && V.est.n) millors(cal, pintaLlista);
  /* Una llista per botiga: el que toca comprar a cada una (on és més barat o on s'ha triat) */
  var g = {}, ord = [];
  for (i = 0; i < p.length; i++) { var o = opcio(p[i]), bb = o ? o.b || '' : ''; if (!g[bb]) { g[bb] = []; ord.push(bb); } g[bb].push(p[i]); }
  ord.sort(function (x, y) { return x && !y ? -1 : !x && y ? 1 : idxBot(x) - idxBot(y); });
  for (i = 0; i < ord.length; i++) {
    var sub = 0, k2;
    for (k2 = 0; k2 < g[ord[i]].length; k2++) { var o2 = opcio(g[ord[i]][k2]); if (o2 && o2.p) sub += o2.p * (g[ord[i]][k2].q || 1); }
    if (ord.length > 1 || ord[i]) h += '<div class="grup"><span><i style="background:' + (ord[i] ? colorBot(ord[i]) : '#636366') + '"></i>' + (ord[i] ? Tf('A {1}', esc(nomBot(ord[i]) || ord[i])) : T('Sense preu')) + ' · ' + g[ord[i]].length + '</span><b>' + euro(sub) + '</b></div>' +
      (ord[i] ? '<button class="carro" onclick="alCarro(\'' + ord[i] + '\')">🛒 ' + esc(Tf('Posa-ho al carro de {1}', nomBot(ord[i]) || ord[i])) + '</button>' : '');
    for (k2 = 0; k2 < g[ord[i]].length; k2++) h += htmlItem(g[ord[i]][k2]);
  }
  if (!L.items.length) h = '<div class="buit">' + T('La llista és buida. Toca el que necessites i et diré on és més barat.') + '</div>';
  if (p.length && V.est && V.est.n) {
    var r = resum(p), bl = botigues();

    for (i = 0; i < bl.length; i++) h += '<div class="rf"><span><i style="background:' + COLORS[i % COLORS.length] + '"></i>' + Tf('Tot a {1}', esc(bl[i].nom)) + (r.falta[bl[i].id] ? ' <small>' + Tf('(en falten {1})', r.falta[bl[i].id]) + '</small>' : '') + '</span><span>' + euro(r.perB[bl[i].id]) + '</span></div>';
    h += '</div>';
  }
  if (f.length) { h += '<div class="sec">' + T('Al carro') + ' · ' + f.length + '</div>'; for (i = 0; i < f.length; i++) h += htmlItem(f[i]); }
  $('llista').innerHTML = h;
  $('tot').textContent = p.length ? Tf('{1} articles', p.length) : '';
  pintaMini();
  $('sg-l').textContent = T('Llista') + (p.length ? ' (' + p.length + ')' : '');
  var a = '';

  if (f.length) a += '<button onclick="netejaFets()">' + T('Treu els comprats') + '</button>';

/* Tria entre les opcions d'un concepte */
var OPC = null;
function opcions(id) {

function triaOpcio(i) {

  $('tria').style.display = 'none'; desa(); pintaLlista();

/* Text per enviar: agrupat per la botiga on és més barat cada cosa */
/* Omple el carro de la botiga online: el PC obre la botiga i hi afegeix cada producte. Pagar es fa al PC. */
function alCarro(b) {
  var p = pendents(), l = [], i;
  for (i = 0; i < p.length; i++) { var o = opcio(p[i]); if (o && o.b == b && (o.u || p[i].u)) l.push({ u: o.u || p[i].u, n: o.n || p[i].t, q: p[i].q || 1 }); }
  if (!l.length) { avis(T('No hi ha productes d\'aquesta botiga per afegir.')); return; }
  post(api('admin/compra/cistell', { b: b }), JSON.stringify(l), function () {
    $('tria').style.display = 'block';
    $('tria-c').innerHTML = '<h3>🛒 ' + esc(nomBot(b)) + '</h3><div id="cx-e" class="gris">' + T('Obrint la botiga al PC…') + '</div>';
    setTimeout(estatCarro, 1500);
  }, function (st, t) { var m = ''; try { m = JSON.parse(t).error; } catch (e) { } avis(T('No s\'ha pogut començar') + (m ? ': ' + m : '')); });
}
function estatCarro() {
  getJson(api('admin/compra/cistell-estat'), function (d) {
    if (!d || !$('cx-e')) return;
    var h = d.fent ? Tf('Afegint {1} de {2}…', Math.min((d.fets || 0) + 1, d.total), d.total) + (d.ara ? '<br><b>' + esc(d.ara) + '</b>' : '') : Tf('Fet: {1} de {2} productes al carro.', d.total - (d.errors ? d.errors.length : 0), d.total) + '<br>' + T('Revisa el carro i paga a la pantalla del PC.');
    if (d.errors && d.errors.length) { h += '<p style="color:#ff9f0a">' + T('No s\'han pogut afegir:') + '</p>'; for (var i = 0; i < d.errors.length; i++) h += '<div>• ' + esc(d.errors[i].n) + '</div>'; }
    if (d.error) h += '<p style="color:#ff453a">' + esc(d.error) + '</p>';
    $('cx-e').innerHTML = h;
    if (d.fent) setTimeout(estatCarro, 1500);
  }, function () { });
}
function textLlista() {
  var p = pendents(), g = {}, ord = [], i, j, t = '🛒 ' + T('Llista de la compra');
  for (i = 0; i < p.length; i++) { var o = opcio(p[i]), b = o ? o.b || '' : ''; if (!g[b]) { g[b] = []; ord.push(b); } g[b].push(p[i]); }
  ord.sort(function (a, b) { return a && !b ? -1 : !a && b ? 1 : 0; });
  for (i = 0; i < ord.length; i++) {
    if (ord.length > 1 || ord[i]) t += '\n\n' + (ord[i] ? nomBot(ord[i]) || ord[i] : T('Altres')) + ':';
    else t += '\n';
    for (j = 0; j < g[ord[i]].length; j++) {
      var it = g[ord[i]][j], op = opcio(it), q = it.q || 1;
      t += '\n• ' + (q > 1 ? q + '× ' : '') + it.t + (op && it.cq ? ' – ' + op.n : '') + (op && op.p ? ' (' + euro(op.p * q) + ')' : '');
    }
  }
  return t;
}
