<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<script src="i18n.js"></script>
<title>Compra</title>
<style>
#pag{max-width:720px;margin:0 auto}
.afegeix{display:-webkit-flex;display:flex;margin-bottom:12px}
.afegeix input{-webkit-flex:1;flex:1;font-size:18px;padding:13px 15px}
.afegeix button{margin-left:8px;width:52px;padding:0;background:#30d158;color:#04210f}
.afegeix button .ic{width:26px;height:26px;fill:#04210f}
.sug{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px 14px;padding:0 4px}
.sug span{display:inline-block;margin:0 6px 6px 0;padding:7px 13px;border-radius:18px;background:#2c2c2e;cursor:pointer;font-size:15px}
.sug span:before{content:'+ ';opacity:.5}
.sec{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:#8d95a1;margin:18px 4px 8px}
.ci{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;background:#1c1c1e;border-radius:14px;margin-bottom:8px;min-height:54px}
.ci .ck{width:54px;height:54px;-webkit-flex:none;flex:none;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer}
.ci .ck i{display:block;width:26px;height:26px;border-radius:13px;border:2px solid #636366}
.ci.fet .ck i{background:#30d158;border-color:#30d158;position:relative}
.ci.fet .ck i:after{content:'';position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #04210f;border-width:0 2.5px 2.5px 0;-webkit-transform:rotate(45deg);transform:rotate(45deg)}
.ci .tx{-webkit-flex:1;flex:1;min-width:0;font-size:18px;padding:12px 0;cursor:pointer;word-wrap:break-word}
.ci.fet .tx{text-decoration:line-through;color:#8d95a1}
.ci .x{background:none;width:48px;height:48px;padding:0;-webkit-flex:none;flex:none;opacity:.5}
.ci .x .ic{width:20px;height:20px}
.buit{text-align:center;padding:40px 10px;color:#8d95a1}
.accions{margin-top:20px}
.accions button{margin:0 8px 8px 0}
.accions .wa{background:#25d366;color:#04210f;font-weight:600}
.accions .wa .ic{width:20px;height:20px;fill:#04210f;vertical-align:-4px;margin-right:6px}
#tria{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:50;display:none}
#tria .card{position:absolute;left:50%;top:40px;width:460px;margin-left:-230px;max-height:85%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#1c1c1e;border-radius:20px;padding:18px}
#tria h3{margin:0 0 10px}
#tria .xt{padding:13px 6px;border-top:1px solid rgba(255,255,255,.07);cursor:pointer;font-size:17px}
#tria .xt small{display:block;color:#8d95a1;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tria input{margin-bottom:8px}
@media (max-width:520px){ #tria .card{left:10px;right:10px;width:auto;margin-left:0;top:20px} }
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>Compra</h1></div>
  <div class="afegeix"><input type="text" id="nou" placeholder="Afegeix (p. ex. 2 llet)" autocomplete="off" autocorrect="off"><button id="b-afg" onclick="afegeix()"></button></div>
  <div class="sug" id="sug"></div>
  <div id="llista"><div class="gris">Carregant…</div></div>
  <div class="accions" id="accions"></div>
</div>
<div id="tria" onclick="if(event.target==this)this.style.display='none'"><div class="card" id="tria-c"></div></div>
<script src="comu.js"></script>
<script>
var Casa = null;
try { if (window.parent !== window && window.parent.Casa) Casa = window.parent.Casa; } catch (e) { Casa = null; }
var IC_MES = 'M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z';
var IC_X = 'M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z';
var IC_WA = 'M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm5.8 14.02c-.24.68-1.42 1.3-1.95 1.35-.5.05-.97.23-3.27-.68-2.77-1.09-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.82s.7-2 .95-2.27c.24-.27.53-.34.71-.34l.51.01c.16.01.38-.06.6.46.24.55.79 1.89.86 2.03.07.14.11.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.89 1.04.93 1.92 1.22 2.19 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.61-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.06.11.06.68-.18 1.36z';
var L = { items: [], hist: {} }, VERSIO = '', EDITA = 0;
$('b-afg').innerHTML = svg(IC_MES);
$('nou').onkeydown = function (e) { if ((e.keyCode || e.which) == 13) { e.preventDefault(); afegeix(); } };
$('nou').placeholder = T('Afegeix (p. ex. 2 llet)');

function carrega(primer) {
  dades('compra', function (d) {
    if (Date.now() - EDITA < 2500) return; /* no trepitgis el que s'acaba d'escriure */
    var j = JSON.stringify(d || {});
    if (!primer && j == VERSIO) return;
    VERSIO = j;
    L = d && d.items ? d : { items: [], hist: (d && d.hist) || {} };
    if (!L.hist) L.hist = {};
    pinta();
  });
}
function desa() {
  EDITA = Date.now();
  VERSIO = JSON.stringify(L);
  desaDades('compra', L);
}
function clau(t) { return t.toLowerCase().replace(/^\s*\d+([.,]\d+)?\s*(x|kg|g|l|ml|un|uni|unitats)?\.?\s+/, '').replace(/\s+/g, ' ').trim(); }
function afegeix(t) {
  t = (t || $('nou').value || '').replace(/^\s+|\s+$/g, '');
  if (!t) return;
  var k = clau(t);
  for (var i = 0; i < L.items.length; i++) if (clau(L.items[i].t) == k) {
    /* ja hi és: si estava comprat, torna a la llista */
    L.items[i].fet = false; L.items[i].t = t;
    $('nou').value = ''; desa(); pinta(); return;
  }
  L.items.unshift({ id: Date.now().toString(36) + Math.random().toString(36).substring(2, 5), t: t, fet: false });
  L.hist[k] = (L.hist[k] || 0) + 1;
  $('nou').value = '';
  desa(); pinta();
}
function commuta(id) {
  for (var i = 0; i < L.items.length; i++) if (L.items[i].id == id) L.items[i].fet = !L.items[i].fet;
  desa(); pinta();
}
function treu(id) {
  for (var i = 0; i < L.items.length; i++) if (L.items[i].id == id) { L.items.splice(i, 1); break; }
  desa(); pinta();
}
function netejaFets() {
  var r = [];
  for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]);
  L.items = r; desa(); pinta();
}
function htmlIt(it) {
  return '<div class="ci' + (it.fet ? ' fet' : '') + '"><div class="ck" onclick="commuta(\'' + it.id + '\')"><i></i></div>' +
    '<div class="tx" onclick="commuta(\'' + it.id + '\')">' + esc(it.t) + '</div>' +
    '<button class="x" onclick="treu(\'' + it.id + '\')">' + svg(IC_X) + '</button></div>';
}
function pendents() { var r = []; for (var i = 0; i < L.items.length; i++) if (!L.items[i].fet) r.push(L.items[i]); return r; }
function pinta() {
  var p = pendents(), f = [], h = '', i;
  for (i = 0; i < L.items.length; i++) if (L.items[i].fet) f.push(L.items[i]);
  if (!L.items.length) h = '<div class="buit">' + T('La llista és buida. Afegeix el que falta a casa.') + '</div>';
  for (i = 0; i < p.length; i++) h += htmlIt(p[i]);
  if (f.length) {
    h += '<div class="sec">' + T('Al carro') + ' · ' + f.length + '</div>';
    for (i = 0; i < f.length; i++) h += htmlIt(f[i]);
  }
  $('llista').innerHTML = h;
  /* Suggeriments: el que s'afegeix sovint i ara no hi és */
  var hi = {}, s = [], k;
  for (i = 0; i < L.items.length; i++) hi[clau(L.items[i].t)] = 1;
  for (k in L.hist) if (L.hist.hasOwnProperty(k) && !hi[k]) s.push(k);
  s.sort(function (a, b) { return L.hist[b] - L.hist[a]; });
  s = s.slice(0, 14);
  var sh = '';
  for (i = 0; i < s.length; i++) sh += '<span onclick="afegeix(this.getAttribute(\'data-t\'))" data-t="' + esc(s[i]) + '">' + esc(s[i]) + '</span>';
  $('sug').innerHTML = sh; $('sug').style.display = sh ? '' : 'none';
  var a = '';
  if (p.length) a += '<button class="wa" onclick="enviaWa()">' + svg(IC_WA) + T('Envia per WhatsApp') + '</button>';
  if (f.length) a += '<button onclick="netejaFets()">' + T('Treu els comprats') + '</button>';
  $('accions').innerHTML = a;
}
function textLlista() {
  var p = pendents(), t = '🛒 ' + T('Llista de la compra') + '\n';
  for (var i = 0; i < p.length; i++) t += '• ' + p[i].t + '\n';
  return t.replace(/\n$/, '');
}
/* WhatsApp: si Hearth té el WhatsApp connectat, s'envia des del servidor triant el xat;
   si no, s'obre WhatsApp al mòbil (wa.me) amb el text ja escrit */
function waActiu() { try { return !!(window.parent && window.parent.A && window.parent.A.ajustos.whatsapp); } catch (e) { return false; } }
function enviaWa() {
  if (!waActiu()) { obreWaMe(); return; }
  $('tria').style.display = 'block';
  $('tria-c').innerHTML = '<h3>' + T('Envia a…') + '</h3><div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('admin/wa/xats'), function (l) {
    l = l || [];
    var h = '<h3>' + T('Envia a…') + '</h3><input type="search" id="cerca" placeholder="' + esc(T('Cerca')) + '" oninput="filtra()"><div id="xts">';
    for (var i = 0; i < l.length; i++) h += '<div class="xt" data-n="' + esc(l[i].nom) + '" onclick="enviaA(this.getAttribute(\'data-n\'))">' + esc(l[i].nom) + (l[i].darrer ? '<small>' + esc(l[i].darrer) + '</small>' : '') + '</div>';
    if (!l.length) h += '<div class="gris" style="padding:10px 0">' + T('Encara no hi ha xats (o s\'estan carregant).') + '</div>';
    h += '</div><p><button onclick="obreWaMe()">' + T('Obre WhatsApp en aquest aparell') + '</button></p>';
    $('tria-c').innerHTML = h;
  }, function () { obreWaMe(); });
}
function filtra() {
  var q = ($('cerca').value || '').toLowerCase(), l = document.querySelectorAll('#xts .xt');
  for (var i = 0; i < l.length; i++) l[i].style.display = l[i].getAttribute('data-n').toLowerCase().indexOf(q) >= 0 ? '' : 'none';
}
function enviaA(nom) {
  $('tria-c').innerHTML = '<h3>' + esc(nom) + '</h3><div class="gris">' + T('Enviant…') + '</div>';
  peticio('POST', api('admin/wa/envia', { xat: nom }), textLlista(), function () {
    $('tria').style.display = 'none';
    avis(Tf('Llista enviada a {1}', nom));
  }, function () {
    $('tria-c').innerHTML = '<h3>' + esc(nom) + '</h3><p>' + T('No s\'ha pogut enviar.') + '</p><p><button onclick="obreWaMe()">' + T('Obre WhatsApp en aquest aparell') + '</button></p>';
  });
}
function obreWaMe() {
  $('tria').style.display = 'none';
  window.open('https://wa.me/?text=' + encodeURIComponent(textLlista()), '_blank');
}
carrega(true);
setInterval(function () { if (!document.hidden) carrega(false); }, 5000);
</script>
</body>
</html>
