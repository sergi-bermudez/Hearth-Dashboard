<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>Fotos</title>
<script src="i18n.js"></script>
<style>
.mes{font-size:20px;font-weight:600;margin:22px 0 10px}
.mes span{font-size:14px;color:#8d95a1;font-weight:400;margin-left:8px}
.fg{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -2px}
.ft{width:calc(16.666% - 4px);margin:2px;padding-top:calc(16.666% - 4px);background:#1a1f26 center/cover no-repeat;position:relative;cursor:pointer;border-radius:4px}
.ft .v{position:absolute;bottom:5px;right:6px;font-size:12px;background:rgba(0,0,0,.6);border-radius:5px;padding:1px 6px}
#visor{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:60;display:none}
#visor .img{position:absolute;top:0;left:0;right:0;bottom:0;background:center/contain no-repeat}
#visor video{position:absolute;top:70px;left:0;width:100%;height:calc(100% - 140px)}
#visor .bt{position:absolute;background:rgba(40,40,40,.65);border-radius:30px;width:56px;height:56px;padding:0;z-index:3;line-height:56px;text-align:center}
#visor .bt .ic{width:28px;height:28px}
#visor .info{position:absolute;left:0;right:0;bottom:0;padding:18px;text-align:center;background:-webkit-linear-gradient(transparent,rgba(0,0,0,.7));background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:15px;z-index:2}
@media (max-width:800px){ .ft{width:calc(25% - 4px);padding-top:calc(25% - 4px)} }
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>Fotos</h1>
    <button onclick="if(Casa)Casa.marc()" id="b-marc"></button>
    <button class="pri" onclick="$('input').click()" id="b-puja"></button>
    <input type="file" id="input" accept="image/*,video/*" multiple class="amagat" onchange="puja(this)">
  </div>
  <div class="gris petit" id="estat"></div>
  <div id="tl"></div>
</div>
<div id="visor">
  <div class="img" id="vi-img"></div>
  <button class="bt" style="top:16px;right:16px" onclick="viTanca()" id="vb-x"></button>
  <button class="bt" style="top:50%;left:16px;margin-top:-28px" onclick="viMou(-1)" id="vb-a"></button>
  <button class="bt" style="top:50%;right:16px;margin-top:-28px" onclick="viMou(1)" id="vb-s"></button>
  <div class="info" id="vi-info"></div>
</div>
<script src="comu.js"></script>
<script>
dinsCasa('fotos');
$('b-marc').innerHTML = svg(IC.marc) + ' Marc de fotos';
$('b-puja').innerHTML = svg(IC.puja) + ' Pujar';
$('vb-x').innerHTML = svg(IC.tanca); $('vb-a').innerHTML = svg(IC.ant); $('vb-s').innerHTML = svg(IC.seg);
var F = { llista: [], fets: 0, els: [], mesActual: '', grup: null, comptes: {} };
function carrega(forcar) {
  $('estat').textContent = 'Carregant fotos… (la primera vegada pot trigar si n\'hi ha moltes)';
  function rep(d) {
    F.llista = d; F.fets = 0; F.els = []; F.mesActual = ''; F.grup = null; F.comptes = {};
    for (var i = 0; i < d.length; i++) { var dt = new Date(d[i][1]), k = dt.getFullYear() + '-' + dt.getMonth(); F.comptes[k] = (F.comptes[k] || 0) + 1; }
    $('tl').innerHTML = '';
    $('estat').textContent = d.length ? d.length + ' fotos i vídeos' : 'No hi ha fotos. Revisa la carpeta a Configuració, o puja\'n des d\'aquí.';
    mes();
  }
  if (Casa && !forcar) Casa.fotos(rep);
  else getJson(api('fotos', forcar ? { nou: 1 } : null), rep, errXarxa('carregar les fotos'));
}
function mes() {
  var l = F.llista, fi = Math.min(l.length, F.fets + 240), tl = $('tl');
  for (var i = F.fets; i < fi; i++) {
    var d = new Date(l[i][1]), clau = d.getFullYear() + '-' + d.getMonth();
    if (clau != F.mesActual) {
      F.mesActual = clau;
      var t = document.createElement('div');
      t.className = 'mes';
      t.innerHTML = majuscula(MESOS[d.getMonth()]) + ' de ' + d.getFullYear() + '<span>' + F.comptes[clau] + '</span>';
      tl.appendChild(t);
      F.grup = document.createElement('div');
      F.grup.className = 'fg';
      tl.appendChild(F.grup);
    }
    var e = document.createElement('div');
    e.className = 'ft';
    e.setAttribute('data-i', i);
    if (l[i][2]) e.innerHTML = '<span class="v">▶ vídeo</span>';
    e.onclick = clic;
    F.grup.appendChild(e);
    F.els.push({ el: e, i: i, on: false });
  }
  F.fets = fi;
  mandra();
}
function clic() { viObre(+this.getAttribute('data-i')); }
var mandraT = null;
function mandra() {
  var v = $('pag'), h = v.clientHeight;
  if (!h) return;
  if (v.scrollTop + h > v.scrollHeight - 2000 && F.fets < F.llista.length) { mes(); return; }
  for (var i = 0; i < F.els.length; i++) {
    var e = F.els[i], r = e.el.getBoundingClientRect();
    if (r.bottom > -h && r.top < h * 2.5) {
      if (!e.on) { e.on = true; if (!F.llista[e.i][2]) e.el.style.backgroundImage = bg(miniUrl('fotos', F.llista[e.i][0], 320)); }
    } else if (e.on && (r.bottom < -h * 6 || r.top > h * 8)) {
      e.on = false; e.el.style.backgroundImage = 'none';
    }
  }
}
$('pag').addEventListener('scroll', function () {
  if (mandraT) return;
  mandraT = setTimeout(function () { mandraT = null; mandra(); }, 120);
});
window.addEventListener('resize', function () { setTimeout(mandra, 100); });
window.casaMostra = function () { setTimeout(mandra, 50); };
function puja(inp) {
  var fs = inp.files, n = 0, total = fs.length, errors = 0;
  if (!total) return;
  var ara = new Date(), prefix = ara.getFullYear() + dos(ara.getMonth() + 1) + dos(ara.getDate()) + '_' + dos(ara.getHours()) + dos(ara.getMinutes()) + dos(ara.getSeconds());
  function seguent() {
    if (n >= total) {
      inp.value = '';
      avis(errors ? 'Algunes no s\'han pogut pujar' : 'Pujades ' + total + ' fotos');
      if (Casa) Casa.fotosRecarrega();
      setTimeout(function () { carrega(true); }, 500);
      return;
    }
    var f = fs[n], e = ext(f.name || '') || (f.type.indexOf('video') === 0 ? 'mov' : 'jpg');
    var nom = 'iPad_' + prefix + '_' + dos(n + 1) + '.' + e;
    post(api('pujar', { c: 'fotos', p: 'Pujades iPad', nom: nom }), f, function () { n++; seguent(); },
      function () { errors++; n++; seguent(); },
      function (p) { $('estat').textContent = 'Pujant ' + (n + 1) + ' de ' + total + '… ' + Math.round(p * 100) + '%'; });
  }
  seguent();
}
var VI = { i: 0, video: null, x0: null, y0: null };
function viObre(i) { VI.i = i; $('visor').style.display = 'block'; viPinta(); }
function viTreuVideo() {
  if (VI.video) { VI.video.pause(); VI.video.removeAttribute('src'); VI.video.parentNode.removeChild(VI.video); VI.video = null; }
}
function viPinta() {
  var f = F.llista[VI.i], img = $('vi-img');
  viTreuVideo();
  if (f[2]) {
    img.style.backgroundImage = 'none';
    var v = document.createElement('video');
    v.setAttribute('controls', 'controls'); v.setAttribute('autoplay', 'autoplay');
    v.src = fUrl('fotos', f[0]);
    $('visor').appendChild(v); VI.video = v;
  } else {
    img.style.backgroundImage = bg(miniUrl('fotos', f[0], 1600));
    var s = F.llista[VI.i + 1];
    if (s && !s[2]) { var pre = new Image(); pre.src = miniUrl('fotos', s[0], 1600); }
  }
  var d = new Date(f[1]);
  $('vi-info').textContent = majuscula(dataLlarga(d)) + ' de ' + d.getFullYear() + ' · ' + d.getHours() + ':' + dos(d.getMinutes()) + '    ' + (VI.i + 1) + ' / ' + F.llista.length;
}
function viMou(d) { var n = VI.i + d; if (n < 0 || n >= F.llista.length) return; VI.i = n; viPinta(); }
function viTanca() { viTreuVideo(); $('visor').style.display = 'none'; $('vi-img').style.backgroundImage = 'none'; }
$('vi-img').addEventListener('touchstart', function (e) { VI.x0 = e.touches[0].clientX; VI.y0 = e.touches[0].clientY; }, false);
$('vi-img').addEventListener('touchend', function (e) {
  if (VI.x0 == null) return;
  var dx = e.changedTouches[0].clientX - VI.x0, dy = e.changedTouches[0].clientY - VI.y0;
  VI.x0 = null;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) viMou(dx < 0 ? 1 : -1);
  else if (dy > 90) viTanca();
}, false);
window.casaAmaga = function () { if (VI.video) VI.video.pause(); };
carrega();
</script>
</body>
</html>
