<script>
var NAV_TELE_DETECTAT = /Web0S|webOS|NetCast|SmartTV|SMART-TV|Tizen|HbbTV|BRAVIA|Android TV|AFT[A-Z]|CrKey/i.test(navigator.userAgent);
/* Navegadors molt vells (Xbox 360, Internet Explorer, teles i consoles antigues): si no entenen flexbox, no poden
   mostrar aquesta pantalla i van a una versió senzilla. Els iPhone, iPad i iPod antics es queden aquí (ja hi estan adaptats).
   ?complet=1 obre aquesta igualment; ?simple=1 obre la senzilla en qualsevol aparell. */
(function () {
  var q = location.search, st = document.documentElement.style, ua = navigator.userAgent;
  var senseFlex = !('flex' in st) && !('webkitFlex' in st);
  var vell = /Xbox|MSIE |Trident\//.test(ua) || (senseFlex && !/iPhone|iPad|iPod/.test(ua));
  if (q.indexOf('complet') < 0 && (vell || q.indexOf('simple') >= 0)) location.replace('/simple.html');
})();
/* Si la pantalla d'inici no arrenca (un error, o dades d'aquest navegador fetes malbé), no es queda buida:
   el primer cop esborra les dades locals i ho torna a provar; si torna a fallar, ensenya l'error i un botó per reparar. */
var HEARTH_ERRS = [];
window.onerror = function (m, u, l) { HEARTH_ERRS.push(m + ' (' + String(u || '').split('/').pop() + ':' + l + ')'); };
function hearthRepara() {
  /* s'esborren les dades locals, però no l'identificador d'aquest aparell: si no, en perdria els ajustos */
  try { var id = localStorage.getItem('casa.disp'); localStorage.clear(); if (id) localStorage.setItem('casa.disp', id); } catch (e) { }
  var fet = function () { location.reload(); };
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { for (var i = 0; i < rs.length; i++) rs[i].unregister(); });
      if (window.caches) caches.keys().then(function (k) { for (var i = 0; i < k.length; i++) caches['delete'](k[i]); });
    }
  } catch (e) { }
  setTimeout(fet, 800);
}
setTimeout(function () {
  var c = document.getElementById('cfg');
  if (c && c.innerHTML) { try { sessionStorage.removeItem('hearth-rep'); } catch (e) { } return; }
  var ja = ''; try { ja = sessionStorage.getItem('hearth-rep') || ''; } catch (e) { }
  if (!ja) {
    try { sessionStorage.setItem('hearth-rep', '1'); } catch (e) { }
    if (HEARTH_ERRS.length) hearthRepara(); else location.reload();
    return;
  }
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:20px;right:20px;top:20px;z-index:99999;background:#2c2c2e;color:#fff;border-radius:16px;padding:18px;font:15px -apple-system,Segoe UI,sans-serif;box-shadow:0 10px 40px rgba(0,0,0,.5)';
  var t = (HEARTH_ERRS.length ? HEARTH_ERRS.slice(0, 5).join('\n') : 'No answer from the server / Sense resposta del servidor');
  d.innerHTML = '<b>Hearth no ha pogut arrencar</b><pre style="white-space:pre-wrap;font-size:12px;opacity:.8;margin:10px 0"></pre><button style="font-size:16px;padding:10px 16px;border-radius:10px;border:0;background:#0a84ff;color:#fff">Repara i torna-ho a provar</button>';
  d.getElementsByTagName('pre')[0].textContent = t + '\n' + navigator.userAgent;
  d.getElementsByTagName('button')[0].onclick = function () { try { sessionStorage.removeItem('hearth-rep'); } catch (e) { } hearthRepara(); };
  document.body.appendChild(d);
}, 25000);
</script>

/* ===== Passi de fotos (pantalla completa) ===== */
#marc{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:90;display:none}

/* Estils del passi de fotos */
#marc .capa .kb{position:absolute;top:0;left:0;right:0;bottom:0;background:center/cover no-repeat;-webkit-animation:kb 20s linear forwards;animation:kb 20s linear forwards}
@-webkit-keyframes kb{from{-webkit-transform:scale(1.02)}to{-webkit-transform:scale(1.2)}}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.2)}}
#marc .capa .fb{position:absolute;top:-8%;left:-8%;right:-8%;bottom:-8%;background:center/cover no-repeat;opacity:.55}

  for (var i = 0; i < PCM.fonts.length; i++) { try { if (PCM.fonts[i].stop) PCM.fonts[i].stop(0); else PCM.fonts[i].noteOff(0); } catch (e) { } }
  PCM.fonts = [];
  if (PCM.id) { getJson(api('pcm/atura', { id: PCM.id }), function () { }, function () { }); }
  PCM.id = ''; PCM.actiu = false; PCM.sona = false; PCM.fi = 0;
  if (!silenci) iconesPlay();
}
/* Pausa = deixar d'escoltar; en tornar, es reprèn el directe */
/* Fi d'un MP3 o pòdcast: espera que acabi de sonar i passa al següent */
function pcmAcabat(g) {
  var queda = PCM.ctx ? Math.max(0, PCM.fi - PCM.ctx.currentTime) : 0;
  setTimeout(function () {
    if (g != PCM.gen) return;
    var it = R.cua[R.pos];
    pcmAtura(true); PCM.params = null;
    if (it && it.k == 'podcast') { poDesaPos(true); iconesPlay(); notifica(); return; }
    if (R.pos < R.cua.length - 1) { R.pos++; repToca(); } else iconesPlay();
  }, queda * 1000 + 200);
}
function pcmMiraSilenci(niv) {
  PCM.silenci = niv > 0 ? 0 : (PCM.silenci || 0) + 1;
  if (PCM.silenci >= 12 && !PCM.avisat && SP.estat && SP.estat.sona) {
    PCM.avisat = true;
    avis(T('Arriba silenci del PC: l\'Spotify sona, però no pel cable d\'àudio (CABLE Input). Mira Configuració ▸ Diagnòstic.'), 10000);
  }
}
function pcmCommuta() { if (PCM.sona || PCM.actiu) { var p = PCM.params; if (p && p.font == 'fitxer') { p = { font: 'fitxer', u: p.u, ss: Math.round(pcmTemps()) }; PCM.ss = p.ss; } pcmAtura(); PCM.params = p; PCM.pausat = true; poDesaPos(); } else if (PCM.params) { PCM.pausat = false; pcmInicia(PCM.params); } iconesPlay(); notifica(); }
setInterval(function () {
  if (!esPcmFitxer() || !PCM.sona) return;
  progres();
  var it = R.cua[R.pos];
  if (it && it.k == 'podcast' && Date.now() - podT > 10000) { podT = Date.now(); poDesaPos(); }
}, 1000);
function sonaPausat() { return PCM.params && (PCM.actiu || PCM.pausat) ? !PCM.sona : au.paused; }

/* ---------- Tocs fiables a iOS 9 ----------
   El Safari 9 de vegades decideix què s'ha tocat amb posicions antigues (després que el vídeo
   o la caràtula canviïn de lloc) i el toc va a parar a un altre element, o enlloc.
   Aquí es mira què hi ha realment sota el dit (elementFromPoint, amb la posició d'ara)
   i, si no coincideix amb el que ha triat el Safari, es fa el clic al lloc bo. */
(function () {
  if (!IOS_VELL && !USA_PCM) return;
  var t0 = null;
  function clicable(el) {
    while (el && el !== document.body && el.nodeType == 1) {
      var tg = el.tagName;
      if (tg == 'INPUT' || tg == 'SELECT' || tg == 'TEXTAREA' || tg == 'IFRAME' || tg == 'VIDEO') return null;
      if (tg == 'BUTTON' || tg == 'A' || el.getAttribute('onclick')) return el;
      el = el.parentNode;
    }
    return null;
  }
  document.addEventListener('touchstart', function (e) {
    t0 = e.touches.length == 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), el: e.target } : null;
  }, true);
  document.addEventListener('touchend', function (e) {
    var a = t0; t0 = null;
    if (!a || !e.changedTouches || !e.changedTouches.length) return;
    var c = e.changedTouches[0];
    if (Math.abs(c.clientX - a.x) > 12 || Math.abs(c.clientY - a.y) > 12 || Date.now() - a.t > 800) return;
    var real = document.elementFromPoint(c.clientX, c.clientY);
    if (!real || real.tagName == 'IFRAME') return;
    var bo = clicable(real), triat = clicable(a.el);
    if (bo && bo !== triat) {
      e.preventDefault();
      try { bo.click(); } catch (x) { }
    }
  }, true);
})();
