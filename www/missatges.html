<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>Missatges</title>
<script src="i18n.js"></script>
<style>
#tabs{position:absolute;top:0;left:0;right:0;height:50px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 10px;background:#12181d;border-bottom:1px solid rgba(255,255,255,.08);z-index:5}
#tabs button{margin-right:8px;padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.07);font-size:15px;position:relative}
#tabs button.on{background:#25d366;color:#000}
#tabs button i{font-style:normal;background:#ff3b30;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;margin-left:6px;font-weight:700}
#wa{position:absolute;top:50px;left:0;right:0;bottom:0;display:-webkit-flex;display:flex}
#esq{width:340px;-webkit-flex:none;flex:none;border-right:1px solid rgba(255,255,255,.08);overflow-y:auto;-webkit-overflow-scrolling:touch}
#dre{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-width:0;background:#0b1014}
#esq h1{margin:18px 16px 10px}
.xat{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05)}
.xat.on{background:rgba(255,255,255,.08)}
.xat .av{width:48px;height:48px;border-radius:24px;background:#2a3540 center/cover;-webkit-flex:none;flex:none;margin-right:12px;text-align:center;line-height:48px;font-weight:700;font-size:20px;color:#9fb0bf}
.xat .tx{-webkit-flex:1;flex:1;min-width:0}
.xat .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xat .ds{color:#8d95a1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.xat .nl{background:#25d366;color:#000;border-radius:12px;min-width:24px;height:24px;line-height:24px;text-align:center;font-size:13px;font-weight:700;padding:0 6px;margin-left:8px}
.xat .hr{color:#8d95a1;font-size:12px;margin-left:8px;-webkit-flex:none;flex:none}
#cap{height:60px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08);background:#12181d;-webkit-flex:none;flex:none}
#cap b{-webkit-flex:1;flex:1;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cap button{margin-right:10px}
#msgs{-webkit-flex:1;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px}
.m{max-width:72%;margin:0 0 8px;padding:8px 12px;border-radius:14px;line-height:1.35;font-size:16px;word-wrap:break-word;clear:both}
.m.entra{background:#1f2c34;float:left;border-top-left-radius:4px}
.m.surt{background:#005c4b;float:right;border-top-right-radius:4px}
.m.sistema{background:none;color:#8d95a1;font-size:13px;text-align:center;float:none;max-width:none;margin:10px auto}
.m .qui{color:#53bdeb;font-size:13px;font-weight:600;display:block}
.m .hr{color:rgba(255,255,255,.55);font-size:11px;margin-left:8px;float:right;margin-top:6px}
.m .md{color:#9fb0bf;font-style:italic}
.fi{clear:both}
#peu{display:-webkit-flex;display:flex;padding:10px 12px;background:#12181d;-webkit-flex:none;flex:none}
#peu textarea{-webkit-flex:1;flex:1;resize:none;height:46px;border-radius:23px;border:0;padding:12px 18px;font-size:17px;background:#2a3540;color:#fff;font-family:inherit;-webkit-appearance:none}
#peu button{margin-left:10px;width:46px;height:46px;border-radius:23px;padding:0;background:#25d366;color:#000}
#peu button .ic{width:24px;height:24px}
#buit{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;color:#8d95a1;text-align:center;padding:30px}
#login{position:absolute;top:50px;left:0;right:0;bottom:0;background:#0e1116;display:none;text-align:center;padding:40px 30px;overflow:auto}
#login img{width:264px;height:264px;background:#fff;border-radius:12px;padding:12px;margin:18px auto;display:block}
#pin{position:absolute;top:0;left:0;right:0;bottom:0;background:#0e1116;z-index:20;display:none;text-align:center;padding-top:40px;overflow:auto}
#pin .pts{margin:18px 0 22px;font-size:34px;letter-spacing:14px;height:40px}
#pin .tec{width:270px;margin:0 auto}
#pin .tec button{width:74px;height:74px;border-radius:37px;margin:8px;font-size:28px;background:rgba(255,255,255,.08);padding:0}
#pin.mal .pts{color:#ff453a}
@media (orientation:portrait){
  #esq{width:auto;-webkit-flex:1;flex:1;border:0}
  #dre{display:none}
  body.obert #esq{display:none}
  body.obert #dre{display:-webkit-flex;display:flex}
}
@media (orientation:landscape){ #cap .torna{display:none} }
</style>
</head>
<body>
<div id="pin"><h1>Missatges</h1><div class="gris" id="pin-t"></div><div class="pts" id="pin-p"></div><div class="tec" id="pin-tec"></div></div>
<div id="tabs"></div>
<div id="wa">
  <div id="esq"><h1>Missatges</h1><div id="xats"><div class="gris" style="padding:16px">Connectant…</div></div></div>
  <div id="dre">
    <div id="buit">Tria un xat de la llista.</div>
    <div id="cap" style="display:none"><button class="torna" onclick="tancaXat()">‹</button><b id="cap-nom"></b></div>
    <div id="msgs" style="display:none"></div>
    <div id="peu" style="display:none"><textarea id="text" placeholder="Escriu un missatge" onkeydown="if(event.keyCode==13&&!event.shiftKey){event.preventDefault();envia();}"></textarea><button onclick="envia()" id="b-env"></button></div>
  </div>
</div>
<div id="login">
  <h1 id="login-tit"></h1>
  <div class="gris" id="login-ajuda"></div>
  <img id="qr" alt="">
  <div class="gris petit" id="login-estat"></div>
  <p><button onclick="post(api(base() + 'mostra'),'',function(){avis(T('S\'ha obert a la pantalla del PC.'))})">Mostra-ho a la pantalla del PC</button></p>
</div>
<script src="comu.js"></script>
<script>
dinsCasa('missatges');
$('b-env').innerHTML = svg('M2.01 21L23 12 2.01 3 2 10l15 2-15 2z');
var W = { xat: '', t: null, tx: null, llista: [], darrer: '', srv: '', actius: [], tot: {} };
/* els serveis: clau, nom de la pestanya, funció a Configuració, adreça de l'API, instruccions per vincular */
var SRV = [
  ['wa', 'WhatsApp', 'whatsapp', 'admin/wa/', 'Connecta el WhatsApp', 'Al telèfon: WhatsApp ▸ Configuració ▸ Dispositius vinculats ▸ Vincula un dispositiu, i escaneja aquest codi.'],
  ['sms', 'SMS', 'sms', 'admin/xat/sms/', 'Connecta Google Messages', 'Al telèfon: Missatges de Google ▸ la teva foto o el menú ▸ Vinculació de dispositius (Missatges per a la web) ▸ Escàner de codis QR, i escaneja aquest codi.'],
  ['fb', 'Messenger', 'messenger', 'admin/xat/fb/', 'Connecta el Messenger', 'Cal iniciar la sessió de Facebook un cop a l\'Edge del PC. Prem el botó de sota: s\'obrirà a la pantalla del PC.']
];
function srvDe(k) { for (var i = 0; i < SRV.length; i++) if (SRV[i][0] == k) return SRV[i]; return SRV[0]; }
function base() { return srvDe(W.srv)[3]; }
function ini(n) { return (n || '?').replace(/[^A-Za-zÀ-ú0-9]/g, '').charAt(0).toUpperCase() || '?'; }
/* les pestanyes dels serveis activats a Configuració, amb els no llegits */
function pintaTabs() {
  var h = '';
  for (var i = 0; i < W.actius.length; i++) {
    var sv = W.actius[i], n = W.tot[sv[0]] || 0;
    h += '<button class="' + (sv[0] == W.srv ? 'on' : '') + '" onclick="triaSrv(\'' + sv[0] + '\')">' + esc(T(sv[1])) + (n ? '<i>' + (n > 99 ? '99+' : n) + '</i>' : '') + '</button>';
  }
  $('tabs').innerHTML = h;
  $('tabs').style.display = W.actius.length > 1 ? '' : 'none';
  $('wa').style.top = $('login').style.top = W.actius.length > 1 ? '50px' : '0';
}
function triaSrv(k, xat) {
  if (k != W.srv) { W.srv = k; W.xat = ''; W.llista = []; W.darrer = ''; tancaXat(); $('buit').style.display = ''; $('cap').style.display = 'none'; $('msgs').style.display = 'none'; $('peu').style.display = 'none'; $('xats').innerHTML = '<div class="gris" style="padding:16px">' + T('Connectant…') + '</div>'; }
  if (xat) W.pendent = xat;
  try { localStorage.setItem('msgSrv', k); } catch (e) { }
  pintaTabs();
  estat();
}
function comptes() {
  for (var i = 0; i < W.actius.length; i++) (function (sv) {
    getJson(api(sv[3] + 'nous', { des: Date.now() }), function (d) { W.tot[sv[0]] = d && d.total ? d.total : 0; pintaTabs(); }, function () { });
  })(W.actius[i]);
  clearTimeout(W.tc); W.tc = setTimeout(comptes, 20000);
}
function inicia(srv, xat) {
  dades('ajustos', function (a) {
    a = a || {};
    W.actius = [];
    for (var i = 0; i < SRV.length; i++) if (a[SRV[i][2]]) W.actius.push(SRV[i]);
    if (!W.actius.length) W.actius.push(SRV[0]);
    var k = srv;
    if (!k) { try { k = localStorage.getItem('msgSrv'); } catch (e) { } }
    var ok = false; for (i = 0; i < W.actius.length; i++) if (W.actius[i][0] == k) ok = true;
    W.srv = '';
    triaSrv(ok ? k : W.actius[0][0], xat);
    comptes();
  });
}
function estat() {
  var sv = srvDe(W.srv), k = W.srv;
  getJson(api(sv[3] + 'estat'), function (d) {
    if (W.srv != k) return;
    if (d && d.sessio) { $('login').style.display = 'none'; carregaXats(); return; }
    $('login').style.display = 'block';
    $('login-tit').textContent = T(sv[4]);
    $('login-ajuda').textContent = d && d.pin ? T('Facebook demana el PIN dels xats xifrats. Prem el botó de sota i posa\'l a la pantalla del PC.') : T(sv[5]);
    $('login-estat').textContent = d && d.carregant ? T('Carregant…') : '';
    $('qr').style.display = d && d.qr ? '' : 'none';
    if (d && d.qr) getJson(api(sv[3] + 'qr'), function (u) { if (u && W.srv == k) $('qr').src = u; }, function () { });
    clearTimeout(W.t); W.t = setTimeout(estat, 5000);
  }, function (st, txt) {
    var m = ''; try { m = JSON.parse(txt).error; } catch (e) { }
    $('xats').innerHTML = '<div class="ajuda" style="margin:16px">' + (st == 401 ? T('Cal la contrasenya del servidor (Configuració).') : T('No puc connectar.') + ' ' + esc(m || '')) + '</div>';
    clearTimeout(W.t); W.t = setTimeout(estat, 10000);
  });
}
function carregaXats() {
  var k = W.srv;
  getJson(api(base() + 'xats'), function (l) {
    if (W.srv != k) return;
    W.llista = l || [];
    var h = '';
    for (var i = 0; i < W.llista.length; i++) {
      var x = W.llista[i];
      h += '<div class="xat' + (x.nom == W.xat ? ' on' : '') + '" onclick="obreXat(' + i + ')"><div class="av"' + (x.img && /^https/.test(x.img) ? ' style="background-image:' + bg(imgx(x.img, 96)) + '"' : '') + '>' + (x.img && /^https/.test(x.img) ? '' : esc(ini(x.nom))) + '</div>' +
        '<div class="tx"><div class="nm">' + esc(x.nom) + '</div><div class="ds">' + esc(x.darrer || '') + '</div></div>' +
        (x.noLlegits ? '<span class="nl">' + x.noLlegits + '</span>' : '<span class="hr">' + esc(x.hora || '') + '</span>') + '</div>';
    }
    $('xats').innerHTML = h || '<div class="gris" style="padding:16px">' + T('Encara no hi ha xats (o s\'estan carregant).') + '</div>';
    if (W.pendent) { var p = W.pendent; for (var j = 0; j < W.llista.length; j++) if (W.llista[j].nom == p) { W.pendent = ''; obreXat(j); return; } }
    clearTimeout(W.t); W.t = setTimeout(carregaXats, 8000);
  }, function () { clearTimeout(W.t); W.t = setTimeout(estat, 8000); });
}
function obreXat(i) {
  var x = W.llista[i];
  W.xat = x.nom; W.darrer = '';
  document.body.className = 'obert';
  $('buit').style.display = 'none';
  $('cap').style.display = ''; $('msgs').style.display = ''; $('peu').style.display = '';
  $('cap-nom').textContent = x.nom;
  $('msgs').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  carregaXats();
  carregaMsgs();
}
function tancaXat() { W.xat = ''; document.body.className = ''; clearTimeout(W.tx); }
function carregaMsgs() {
  clearTimeout(W.tx);
  if (!W.xat) return;
  var xat = W.xat;
  getJson(api(base() + 'missatges', { xat: xat }), function (d) {
    if (W.xat != xat) return;
    if (d.error) { $('msgs').innerHTML = '<div class="gris">' + esc(d.error) + '</div>'; return; }
    var h = '', l = d.missatges || [];
    for (var i = 0; i < l.length; i++) {
      var m = l[i];
      if (m.tipus == 'sistema') { h += '<div class="m sistema">' + esc(m.text) + '</div>'; continue; }
      h += '<div class="m ' + m.tipus + '">' + (m.tipus == 'entra' && m.qui && m.qui != xat ? '<span class="qui">' + esc(m.qui) + '</span>' : '') +
        (m.media ? '<span class="md">[' + esc(T(m.media)) + ']</span> ' : '') + esc(m.text).replace(/\n/g, '<br>') + (m.hora ? '<span class="hr">' + esc(m.hora) + '</span>' : '') + '</div>';
    }
    h += '<div class="fi"></div>';
    if (h != W.darrer) {
      var mm = $('msgs'), alFinal = mm.scrollTop + mm.clientHeight > mm.scrollHeight - 80 || !W.darrer;
      mm.innerHTML = h; W.darrer = h;
      if (alFinal) mm.scrollTop = mm.scrollHeight;
    }
    W.tx = setTimeout(carregaMsgs, 4000);
  }, function () { W.tx = setTimeout(carregaMsgs, 6000); });
}
function envia() {
  var t = $('text').value;
  if (!retalla(t) || !W.xat) return;
  $('text').value = '';
  peticio('POST', api(base() + 'envia', { xat: W.xat }), t, function (txt) {
    var d = {}; try { d = JSON.parse(txt); } catch (e) { }
    if (d.ok === false) { avis(d.error || T('No s\'ha pogut enviar'), 4000); $('text').value = t; return; }
    setTimeout(carregaMsgs, 600);
  }, function () { avis(T('No s\'ha pogut enviar'), 4000); $('text').value = t; });
}
/* des d'un avís: "servei|nom del xat" */
window.casaObre = function (a) {
  a = decodeURIComponent(a);
  var k = 'wa', p = a.indexOf('|');
  if (p > 0 && p < 4) { k = a.substring(0, p); a = a.substring(p + 1); }
  /* si ja és obert i desbloquejat, directament; si no, passant pel PIN */
  if (PIN.aj && !msgBloquejat(PIN.aj) && $('pin').style.display == 'none' && k == W.srv) { for (var i = 0; i < W.llista.length; i++) if (W.llista[i].nom == a) { obreXat(i); return; } W.pendent = a; return; }
  entra(k, a);
};
/* ---------- PIN (Configuració ▸ Missatges): es demana en obrir l'app i si fa més de 5 minuts que se n'ha sortit ---------- */
var PIN = { aj: null, v: '' };
function pinPinta() {
  var h = '', t = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
  for (var i = 0; i < t.length; i++) h += t[i] ? '<button onclick="pinTecla(\'' + t[i] + '\')">' + t[i] + '</button>' : '<button style="visibility:hidden"></button>';
  $('pin-tec').innerHTML = h;
  $('pin-t').textContent = T('Escriu el PIN');
  $('pin-p').textContent = '';
}
function pinTecla(k) {
  $('pin').className = '';
  if (k == '⌫') PIN.v = PIN.v.slice(0, -1); else if (PIN.v.length < 4) PIN.v += k;
  $('pin-p').textContent = new Array(PIN.v.length + 1).join('●');
  if (PIN.v.length < 4) return;
  if (hashPin(PIN.v) == PIN.aj.msgPin) { PIN.v = ''; ls('msgObert', Date.now()); $('pin').style.display = 'none'; entra2(); }
  else { PIN.v = ''; $('pin').className = 'mal'; $('pin-t').textContent = T('PIN incorrecte'); setTimeout(function () { $('pin-p').textContent = ''; }, 600); }
}
/* mentre l'app és oberta, es manté desbloquejada */
setInterval(function () { if (PIN.aj && PIN.aj.msgPin && $('pin').style.display == 'none' && !W.amagada) ls('msgObert', Date.now()); }, 30000);
function entra(srv, xat) {
  dades('ajustos', function (a) {
    PIN.aj = a || {};
    PIN.pend = [srv, xat];
    if (msgBloquejat(PIN.aj)) {
      clearTimeout(W.t); clearTimeout(W.tx); clearTimeout(W.tc);
      PIN.v = ''; pinPinta(); $('pin').className = ''; $('pin').style.display = 'block';
      return;
    }
    $('pin').style.display = 'none';
    entra2();
  });
}
function entra2() {
  var p = PIN.pend || [];
  PIN.pend = null;
  if (!W.actius.length || p[0]) inicia(p[0], p[1]);
  else { if (W.srv) { estat(); comptes(); } if (W.xat) carregaMsgs(); }
}
window.casaAmaga = function () {
  W.amagada = true;
  if (PIN.aj && PIN.aj.msgPin && $('pin').style.display == 'none') ls('msgObert', Date.now());
  clearTimeout(W.t); clearTimeout(W.tx); clearTimeout(W.tc);
};
window.casaMostra = function () { W.amagada = false; entra(); };
entra();
</script>
</body>
</html>
