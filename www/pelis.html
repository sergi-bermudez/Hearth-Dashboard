<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>Pel·lícules</title>
<script src="i18n.js"></script>
<style>
.it .im .lletra small{font-size:14px}
.pest{margin-bottom:12px;white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch}
.pest button{margin-right:8px;border-radius:22px;padding:9px 18px}
.pest button.on{background:#fff;color:#111}
.xips .xip.on{background:#fff;color:#111}
.nota-idx{color:#8d95a1;font-size:14px;margin:-4px 0 10px}
.it .any{color:#8d95a1;font-size:13px}
.it .im .nou{position:absolute;left:6px;top:6px;background:#ffab3d;color:#111;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.el .d{color:#8d95a1;font-size:14px;margin-left:10px;-webkit-flex:none;flex:none}
.el.curt .t{color:#8d95a1}
.fx-avis{background:rgba(255,171,61,.12);border-left:3px solid #ffab3d;padding:8px 12px;border-radius:6px;color:#e6d2b0;font-size:14px;margin:12px 0}
.fx-fitxer{color:#6f7782;font-size:13px;margin-top:4px;word-break:break-all}
#fitxa{position:absolute;top:0;left:0;right:0;bottom:0;background:#0e1116;z-index:40;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
#fx-fons{position:absolute;top:0;left:0;right:0;height:430px;background:#14181e center top/cover no-repeat}
#fx-fons:after{content:"";position:absolute;left:0;right:0;bottom:0;height:100%;background:-webkit-linear-gradient(top,rgba(14,17,22,.35),#0e1116);background:linear-gradient(to bottom,rgba(14,17,22,.35),#0e1116)}
#fx-cos{position:relative;padding:24px 28px 60px;display:-webkit-flex;display:flex}
#fx-poster{width:230px;height:345px;border-radius:12px;background:#1d2229 center/cover no-repeat;-webkit-flex:none;flex:none;margin-right:28px;margin-top:60px}
#fx-info{-webkit-flex:1;flex:1;padding-top:120px}
#fx-info h1{font-size:34px;margin-bottom:6px}
.fx-dades{color:#b4bbc5;margin-bottom:14px}
.fx-dades span{margin-right:14px}
.nota{display:inline-block;background:rgba(255,255,255,.1);border-radius:8px;padding:4px 10px;margin-right:8px;font-weight:600;font-size:15px}
.fx-sin{line-height:1.5;color:#d6dae0;margin:16px 0 22px;max-width:640px}
.fx-bt button{margin:0 8px 8px 0;padding:12px 20px}
@media (max-width:800px){ #fx-poster{width:170px;height:255px} #fx-info{padding-top:90px} #fx-info h1{font-size:26px} }
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>Pel·lícules</h1></div>
  <div class="pest" id="pest"></div>
  <div class="xips" id="filtre"></div>
  <div class="nota-idx" id="nota"></div>
  <div id="veient"></div>
  <div class="cami" id="cami"></div>
  <div class="gra" id="gra"></div>
  <div class="llista" id="fitxers"></div>
</div>
<div id="fitxa">
  <div id="fx-fons"></div>
  <div style="position:absolute;top:16px;left:16px;z-index:3"><button onclick="tancaFitxa()">‹ Tornar</button></div>
  <div id="fx-cos"><div id="fx-poster"></div><div id="fx-info"></div></div>
</div>
<script src="comu.js"></script>
<script>
dinsCasa('pelis');
var PEST = [['totes', 'Totes'], ['recents', 'Afegides fa poc'], ['generes', 'Gèneres'], ['decades', 'Dècades'], ['noreco', 'Sense reconèixer'], ['fitxers', 'Fitxers']];
var P = { pest: ls('pelis.pest') || 'totes', l: [], filtre: null, cami: '', tots: {}, t: null };
function netejaTitol(n) {
  var t = n.replace(/\.[a-z0-9]{2,4}$/i, '').replace(/[._]+/g, ' ');
  var m = /^(.+?)[\s(\[]+((19|20)\d\d)\b/.exec(t);
  if (m && m[1].length > 1) t = m[1];
  t = t.replace(/\b(2160p|1080p|720p|480p|4k|uhd|x264|x265|h ?264|h ?265|hevc|bluray|blu-ray|brrip|bdrip|webrip|web-dl|web|dvdrip|hdrip|hdtv|aac|ac3|dts|remux|multi|dual|castellano|catala|vose)\b.*$/i, '');
  t = t.replace(/[\[(].*$/, '').replace(/\s+/g, ' ');
  return retalla(t) || n;
}
function titol(e) { return e.titol || netejaTitol(e.n); }
function caratula(e, m) { return api('caratula', { p: e.p || e, m: m || 400, cau: 1, v: e.trobada ? 1 : 0 }); }
function generes(e) { return e.genere ? String(e.genere).split(/\s*[,\/|]\s*/) : []; }
function pintaPest() {
  var h = '';
  for (var i = 0; i < PEST.length; i++) h += '<button class="' + (PEST[i][0] == P.pest ? 'on' : '') + '" onclick="triaPest(\'' + PEST[i][0] + '\')">' + esc(T(PEST[i][1])) + '</button>';
  $('pest').innerHTML = h;
}
function triaPest(p) { P.pest = p; P.filtre = null; ls('pelis.pest', p); pintaPest(); $('pag').scrollTop = 0; pinta(); }
function carregaLlista() {
  clearTimeout(P.t);
  getJson(api('pelis/llista'), function (d) {
    P.l = d.pelis || [];
    for (var i = 0; i < P.l.length; i++) P.tots[P.l[i].p] = P.l[i];
    $('nota').textContent = d.estat ? d.estat + '…' : '';
    if (P.pest != 'fitxers') pinta();
    if (d.estat || d.indexant) P.t = setTimeout(carregaLlista, 15000);
  }, function (st) {
    $('gra').innerHTML = '<div class="gris" style="margin:8px">' + (st == 404 ? T('La carpeta de pel·lícules no existeix. Revisa-la a Configuració.') : T('No s\'ha pogut carregar la biblioteca.')) + '</div>';
  });
}
function graella(l) {
  var h = '', vt = ls('veient') || {}, ara = Date.now();
  for (var i = 0; i < l.length; i++) {
    var e = l[i], v = vt[e.p];
    h += '<div class="it" onclick="fitxa(' + js(e.p) + ')"><div class="im" data-bg="' + esc(caratula(e)) + '"><div class="lletra">' + svg(IC.pelis) + '<small>' + esc(titol(e)) + '</small></div>' +
      (ara - e.t < 14 * 864e5 ? '<span class="nou">' + T('NOVA') + '</span>' : '') +
      (dins(EXT_VLC, e.ext) ? '<span class="etiq">VLC</span>' : '') +
      (v && v.d ? '<div class="prog"><div style="width:' + Math.round(100 * v.t / v.d) + '%"></div></div>' : '') +
      '</div><div class="nm">' + esc(titol(e)) + (e.any ? ' <span class="any">' + esc(e.any) + '</span>' : '') + '</div></div>';
  }
  return h;
}
function pinta() {
  $('cami').innerHTML = ''; $('fitxers').innerHTML = ''; $('filtre').innerHTML = '';
  pintaVeient();
  var l = P.l.slice(), i, h = '';
  if (P.pest == 'fitxers') { $('veient').innerHTML = ''; obreCarpeta(P.cami); return; }
  if (P.pest == 'recents') l.sort(function (a, b) { return b.t - a.t; });
  else l.sort(function (a, b) { return natural(titol(a), titol(b)); });
  if (P.pest == 'noreco') l = l.filter(function (e) { return !e.trobada; });
  if (P.pest == 'generes' || P.pest == 'decades') {
    var grups = {}, noms = [];
    for (i = 0; i < l.length; i++) {
      var ks = P.pest == 'generes' ? generes(l[i]) : (l[i].any ? [String(l[i].any).substring(0, 3) + '0s'] : []);
      if (!ks.length) ks = [T('Altres')];
      for (var k = 0; k < ks.length; k++) { if (!grups[ks[k]]) { grups[ks[k]] = []; noms.push(ks[k]); } grups[ks[k]].push(l[i]); }
    }
    noms.sort(P.pest == 'decades' ? function (a, b) { return a < b ? 1 : -1; } : natural);
    if (!P.filtre || !grups[P.filtre]) P.filtre = noms[0];
    for (i = 0; i < noms.length; i++) h += '<span class="xip' + (noms[i] == P.filtre ? ' on' : '') + '" onclick="P.filtre=' + js(noms[i]).replace(/"/g, '&quot;') + ';pinta()">' + esc(noms[i]) + ' <small>' + grups[noms[i]].length + '</small></span>';
    $('filtre').innerHTML = h;
    l = P.filtre ? grups[P.filtre] : [];
  }
  $('gra').innerHTML = graella(l) || '<div class="gris" style="margin:8px">' + (P.pest == 'noreco' ? T('Totes les pel·lícules estan reconegudes.') : T('Aquí no hi ha cap pel·lícula.')) + '</div>';
  setTimeout(mandros, 30);
}
function veientLlista() {
  var v = ls('veient') || {}, r = [];
  for (var k in v) if (v.hasOwnProperty(k)) r.push(v[k]);
  r.sort(function (a, b) { return b.ts - a.ts; });
  return r;
}
function pintaVeient() {
  var v = veientLlista(), h = '';
  if (P.pest != 'totes' || !v.length) { $('veient').innerHTML = ''; return; }
  for (var i = 0; i < Math.min(v.length, 5); i++)
    h += '<div class="it" onclick="fitxa(' + js(v[i].p) + ')"><div class="im" data-bg="' + esc(caratula(v[i].p)) + '"><div class="lletra">' + svg(IC.play) + '<small>' + esc(v[i].n) + '</small></div>' +
      '<div class="prog"><div style="width:' + Math.round(100 * v[i].t / v[i].d) + '%"></div></div></div><div class="nm">' + esc(v[i].n) + '<br><span class="gris">' + Tf('Queden {1}', durada(v[i].d - v[i].t)) + '</span></div></div>';
  $('veient').innerHTML = '<h2 style="margin-top:0">' + T('Continuar veient') + '</h2><div class="gra">' + h + '</div><h2>' + T('Totes') + '</h2>';
}

/* ---------- Mode fitxers: per trobar a mà qualsevol vídeo ---------- */
function obreCarpeta(cami) {
  P.cami = cami;
  $('gra').innerHTML = '';
  $('cami').innerHTML = camiHtml(T('Fitxers'), cami, 'obreCarpeta');
  $('fitxers').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('pelis/fitxers', { p: cami }), function (d) {
    var h = '', i;
    for (i = 0; i < d.carpetes.length; i++) h += '<div class="el" onclick="obreCarpeta(' + js(uneix(cami, d.carpetes[i])) + ')"><div class="mini">' + svg(IC.carpeta) + '</div><div class="t">' + esc(d.carpetes[i]) + '</div></div>';
    for (i = 0; i < d.videos.length; i++) {
      var e = d.videos[i];
      P.tots[e.p] = e;
      h += '<div class="el' + (e.esPeli ? '' : ' curt') + '" onclick="fitxa(' + js(e.p) + ')"><div class="mini" data-bg="' + esc(caratula(e, 96)) + '"><span class="lletra">' + svg(IC.pelis) + '</span></div>' +
        '<div class="t">' + esc(e.n + '.' + e.ext) + '<div class="sub">' + esc((e.titol ? e.titol + (e.any ? ' (' + e.any + ')' : '') + ' · ' : '') + mida(e.mida)) + (e.esPeli ? '' : ' · ' + T('curt, no surt a la biblioteca')) + '</div></div>' +
        (e.d ? '<span class="d">' + durada(e.d) + '</span>' : '') + '</div>';
    }
    $('fitxers').innerHTML = h || '<div class="gris">' + T('Aquesta carpeta és buida.') + '</div>';
    setTimeout(mandros, 30);
  }, function () { $('fitxers').innerHTML = '<div class="gris">' + T('No s\'ha pogut obrir la carpeta.') + '</div>'; });
}

/* ---------- Fitxa (com al Plex) ---------- */
var FX = { p: null, d: {}, e: null };
function fitxa(p) {
  FX.p = p; FX.d = {}; FX.e = P.tots[p] || null;
  var v = (ls('veient') || {})[p];
  $('fitxa').style.display = 'block';
  $('fitxa').scrollTop = 0;
  $('fx-fons').style.backgroundImage = 'none';
  $('fx-poster').style.backgroundImage = bg(api('caratula', { p: p, m: 460 }));
  pintaFitxa({ titol: FX.e ? titol(FX.e) : netejaTitol(p.split('/').pop()) }, v);
  getJson(api('pelis/video', { p: p }), function (e) { if (FX.p == p) { FX.e = e; pintaFitxa(FX.d.titol ? FX.d : { titol: titol(e) }, v); } }, function () { });
  getJson(api('peli', { p: p }), function (d) {
    if (FX.p != p) return;
    FX.d = d;
    pintaFitxa(d, v);
    $('fx-poster').style.backgroundImage = bg(api('caratula', { p: p, m: 460, v: 2 }));
    if (d.fons) { var u = api('caratula', { p: p, fons: 1, m: 1280 }), im = new Image(); im.onload = function () { if (FX.p == p) $('fx-fons').style.backgroundImage = bg(u); }; im.src = u; }
  }, function () { });
}
function pintaFitxa(d, v) {
  var e = FX.e && FX.e.p == FX.p ? FX.e : null, vlc = e && dins(EXT_VLC, e.ext), h = '<h1>' + esc(d.titol || '') + '</h1><div class="fx-dades">';
  if (d.any) h += '<span>' + esc(d.any) + '</span>';
  if (d.minuts) h += '<span>' + esc(d.minuts) + ' min</span>'; else if (e && e.d) h += '<span>' + durada(e.d) + '</span>';
  if (d.genere) h += '<span>' + esc(d.genere) + '</span>';
  if (d.edat) h += '<span>' + esc(d.edat) + '</span>';
  h += '</div><div>';
  if (d.nota) h += '<span class="nota">★ ' + esc(d.nota) + '/10</span>';
  if (d.imdb) h += '<span class="nota">IMDb ' + esc(d.imdb) + '</span>';
  if (d.rotten) h += '<span class="nota">🍅 ' + esc(d.rotten) + '</span>';
  h += '</div>';
  if (d.director) h += '<div class="gris" style="margin-top:12px">' + T('Direcció:') + ' ' + esc(d.director) + '</div>';
  if (d.avis) h += '<div class="fx-avis">' + esc(d.avis) + '</div>';
  h += '<div class="fx-sin">' + esc(d.sinopsi || '') + '</div><div class="fx-bt">';
  if (!e) h += '<span class="gris">' + T('Buscant el fitxer…') + '</span>';
  else if (vlc) h += '<button class="pri" onclick="reprodueix()">' + svg(IC.play) + ' ' + T('Obrir a VLC') + '</button>';
  else if (v && v.d) h += '<button class="pri" onclick="reprodueix()">' + svg(IC.play) + ' ' + Tf('Continuar ({1})', durada(v.t)) + '</button><button onclick="reprodueix(true)">' + T('Des del principi') + '</button>';
  else h += '<button class="pri" onclick="reprodueix()">' + svg(IC.play) + ' ' + T('Reproduir') + '</button>';
  h += '<button onclick="corregeix()">' + T('No és aquesta? Corregeix el títol') + '</button></div>';
  if (e) h += '<div class="fx-fitxer">' + esc(e.p) + ' · ' + mida(e.mida) + (d.fontNom ? ' · ' + esc(d.fontNom) : '') + '</div>';
  $('fx-info').innerHTML = h;
}
function corregeix() {
  var t = prompt(T('Títol de la pel·lícula (pots afegir l\'any al final, p. ex. «Interstellar 2014»):'), FX.d.titol || '');
  if (t == null) return;
  t = retalla(t);
  var m = /^(.*?)\s*\(?((19|20)\d\d)\)?$/.exec(t), any = '';
  if (m && m[1]) { t = m[1]; any = m[2]; }
  var p = FX.p;
  avis(T('Buscant…'));
  getJson(api('peli-titol', { p: p, t: t, a: any }), function (d) {
    if (FX.p != p) return;
    FX.d = d; pintaFitxa(d, (ls('veient') || {})[p]);
    $('fx-poster').style.backgroundImage = bg(api('caratula', { p: p, m: 460, v: Date.now() }));
    carregaLlista();
  }, errXarxa(T('buscar la pel·lícula')));
}
function reprodueix(desDelPrincipi) {
  var e = FX.e;
  if (!e) return;
  var url = fUrl('pelis', e.p);
  if (dins(EXT_VLC, e.ext)) {
    if (confirm(Tf('El Safari de l\'iPad no pot reproduir fitxers .{1}.\nVols obrir-lo amb l\'app VLC?', e.ext))) location.href = 'vlc-x-callback://x-callback-url/stream?url=' + enc(absolut(url));
    return;
  }
  var subs = [];
  for (var i = 0; i < (e.subs || []).length; i++) {
    var s = e.subs[i];
    subs.push({ u: ext(s.p) == 'vtt' ? fUrl('pelis', s.p) : api('vtt', { c: 'pelis', p: s.p }), label: s.label, lang: s.lang || LANG });
  }
  if (desDelPrincipi) { var st = ls('veient') || {}; delete st[e.p]; ls('veient', st); }
  if (Casa) Casa.video({ id: e.p, nom: FX.d.titol || titol(e), s: FX.d.any || T('Pel·lícula'), u: url, poster: api('caratula', { p: e.p, m: 300 }), subs: subs, k: 'peli', desa: 'veient', desDelPrincipi: !!desDelPrincipi });
}
function tancaFitxa() { FX.p = null; $('fitxa').style.display = 'none'; pintaVeient(); }
window.casaObre = function (arg) { arg = decodeURIComponent(arg); if (arg.indexOf('v:') === 0) fitxa(arg.substring(2)); };
window.casaMostra = function () { carregaLlista(); };
iniciaMandros();
pintaPest();
carregaLlista();
if (P.pest == 'fitxers') obreCarpeta('');
if (location.hash.length > 1) casaObre(location.hash.substring(1));
</script>
</body>
</html>
