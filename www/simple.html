<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Hearth</title>
<script src="i18n.js"></script>
<!--
  Hearth senzill, per a navegadors molt vells (Xbox 360, Internet Explorer 9-11, teles i consoles antigues).
  No fa servir flexbox, degradats, transicions ni HLS: només blocs, inline-block, posicions absolutes,
  <audio> MP3 i <video> MP4, i botons grans per a un comandament o un ratolí.
-->
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0d12;color:#fff;font-family:"Segoe UI",Arial,sans-serif;font-size:22px}
button,.bt{font-family:inherit;font-size:22px;color:#fff;background:#2a2f38;border:0;border-radius:14px;padding:14px 24px;cursor:pointer;margin:0 10px 10px 0}
button:hover,.bt:hover,.it:hover{background:#3a4250}
button.pri{background:#0a84ff}
.gris{color:#9aa3af}
#cap{position:absolute;left:0;right:0;top:0;height:86px;padding:16px 40px 0;background:#111419;white-space:nowrap}
#cap button{padding:12px 26px}
#cap button.on{background:#fff;color:#111}
#cos{position:absolute;left:0;right:0;top:86px;bottom:96px;overflow-y:auto;padding:26px 40px}
#peu{position:absolute;left:0;right:0;bottom:0;height:96px;background:#111419;padding:14px 40px 0;white-space:nowrap;overflow:hidden}
#peu .art{display:inline-block;vertical-align:middle;width:68px;height:68px;border-radius:10px;background:#2a2f38 center no-repeat;background-size:cover;margin-right:16px}
#peu .tx{display:inline-block;vertical-align:middle;width:46%;overflow:hidden}
#peu .tx b{display:block;font-size:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peu .tx span{display:block;font-size:18px;color:#9aa3af;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#peu .ctl{display:inline-block;vertical-align:middle;margin-left:20px}
#peu .ctl button{margin:0 8px 0 0;min-width:80px}
/* inici */
#hora{font-size:120px;font-weight:300;line-height:1}
#data{font-size:30px;margin:6px 0 24px}
.col{display:inline-block;vertical-align:top;width:47%;margin-right:3%}
#temps .gr{font-size:64px;font-weight:300}
#temps .ds{font-size:22px;color:#c3c9d2}
.ag-d{font-size:18px;letter-spacing:1px;color:#9aa3af;margin:16px 0 6px;text-transform:uppercase}
.ag-e{font-size:24px;margin:4px 0}
.ag-e b{display:inline-block;min-width:110px}
.ag-e .imp{color:#ff9f0a;font-weight:bold}
/* graelles */
.it{display:inline-block;vertical-align:top;width:200px;margin:0 22px 26px 0;cursor:pointer;border-radius:16px;padding:8px}
.it .im{width:200px;height:200px;border-radius:14px;background:#2a2f38 center no-repeat;background-size:cover}
.it .im.logo{background-color:#fff;background-size:70%}
.it .im.poster{height:300px}
.it .nm{font-size:20px;margin-top:8px;height:52px;overflow:hidden}
.fila{padding:14px 18px;border-radius:12px;cursor:pointer;font-size:24px}
.fila:hover{background:#2a2f38}
.fila span{color:#9aa3af;font-size:20px;margin-left:12px}
h2{font-size:34px;font-weight:400;margin:0 0 20px}
/* passi de fotos i vídeo, a pantalla completa */
#gran{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;display:none;z-index:50}
#gran .f{position:absolute;left:0;top:0;width:100%;height:100%;background:#000 center no-repeat;background-size:cover}
#gran video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#gran .hora{position:absolute;left:50px;bottom:40px;font-size:80px;font-weight:300;text-shadow:0 2px 12px #000}
#gran .tanca{position:absolute;right:40px;top:30px;z-index:3}
#avis{position:absolute;left:50%;top:110px;width:700px;margin-left:-350px;text-align:center;background:#2c2c2e;border-radius:14px;padding:14px;display:none;z-index:60}
</style>
</head>
<body>
<div id="cap">
  <button id="p-inici" onclick="pest('inici')">Inici</button><button id="p-radio" onclick="pest('radio')">Ràdio</button><button id="p-musica" onclick="pest('musica')">Música</button><button id="p-pelis" onclick="pest('pelis')">Pel·lícules</button><button onclick="passi()">Fotos</button><button onclick="location.href='/?complet=1'" style="float:right">Versió completa</button>
</div>
<div id="cos"></div>
<div id="peu"><span class="art" id="pa"></span><span class="tx"><b id="pt">No sona res</b><span id="ps">Tria una ràdio o música</span></span><span class="ctl"><button id="pb" onclick="playPausa()">▶</button><button onclick="atura()">■</button></span></div>
<div id="gran"></div>
<div id="avis"></div>
<audio id="au" preload="none"></audio>
<script>
/* ---------- Eines (ES5 i IE9) ---------- */
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enc(s) { return encodeURIComponent(s); }
function api(n, p) { var q = []; if (p) for (var k in p) if (p.hasOwnProperty(k) && p[k] !== undefined && p[k] !== null) q.push(enc(k) + '=' + enc(p[k])); return '/api/' + n + (q.length ? '?' + q.join('&') : ''); }
function fUrl(c, p) { var s = p.split('/'); for (var i = 0; i < s.length; i++) s[i] = enc(s[i]); return '/f/' + enc(c) + '/' + s.join('/'); }
function bg(u) { return u ? "url('" + String(u).replace(/'/g, '%27') + "')" : 'none'; }
function dos(n) { return n < 10 ? '0' + n : '' + n; }
function getJson(u, ok, ko) {
  var x = new XMLHttpRequest();
  x.open('GET', u, true);
  x.onreadystatechange = function () {
    if (x.readyState != 4) return;
    if (x.status >= 200 && x.status < 300) { var d; try { d = JSON.parse(x.responseText); } catch (e) { if (ko) ko(); return; } ok(d); }
    else if (ko) ko(x.status);
  };
  x.send(null);
}
function dades(n, ok) { getJson(api('dades', { n: n }), ok, function () { ok(null); }); }
var avisT;
function avis(t, ms) { var a = $('avis'); a.innerHTML = esc(t); a.style.display = 'block'; clearTimeout(avisT); avisT = setTimeout(function () { a.style.display = 'none'; }, ms || 3500); }
var X = { ajustos: {}, pest: 'inici', radios: [], pila: [], pelis: [], fotos: [] };

/* ---------- Pestanyes ---------- */
function pest(p) {
  X.pest = p;
  var ps = ['inici', 'radio', 'musica', 'pelis'];
  for (var i = 0; i < ps.length; i++) $('p-' + ps[i]).className = ps[i] == p ? 'on' : '';
  $('cos').scrollTop = 0;
  if (p == 'inici') pintaInici();
  else if (p == 'radio') pintaRadios();
  else if (p == 'musica') { X.pila = [{ f: { vista: 'albums' }, t: 'Música' }]; carregaMusica(); }
  else if (p == 'pelis') carregaPelis();
}

/* ---------- Inici: rellotge, temps i agenda ---------- */
var DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
function dataLlarga(d) { var t = T(DIES[d.getDay()]) + ', ' + d.getDate() + ' ' + T(MESOS[d.getMonth()]); return t.charAt(0).toUpperCase() + t.substring(1); }
function pintaInici() {
  $('cos').innerHTML = '<div class="col"><div id="hora"></div><div id="data"></div><div id="temps"></div></div><div class="col" id="agenda"></div>';
  rellotge(); pintaTemps(); pintaAgenda();
}
function rellotge() {
  var d = new Date();
  if ($('hora')) { $('hora').innerHTML = d.getHours() + ':' + dos(d.getMinutes()); $('data').innerHTML = esc(dataLlarga(d)); }
  var g = $('gran-hora'); if (g) g.innerHTML = d.getHours() + ':' + dos(d.getMinutes());
}
setInterval(rellotge, 10000);
var CODIS = { 0: 'Cel serè', 1: 'Gairebé serè', 2: 'Parcialment ennuvolat', 3: 'Ennuvolat', 45: 'Boira', 48: 'Boira', 51: 'Plugim', 53: 'Plugim', 55: 'Plugim', 61: 'Pluja feble', 63: 'Pluja', 65: 'Pluja forta', 80: 'Ruixats', 81: 'Ruixats', 82: 'Ruixats', 95: 'Tempesta' };
function carregaTemps() {
  var a = X.ajustos;
  if (!a.lat) return;
  var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + a.lat + '&longitude=' + a.lon + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1';
  getJson(api('x', { u: u }), function (d) { X.temps = d; pintaTemps(); });
}
function pintaTemps() {
  var t = $('temps'), d = X.temps;
  if (!t || !d || !d.current) return;
  t.innerHTML = '<div class="gr">' + Math.round(d.current.temperature_2m) + '°</div><div class="ds">' + esc((X.ajustos.ciutat || '') + (X.ajustos.ciutat ? ' · ' : '') + T(CODIS[d.current.weather_code] || '')) +
    (d.daily ? '<br>' + T('Màx.') + ' ' + Math.round(d.daily.temperature_2m_max[0]) + '° · ' + T('Mín.') + ' ' + Math.round(d.daily.temperature_2m_min[0]) + '°' : '') + '</div>';
}
function dataDe(s) { var m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null; }
function carregaAgenda() {
  getJson(api('agenda', { dies: 7 }), function (d) { X.agenda = (d && d.esdeveniments) || []; pintaAgenda(); });
  dades('agenda_imp', function (d) { X.imp = d || {}; pintaAgenda(); });
}
function pintaAgenda() {
  var a = $('agenda'), l = X.agenda || [];
  if (!a) return;
  var h = '', dia = '', avui = new Date(), n = 0;
  avui.setHours(0, 0, 0, 0);
  for (var i = 0; i < l.length && n < 9; i++) {
    var e = l[i], ini = dataDe(e.ini), fi = dataDe(e.fi);
    if (!ini || (fi && fi < new Date())) continue;
    var d0 = new Date(ini.getTime()); d0.setHours(0, 0, 0, 0);
    var dif = Math.round((d0 - avui) / 864e5), nom = dif <= 0 ? T('Avui') : dif == 1 ? T('Demà') : dataLlarga(ini);
    if (nom != dia) { h += '<div class="ag-d">' + esc(nom) + '</div>'; dia = nom; }
    var m = X.imp && X.imp[e.t + '|' + e.ini], imp = m === 1 || (m !== 0 && (e.imp || /!/.test(e.t)));
    h += '<div class="ag-e">' + (imp ? '<span class="imp">! </span>' : '') + '<b>' + (e.dia || !/T\d/.test(e.ini) ? T('Tot el dia') : ini.getHours() + ':' + dos(ini.getMinutes())) + '</b>' + esc(e.t) + '</div>';
    n++;
  }
  a.innerHTML = h || '<div class="gris">' + T('No hi ha res a l\'agenda.') + '</div>';
}

/* ---------- Reproductor de so ---------- */
var au = $('au'), R = { cua: [], pos: 0, vies: [] };
function pinta() {
  var it = R.cua[R.pos];
  $('pt').innerHTML = esc(it ? it.t : T('No sona res'));
  $('ps').innerHTML = esc(it ? it.s || '' : T('Tria una ràdio o música'));
  $('pa').style.backgroundImage = bg(it ? it.art : '');
  $('pb').innerHTML = au.paused ? '▶' : '||';
}
au.addEventListener('play', pinta, false);
au.addEventListener('pause', pinta, false);
au.addEventListener('playing', pinta, false);
au.addEventListener('ended', function () { if (R.pos < R.cua.length - 1) { R.pos++; toca(); } else pinta(); }, false);
au.addEventListener('error', function () {
  /* si una via no va, la següent; i si cap no va, es diu per què (així es pot saber què falla) */
  if (R.vies.length) { au.src = R.vies.shift(); au.play(); return; }
  var c = au.error ? au.error.code : '?';
  avis(T('No s\'ha pogut reproduir') + ' (' + (c == 4 ? T('format no compatible') : c == 2 ? T('error de xarxa') : 'codi ' + c) + ')', 6000);
  pinta();
}, false);
function toca() {
  var it = R.cua[R.pos];
  if (!it) return;
  R.vies = it.vies ? it.vies.slice(0) : [];
  au.src = it.vies ? R.vies.shift() : it.u;
  au.play();
  pinta();
}
function playPausa() { if (!R.cua.length) return; if (au.paused) au.play(); else au.pause(); }
function atura() { au.pause(); au.removeAttribute('src'); try { au.load(); } catch (e) { } R.cua = []; pinta(); }

/* ---------- Ràdio ---------- */
function pintaRadios() {
  var l = X.radios, h = '<h2>' + T('Les meves ràdios') + '</h2>';
  for (var i = 0; i < l.length; i++) h += '<div class="it" onclick="tocaRadio(' + i + ')"><div class="im logo" style="background-image:' + bg(l[i].img ? api('imgx', { u: l[i].img, m: 200 }) : '') + '"></div><div class="nm">' + esc(l[i].t) + '</div></div>';
  $('cos').innerHTML = l.length ? h : '<div class="gris">' + T('Encara no tens ràdios preferides. Afegeix-les des de l\'iPad o el mòbil.') + '</div>';
}
function tocaRadio(i) {
  var r = X.radios[i], u = r.u;
  /* MP3 continu fet pel servidor (IE9 sí que el sap fer sonar); si no, l'emissora a través del servidor o directa */
  var vies = [api('radio/mp3', { u: u }), api('x', { u: u, directe: 1 })];
  if (/^http:/i.test(u)) vies.push(u);
  R.cua = [{ t: r.t, s: r.s || T('Ràdio'), art: r.img ? api('imgx', { u: r.img, m: 200 }) : '', vies: vies }];
  R.pos = 0; toca();
}

/* ---------- Música ---------- */
function carregaMusica() {
  var v = X.pila[X.pila.length - 1];
  $('cos').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('musica', v.f), function (d) {
    var h = (X.pila.length > 1 ? '<button onclick="X.pila.pop();carregaMusica()">‹ ' + T('Enrere') + '</button>' : '') + '<h2>' + esc(v.t) + '</h2>', i;
    if (d.grups) {
      X.grups = d.grups;
      for (i = 0; i < d.grups.length; i++) {
        var g = d.grups[i];
        h += '<div class="it" onclick="obreAlbum(' + i + ')"><div class="im" style="background-image:' + bg(portada(g.p)) + '"></div><div class="nm">' + esc(g.nom) + (g.a ? '<br><span class="gris">' + esc(g.a) + '</span>' : '') + '</div></div>';
      }
    } else {
      X.cancons = [];
      var l = d.cancons || [];
      for (i = 0; i < l.length; i++) if (/\.(mp3|m4a|aac)$/i.test(l[i].p)) X.cancons.push(l[i]);
      if (X.cancons.length) h += '<button class="pri" onclick="tocaCanco(0)">▶ ' + T('Reprodueix-ho tot') + '</button>';
      for (i = 0; i < X.cancons.length; i++) h += '<div class="fila" onclick="tocaCanco(' + i + ')">' + esc(X.cancons[i].t || X.cancons[i].p.split('/').pop()) + '<span>' + esc(X.cancons[i].a || '') + '</span></div>';
      if (!X.cancons.length) h += '<div class="gris">' + T('No hi ha cançons en MP3 aquí.') + '</div>';
    }
    $('cos').innerHTML = h;
  }, function () { $('cos').innerHTML = '<div class="gris">' + T('No s\'ha pogut carregar la música.') + '</div>'; });
}
function portada(p) { var d = p && p.indexOf('/') >= 0 ? p.substring(0, p.lastIndexOf('/')) : (p || ''); return api('portada', { c: 'musica', p: d, m: 300 }); }
function obreAlbum(i) {
  var g = X.grups[i], f = { vista: 'cancons', album: g.nom };
  if (g.a) f.artista = g.a;
  X.pila.push({ f: f, t: g.nom }); carregaMusica();
}
function tocaCanco(i) {
  R.cua = [];
  for (var k = 0; k < X.cancons.length; k++) { var c = X.cancons[k]; R.cua.push({ t: c.t || c.p.split('/').pop(), s: (c.a || '') + (c.al ? ' · ' + c.al : ''), u: fUrl('musica', c.p), art: portada(c.p) }); }
  R.pos = i; toca();
}

/* ---------- Pel·lícules (només MP4: és el que saben fer sonar els navegadors vells) ---------- */
function carregaPelis() {
  $('cos').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('pelis/llista'), function (d) {
    var l = d.pelis || [], h = '<h2>' + T('Pel·lícules') + '</h2>', n = 0;
    X.pelis = l;
    for (var i = 0; i < l.length; i++) {
      var e = l[i], ok = /^(mp4|m4v)$/i.test(e.ext || '');
      if (!ok) continue;
      n++;
      h += '<div class="it" onclick="obrePeli(' + i + ')"><div class="im poster" style="background-image:' + bg(api('caratula', { p: e.p, m: 300, cau: 1, v: e.pv || 0 })) + '"></div><div class="nm">' + esc(e.titol || e.n || e.p.split('/').pop()) + '</div></div>';
    }
    $('cos').innerHTML = n ? h : '<div class="gris">' + T('No hi ha pel·lícules en MP4 (aquest navegador no pot fer sonar altres formats).') + '</div>';
  }, function () { $('cos').innerHTML = '<div class="gris">' + T('No s\'ha pogut carregar la biblioteca.') + '</div>'; });
}
function obrePeli(i) {
  var e = X.pelis[i];
  atura();
  var g = $('gran');
  g.innerHTML = '<video id="vid" controls autoplay src="' + esc(fUrl('pelis', e.p)) + '"></video><button class="tanca" onclick="tancaGran()">✕ ' + T('Tanca') + '</button>';
  g.style.display = 'block';
  var v = $('vid');
  v.addEventListener('error', function () { avis(T('Aquest navegador no pot reproduir aquest vídeo') + (v.error ? ' (codi ' + v.error.code + ')' : ''), 6000); }, false);
  try { v.play(); } catch (x) { }
}

/* ---------- Passi de fotos ---------- */
var PS = { t: null, n: 0, l: [] };
function passi() {
  var g = $('gran');
  g.innerHTML = '<div class="f" id="f1"></div><div class="hora" id="gran-hora"></div><button class="tanca" onclick="tancaGran()">✕ ' + T('Tanca') + '</button>';
  g.style.display = 'block';
  rellotge();
  getJson(api('fotos'), function (d) {
    var l = [];
    for (var i = 0; i < (d || []).length; i++) if (!d[i][2]) l.push(d[i][0]);
    for (i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = l[i]; l[i] = l[j]; l[j] = x; }
    PS.l = l; PS.n = 0;
    if (!l.length) { avis(T('No hi ha fotos per mostrar')); return; }
    seguentFoto();
  });
}
function seguentFoto() {
  clearTimeout(PS.t);
  var f = $('f1');
  if (!f || !PS.l.length) return;
  var u = api('mini', { c: 'fotos', p: PS.l[PS.n % PS.l.length], m: 1280 }), im = new Image();
  PS.n++;
  im.onload = function () { if ($('f1')) $('f1').style.backgroundImage = bg(u); PS.t = setTimeout(seguentFoto, (X.ajustos.marcSeg || 15) * 1000); };
  im.onerror = function () { PS.t = setTimeout(seguentFoto, 1000); };
  im.src = u;
}
function tancaGran() { clearTimeout(PS.t); var v = $('vid'); if (v) { try { v.pause(); } catch (e) { } } $('gran').innerHTML = ''; $('gran').style.display = 'none'; }

/* ---------- Pantalles: aquest aparell apareix a les altres i rep el que li envien (com la pantalla normal) ---------- */
var DISP = (function () {
  var id = '';
  try { id = JSON.parse(localStorage.getItem('casa.disp') || 'null') || ''; } catch (e) { }
  if (!id) { var m = /(?:^|; )hdisp=([^;]*)/.exec(document.cookie); if (m) id = decodeURIComponent(m[1]); }
  if (!/^[a-z0-9]{6,16}$/.test(id)) { id = ''; for (var i = 0; i < 10; i++) id += 'abcdefghijklmnopqrstuvwxyz0123456789'.charAt(Math.floor(Math.random() * 36)); }
  try { localStorage.setItem('casa.disp', JSON.stringify(id)); } catch (e) { }
  try { document.cookie = 'hdisp=' + encodeURIComponent(id) + '; expires=Fri, 31 Dec 2037 23:59:59 GMT; path=/'; } catch (e) { }
  return { id: id, nom: /Xbox/i.test(navigator.userAgent) ? 'Xbox' : /MSIE |Trident\//.test(navigator.userAgent) ? 'Internet Explorer' : 'Navegador antic' };
})();
var PANT = { dif: 0 };
function hola() {
  var it = R.cua[R.pos], t0 = new Date().getTime();
  getJson(api('pantalles/hola', { d: DISP.id, v: 2, sona: it ? it.t + (it.s ? ' · ' + it.s : '') : '', pausa: it && au.paused ? 1 : '', nom: X.ajustos.nomDisp || DISP.nom, _: t0 }), function (r) {
    var l = r && r.o ? r.o : r;
    if (r && r.t) PANT.dif = r.t - (t0 + new Date().getTime()) / 2;
    if (l && l.length) rebOrdre(l[l.length - 1]);
  });
}
setInterval(hola, 4000);
setTimeout(hola, 1000);
/* el que arriba d'una altra pantalla: ràdio i música sonen aquí; la TV en directe no (aquest navegador no fa HLS) */
function rebOrdre(o) {
  if (!o || !o.tipus) return;
  if (o.tipus == 'ctl') {
    if (o.acc == 'pausa' && !au.paused) au.pause();
    else if (o.acc == 'play' && au.paused && R.cua.length) au.play();
    else if (o.acc == 'atura' || o.acc == 'apaga') { atura(); tancaGran(); }
    return;
  }
  if (o.tipus == 'tv') { avis(T('Aquest navegador no pot mostrar la TV en directe') + (o.t ? ': ' + o.t : ''), 6000); return; }
  if (o.tipus != 'cua' || !o.cua || !o.cua.length) return;
  var cua = [];
  for (var i = 0; i < o.cua.length; i++) {
    var it = o.cua[i];
    if (it.k == 'radio' && it.id) cua.push({ t: it.t, s: it.s || T('Ràdio'), art: it.art, vies: [api('radio/mp3', { u: it.id }), api('x', { u: it.id, directe: 1 })].concat(/^http:/i.test(it.id) ? [it.id] : []) });
    else if (it.u && it.k != 'spotify') cua.push({ t: it.t, s: it.s, art: it.art, u: it.u });
  }
  if (!cua.length) { avis(T('Això no es pot reproduir en aquest navegador') + (o.t ? ': ' + o.t : ''), 6000); return; }
  avis(T('Des de') + ' ' + (o.de || '') + ': ' + (o.t || ''), 4000);
  /* si diverses pantalles comencen alhora, s'espera l'hora acordada */
  var espera = o.t0 ? Math.max(0, o.t0 - (new Date().getTime() + PANT.dif)) : 0;
  setTimeout(function () { R.cua = cua; R.pos = Math.min(o.pos || 0, cua.length - 1); toca(); }, espera);
}

/* ---------- Arrencada ---------- */
dades('ajustos', function (a) {
  X.ajustos = a || {};
  carregaTemps();
  setInterval(carregaTemps, 30 * 60000);
});
dades('radios', function (d) { X.radios = d || []; if (X.pest == 'radio') pintaRadios(); });
carregaAgenda();
setInterval(carregaAgenda, 10 * 60000);
pest('inici');
pinta();
</script>
