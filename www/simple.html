<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Hearth</title>
<script src="i18n.js"></script>
<!--
  Hearth senzill, per a navegadors molt vells (Xbox 360, Internet Explorer 9-11, teles i consoles antigues).
  No fa servir flexbox, degradats, transicions ni HLS: només blocs, inline-block, posicions absolutes,
  <audio> MP3 i <video> MP4, i botons grans per a un comandament o un ratolí.
-->
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0d12;color:#fff;font-family:"Segoe UI",Arial,sans-serif;font-size:18px}
button,.bt{font-family:inherit;font-size:18px;color:#fff;background:#2a2f38;background:rgba(255,255,255,.16);border:0;border-radius:14px;padding:12px 22px;cursor:pointer;margin:0 10px 10px 0}
button:hover,.it:hover,.app:hover,.rt:hover{background-color:rgba(255,255,255,.28)}
button.pri{background:#0a84ff}
.gris{color:#9aa3af}
svg{display:inline-block}
.ic{width:34px;height:34px;fill:#fff;vertical-align:middle}
/* fons: una foto de les teves, enfosquida */
#fons{position:absolute;left:0;top:0;width:100%;height:100%;background:#1a1f2a center no-repeat;background-size:cover}
#vel{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;background:rgba(0,0,0,.42)}
/* pantalla d'inici, com la normal */
#inici{position:absolute;left:0;top:0;right:0;bottom:0;padding:34px 44px}
#esq{position:absolute;left:40px;top:26px;width:50%;overflow:hidden}
#salut{font-size:18px;opacity:.9}
#hora{font-size:80px;font-weight:300;line-height:1.05;text-shadow:0 2px 14px rgba(0,0,0,.5)}
#data{font-size:22px;margin:0 0 10px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#dre{position:absolute;right:150px;top:30px;text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#dre .ti{display:inline-block;width:52px;height:52px;vertical-align:middle}
#dre .ti svg{width:52px;height:52px}
#dre .gr{display:inline-block;vertical-align:middle;font-size:50px;font-weight:300;margin-left:6px}
#dre .ds{font-size:15px;opacity:.9}
#complet{position:absolute;right:24px;top:14px;font-size:12px;padding:5px 10px;margin:0;background:rgba(0,0,0,.35)}
.ag-d{font-size:12px;letter-spacing:1px;opacity:.75;margin:8px 0 2px;text-transform:uppercase}
.ag-e{font-size:16px;margin:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.ag-e b{display:inline-block;min-width:70px}
.ag-e .imp{color:#ff9f0a;font-weight:bold}
/* moll d'apps a la dreta */
#dock{position:absolute;right:24px;top:50%;width:88px;margin-top:-180px;padding:10px 0;border-radius:22px;background:#1b1f26;background:rgba(20,22,28,.72);text-align:center}
.app{display:block;cursor:pointer;padding:6px 0;border-radius:14px;margin:0 6px}
.app .bx{width:52px;height:52px;border-radius:14px;margin:0 auto 4px;text-align:center;line-height:52px}
.app .bx svg{width:28px;height:28px;fill:#fff;vertical-align:middle}
.app span{display:block;font-size:12px}
/* el que sona i les ràdios preferides, a baix */
#sona{position:absolute;left:40px;right:150px;bottom:128px;display:none;padding:10px;border-radius:16px;background:#1b1f26;background:rgba(20,22,28,.72);white-space:nowrap}
#rapid{position:absolute;left:40px;right:150px;bottom:20px;height:100px;overflow:hidden;white-space:nowrap}
.rt{display:inline-block;vertical-align:top;width:76px;margin-right:10px;text-align:center;cursor:pointer;border-radius:16px;padding:4px 0;white-space:normal}
.rt .lg{width:64px;height:64px;margin:0 auto 4px;border-radius:14px;background:#fff center no-repeat;background-size:70%}
.rt span{display:block;font-size:12px;height:28px;overflow:hidden;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.sn-art{display:inline-block;vertical-align:middle;width:60px;height:60px;border-radius:10px;background:#2a2f38 center no-repeat;background-size:cover;margin-right:18px}
.sn-tx{display:inline-block;vertical-align:middle;width:45%;overflow:hidden}
.sn-tx small{display:block;font-size:11px;letter-spacing:1px;opacity:.75;text-transform:uppercase}
.sn-tx b{display:block;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-tx span{display:block;font-size:14px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sn-ctl{display:inline-block;vertical-align:middle}
.sn-ctl button{width:50px;height:50px;padding:0;border-radius:25px;margin:0 10px 0 0}
.sn-ctl button.gp{background:#fff}
.sn-ctl button.gp svg{fill:#111}
/* apps a sobre */
#app{position:absolute;left:0;top:0;right:0;bottom:0;background:#0e1116;display:none}
#app-cap{position:absolute;left:0;right:0;top:0;height:70px;padding:14px 40px 0;white-space:nowrap}
#app-cap h1{display:inline-block;vertical-align:middle;font-size:28px;font-weight:600;margin:0 0 0 14px}
#app-cap button{vertical-align:middle;margin:0}
#cos{position:absolute;left:0;right:0;top:70px;bottom:0;overflow-y:auto;padding:16px 40px 120px}
#app #sona{left:40px;right:40px;bottom:20px;background:#1b1f26}
.it{display:inline-block;vertical-align:top;width:150px;margin:0 14px 18px 0;cursor:pointer;border-radius:16px;padding:8px}
.it .im{width:150px;height:150px;border-radius:14px;background:#2a2f38 center no-repeat;background-size:cover}
.it .im.logo{background-color:#fff;background-size:70%}
.it .im.poster{height:225px}
.it .nm{font-size:15px;margin-top:6px;height:40px;overflow:hidden}
.fila{padding:10px 16px;border-radius:10px;cursor:pointer;font-size:18px}
.fila:hover{background:#2a2f38}
.fila span{color:#9aa3af;font-size:15px;margin-left:12px}
h2{font-size:30px;font-weight:400;margin:0 0 18px}
/* passi de fotos i vídeo, a pantalla completa */
#gran{position:absolute;left:0;top:0;width:100%;height:100%;background:#000;display:none;z-index:50}
#gran .f{position:absolute;left:0;top:0;width:100%;height:100%;background:#000 center no-repeat;background-size:cover}
#gran video{position:absolute;left:0;top:0;width:100%;height:100%;background:#000}
#gran .hora{position:absolute;left:50px;bottom:40px;font-size:80px;font-weight:300;text-shadow:0 2px 12px #000}
#gran .tanca{position:absolute;right:40px;top:30px;z-index:3}
#avis{position:absolute;left:50%;top:110px;width:700px;margin-left:-350px;text-align:center;background:#2c2c2e;border-radius:14px;padding:14px;display:none;z-index:60}
</style>
</head>
<body>
<div id="fons"></div><div id="vel"></div>
<div id="inici">
  <div id="esq"><div id="salut"></div><div id="hora"></div><div id="data"></div><div id="agenda"></div></div>
  <div id="dre"><div><span class="ti" id="ti"></span><span class="gr" id="tgr"></span></div><div class="ds" id="tds"></div></div>
  <div id="dock"></div>
  <div id="rapid"></div>
  <button id="complet" onclick="location.href='/?complet=1'">Versió completa</button>
</div>
<div id="app"><div id="app-cap"><button onclick="tancaApp()">‹ Inici</button><h1 id="app-t"></h1></div><div id="cos"></div></div>
<div id="sona"><span class="sn-art" id="pa"></span><span class="sn-tx"><small id="pk"></small><b id="pt"></b><span id="ps"></span></span><span class="sn-ctl"><button class="gp" id="pb" onclick="playPausa()"></button><button onclick="atura()" id="px"></button></span></div>
<div id="gran"></div>
<div id="avis"></div>
<audio id="au" preload="none"></audio>
<script>
/* ---------- Eines (ES5 i IE9) ---------- */
function $(i) { return document.getElementById(i); }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function enc(s) { return encodeURIComponent(s); }
function api(n, p) { var q = []; if (p) for (var k in p) if (p.hasOwnProperty(k) && p[k] !== undefined && p[k] !== null) q.push(enc(k) + '=' + enc(p[k])); return '/api/' + n + (q.length ? '?' + q.join('&') : ''); }
function fUrl(c, p) { var s = p.split('/'); for (var i = 0; i < s.length; i++) s[i] = enc(s[i]); return '/f/' + enc(c) + '/' + s.join('/'); }
function bg(u) { return u ? "url('" + String(u).replace(/'/g, '%27') + "')" : 'none'; }
function dos(n) { return n < 10 ? '0' + n : '' + n; }
function getJson(u, ok, ko) {
  var x = new XMLHttpRequest();
  x.open('GET', u, true);
  x.onreadystatechange = function () {
    if (x.readyState != 4) return;
    if (x.status >= 200 && x.status < 300) { var d; try { d = JSON.parse(x.responseText); } catch (e) { if (ko) ko(); return; } ok(d); }
    else if (ko) ko(x.status);
  };
  x.send(null);
}
function dades(n, ok) { getJson(api('dades', { n: n }), ok, function () { ok(null); }); }
var avisT;
function avis(t, ms) { var a = $('avis'); a.innerHTML = esc(t); a.style.display = 'block'; clearTimeout(avisT); avisT = setTimeout(function () { a.style.display = 'none'; }, ms || 3500); }
var X = { ajustos: {}, pest: 'inici', radios: [], pila: [], pelis: [], fotos: [] };
var IC = {"casa": "M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z", "pelis": "M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z", "musica": "M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z", "radio": "M3.24 6.15C2.51 6.43 2 7.17 2 8v12c0 1.1.89 2 2 2h16c1.11 0 2-.9 2-2V8c0-1.11-.89-2-2-2H8.3l8.26-3.34L15.88 1 3.24 6.15zM7 20c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm13-8h-2v-2h-2v2H4V8h16v4z", "fotos": "M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z", "play": "M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z", "pausa": "M6 4h4.2v16H6zM13.8 4H18v16h-4.2z", "tanca": "M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"};
function svg(d) { return '<svg viewBox="0 0 24 24" class="ic"><path d="' + d + '"/></svg>'; }
var NUVOL = 'M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z';
function sol(cx, cy, r) {
  var s = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="#ffc93c"/>';
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (r + 2), y1 = cy + Math.sin(a) * (r + 2), x2 = cx + Math.cos(a) * (r + 4.5), y2 = cy + Math.sin(a) * (r + 4.5);
    s += '<line x1="' + x1.toFixed(2) + '" y1="' + y1.toFixed(2) + '" x2="' + x2.toFixed(2) + '" y2="' + y2.toFixed(2) + '" stroke="#ffc93c" stroke-width="1.6" stroke-linecap="round"/>';
  }
  return s;
}
function nuvol(tx, ty, sc, col) { return '<path d="' + NUVOL + '" fill="' + col + '" transform="translate(' + tx + ' ' + ty + ') scale(' + sc + ')"/>'; }
function iconaTemps(c, nit) {
  var s = '<svg viewBox="0 0 24 24">';
  if (c === 0 || c == 1) s += nit ? '<path d="M14 3a8 8 0 1 0 7 11.5A6.5 6.5 0 0 1 14 3z" fill="#e8e3b8"/>' : sol(12, 12, 5);
  else if (c == 2) s += (nit ? '<path d="M10 2a6 6 0 1 0 5.2 8.6A4.9 4.9 0 0 1 10 2z" fill="#e8e3b8"/>' : sol(8.5, 8.5, 3.6)) + nuvol(5, 8, 0.78, '#f2f5fa');
  else if (c == 3) s += nuvol(1, 7, 0.65, '#9aa6b8') + nuvol(3, 4, 0.85, '#e6ebf2');
  else if (c == 45 || c == 48) s += '<g stroke="#cfd6e0" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="8" x2="21" y2="8"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="3" y1="16" x2="21" y2="16"/></g>';
  else if (c >= 95) s += nuvol(1, 0, 0.92, '#b8c2d1') + '<path d="M13 12l-4 6h3l-1 5 5-7h-3l1-4z" fill="#ffd23c"/>';
  else if ((c >= 71 && c <= 77) || c == 85 || c == 86) s += nuvol(1, 0, 0.92, '#e6ebf2') + '<g fill="#fff"><circle cx="7" cy="21" r="1.3"/><circle cx="12" cy="22.5" r="1.3"/><circle cx="17" cy="21" r="1.3"/></g>';
  else if (c >= 51) s += nuvol(1, 0, 0.92, '#c9d2de') + '<g stroke="#5ab0ff" stroke-width="1.8" stroke-linecap="round"><line x1="7" y1="20" x2="6" y2="23"/><line x1="12" y1="20" x2="11" y2="23"/><line x1="17" y1="20" x2="16" y2="23"/></g>';
  else s += nuvol(1, 4, 0.92, '#e6ebf2');
  return s + '</svg>';
}


/* ---------- Apps: s'obren a sobre de la pantalla d'inici ---------- */
var APPS = [
  { id: 'radio', nom: 'Ràdio', ic: 'radio', c: '#f08a24' },
  { id: 'musica', nom: 'Música', ic: 'musica', c: '#e5484d' },
  { id: 'pelis', nom: 'Pel·lícules', ic: 'pelis', c: '#4f6ef7' },
  { id: 'fotos', nom: 'Fotos', ic: 'fotos', c: '#22b573' }
];
function pintaDock() {
  var h = '';
  for (var i = 0; i < APPS.length; i++) h += '<div class="app" onclick="obreApp(\'' + APPS[i].id + '\')"><div class="bx" style="background:' + APPS[i].c + '">' + svg(IC[APPS[i].ic]) + '</div><span>' + esc(T(APPS[i].nom)) + '</span></div>';
  $('dock').innerHTML = h;
}
function obreApp(p) {
  if (p == 'fotos') { passi(); return; }
  X.pest = p;
  for (var i = 0; i < APPS.length; i++) if (APPS[i].id == p) $('app-t').innerHTML = esc(T(APPS[i].nom));
  $('app').style.display = 'block';
  document.body.className = 'en-app';
  $('cos').scrollTop = 0;
  if (p == 'radio') pintaRadios();
  else if (p == 'musica') { X.pila = [{ f: { vista: 'albums' }, t: '' }]; carregaMusica(); }
  else if (p == 'pelis') carregaPelis();
  pinta();
}
function tancaApp() { X.pest = 'inici'; $('app').style.display = 'none'; document.body.className = ''; pinta(); }

/* ---------- Inici: rellotge, temps i agenda ---------- */
var DIES = ['diumenge', 'dilluns', 'dimarts', 'dimecres', 'dijous', 'divendres', 'dissabte'];
var MESOS = ['gener', 'febrer', 'març', 'abril', 'maig', 'juny', 'juliol', 'agost', 'setembre', 'octubre', 'novembre', 'desembre'];
function dataLlarga(d) { var t = T(DIES[d.getDay()]) + ', ' + d.getDate() + ' ' + T(MESOS[d.getMonth()]); return t.charAt(0).toUpperCase() + t.substring(1); }
function rellotge() {
  var d = new Date();
  var h = d.getHours();
  $('hora').innerHTML = h + ':' + dos(d.getMinutes()); $('data').innerHTML = esc(dataLlarga(d));
  $('salut').innerHTML = esc(T(h >= 6 && h < 13 ? 'Bon dia' : h >= 13 && h < 20 ? 'Bona tarda' : 'Bona nit') + (X.ajustos.nom ? ', ' + X.ajustos.nom : ''));
  var g = $('gran-hora'); if (g) g.innerHTML = d.getHours() + ':' + dos(d.getMinutes());
}
setInterval(rellotge, 10000);
var CODIS = { 0: 'Cel serè', 1: 'Gairebé serè', 2: 'Parcialment ennuvolat', 3: 'Ennuvolat', 45: 'Boira', 48: 'Boira', 51: 'Plugim', 53: 'Plugim', 55: 'Plugim', 61: 'Pluja feble', 63: 'Pluja', 65: 'Pluja forta', 80: 'Ruixats', 81: 'Ruixats', 82: 'Ruixats', 95: 'Tempesta' };
function carregaTemps() {
  var a = X.ajustos;
  if (!a.lat) return;
  var u = 'https://api.open-meteo.com/v1/forecast?latitude=' + a.lat + '&longitude=' + a.lon + '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1';
  getJson(api('x', { u: u }), function (d) { X.temps = d; pintaTemps(); });
}
function pintaTemps() {
  var d = X.temps;
  if (!d || !d.current) return;
  try { $('ti').innerHTML = iconaTemps(d.current.weather_code, false); } catch (e) { }
  $('tgr').innerHTML = Math.round(d.current.temperature_2m) + '°';
  $('tds').innerHTML = esc((X.ajustos.ciutat || '') + (X.ajustos.ciutat ? ' · ' : '') + T(CODIS[d.current.weather_code] || '')) +
    (d.daily ? '<br>' + T('Màx.') + ' ' + Math.round(d.daily.temperature_2m_max[0]) + '° · ' + T('Mín.') + ' ' + Math.round(d.daily.temperature_2m_min[0]) + '°' : '');
}
function dataDe(s) { var m = /^(\d{4})-(\d\d)-(\d\d)(?:T(\d\d):(\d\d))?/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null; }
function carregaAgenda() {
  getJson(api('agenda', { dies: 7 }), function (d) { X.agenda = (d && d.esdeveniments) || []; pintaAgenda(); });
  dades('agenda_imp', function (d) { X.imp = d || {}; pintaAgenda(); });
}
function pintaAgenda() {
  var a = $('agenda'), l = X.agenda || [];
  if (!a) return;
  var h = '', dia = '', avui = new Date(), n = 0;
  avui.setHours(0, 0, 0, 0);
  for (var i = 0; i < l.length && n < 7; i++) {
    var e = l[i], ini = dataDe(e.ini), fi = dataDe(e.fi);
    if (!ini || (fi && fi < new Date())) continue;
    var d0 = new Date(ini.getTime()); d0.setHours(0, 0, 0, 0);
    var dif = Math.round((d0 - avui) / 864e5), nom = dif <= 0 ? T('Avui') : dif == 1 ? T('Demà') : dataLlarga(ini);
    if (nom != dia) { h += '<div class="ag-d">' + esc(nom) + '</div>'; dia = nom; }
    var m = X.imp && X.imp[e.t + '|' + e.ini], imp = m === 1 || (m !== 0 && (e.imp || /!/.test(e.t)));
    h += '<div class="ag-e">' + (imp ? '<span class="imp">! </span>' : '') + '<b>' + (e.dia || !/T\d/.test(e.ini) ? T('Tot el dia') : ini.getHours() + ':' + dos(ini.getMinutes())) + '</b>' + esc(e.t) + '</div>';
    n++;
  }
  a.innerHTML = h || '<div class="gris">' + T('No hi ha res a l\'agenda.') + '</div>';
  ajustaAgenda();
}

/* l'agenda només fins on hi cap (a sobre del que sona i de les ràdios) */
function ajustaAgenda() {
  var a = $('agenda'), sota = $('sona').style.display == 'block' && X.pest == 'inici' ? $('sona') : $('rapid');
  if (!a || !sota) return;
  var lim = sota.getBoundingClientRect().top - 10;
  while (a.lastChild && a.getBoundingClientRect().bottom > lim) {
    a.removeChild(a.lastChild);
    if (a.lastChild && a.lastChild.className == 'ag-d') a.removeChild(a.lastChild);
  }
}

/* ---------- Reproductor de so ---------- */
var au = $('au'), R = { cua: [], pos: 0, vies: [] };
function pinta() {
  var it = R.cua[R.pos], s = $('sona');
  var abans = s.style.display;
  s.style.display = it ? 'block' : 'none';
  if (abans != s.style.display) pintaAgenda();
  if (!it) return;
  /* a la pantalla d'inici, a sobre de les ràdios; dins d'una app, a baix de tot */
  s.style.zIndex = X.pest == 'inici' ? '' : '20';
  if (X.pest == 'inici') { s.style.left = '40px'; s.style.right = '150px'; s.style.bottom = '128px'; } else { s.style.left = '40px'; s.style.right = '40px'; s.style.bottom = '20px'; }
  $('pk').innerHTML = esc(it.vies ? T('Ràdio en directe') : T('Música'));
  $('pt').innerHTML = esc(it.t);
  $('ps').innerHTML = esc(it.s || '');
  $('pa').style.backgroundImage = bg(it.art);
  $('pa').style.backgroundColor = it.vies ? '#fff' : '';
  $('pa').style.backgroundSize = it.vies ? '70%' : 'cover';
  $('pb').innerHTML = svg(au.paused ? IC.play : IC.pausa);
  $('px').innerHTML = svg(IC.tanca);
}

au.addEventListener('play', pinta, false);
au.addEventListener('pause', pinta, false);
au.addEventListener('playing', pinta, false);
au.addEventListener('ended', function () { if (R.pos < R.cua.length - 1) { R.pos++; toca(); } else pinta(); }, false);
au.addEventListener('error', function () {
  /* si una via no va, la següent; i si cap no va, es diu per què (així es pot saber què falla) */
  if (R.vies.length) { au.src = R.vies.shift(); au.play(); return; }
  var c = au.error ? au.error.code : '?';
  avis(T('No s\'ha pogut reproduir') + ' (' + (c == 4 ? T('format no compatible') : c == 2 ? T('error de xarxa') : 'codi ' + c) + ')', 6000);
  pinta();
}, false);
function toca() {
  var it = R.cua[R.pos];
  if (!it) return;
  R.vies = it.vies ? it.vies.slice(0) : [];
  au.src = it.vies ? R.vies.shift() : it.u;
  au.play();
  pinta();
}
function playPausa() { if (!R.cua.length) return; if (au.paused) au.play(); else au.pause(); }
function atura() { au.pause(); au.removeAttribute('src'); try { au.load(); } catch (e) { } R.cua = []; pinta(); }

/* ---------- Ràdio ---------- */
function pintaRapid() {
  var l = X.radios, h = '';
  for (var i = 0; i < l.length; i++) h += '<div class="rt" onclick="tocaRadio(' + i + ')"><div class="lg" style="background-image:' + bg(l[i].img ? api('imgx', { u: l[i].img, m: 150 }) : '') + '"></div><span>' + esc(l[i].t) + '</span></div>';
  $('rapid').innerHTML = h;
}
function pintaRadios() {
  var l = X.radios, h = '';
  for (var i = 0; i < l.length; i++) h += '<div class="it" onclick="tocaRadio(' + i + ')"><div class="im logo" style="background-image:' + bg(l[i].img ? api('imgx', { u: l[i].img, m: 200 }) : '') + '"></div><div class="nm">' + esc(l[i].t) + '</div></div>';
  $('cos').innerHTML = l.length ? h : '<div class="gris">' + T('Encara no tens ràdios preferides. Afegeix-les des de l\'iPad o el mòbil.') + '</div>';
}
function tocaRadio(i) {
  var r = X.radios[i], u = r.u;
  /* MP3 continu fet pel servidor (IE9 sí que el sap fer sonar); si no, l'emissora a través del servidor o directa */
  var vies = [api('radio/mp3', { u: u, mida: 1 }), api('x', { u: u, directe: 1 })];
  if (/^http:/i.test(u)) vies.push(u);
  R.cua = [{ t: r.t, s: r.s || T('Ràdio'), art: r.img ? api('imgx', { u: r.img, m: 200 }) : '', vies: vies }];
  R.pos = 0; toca();
}

/* ---------- Música ---------- */
function carregaMusica() {
  var v = X.pila[X.pila.length - 1];
  $('cos').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('musica', v.f), function (d) {
    var h = (X.pila.length > 1 ? '<button onclick="X.pila.pop();carregaMusica()">‹ ' + T('Enrere') + '</button><h2>' + esc(v.t) + '</h2>' : ''), i;
    if (d.grups) {
      X.grups = d.grups;
      for (i = 0; i < d.grups.length; i++) {
        var g = d.grups[i];
        h += '<div class="it" onclick="obreAlbum(' + i + ')"><div class="im" style="background-image:' + bg(portada(g.p)) + '"></div><div class="nm">' + esc(g.nom) + (g.a ? '<br><span class="gris">' + esc(g.a) + '</span>' : '') + '</div></div>';
      }
    } else {
      X.cancons = [];
      var l = d.cancons || [];
      for (i = 0; i < l.length; i++) if (/\.(mp3|m4a|aac)$/i.test(l[i].p)) X.cancons.push(l[i]);
      if (X.cancons.length) h += '<button class="pri" onclick="tocaCanco(0)">▶ ' + T('Reprodueix-ho tot') + '</button>';
      for (i = 0; i < X.cancons.length; i++) h += '<div class="fila" onclick="tocaCanco(' + i + ')">' + esc(X.cancons[i].t || X.cancons[i].p.split('/').pop()) + '<span>' + esc(X.cancons[i].a || '') + '</span></div>';
      if (!X.cancons.length) h += '<div class="gris">' + T('No hi ha cançons en MP3 aquí.') + '</div>';
    }
    $('cos').innerHTML = h;
  }, function () { $('cos').innerHTML = '<div class="gris">' + T('No s\'ha pogut carregar la música.') + '</div>'; });
}
function portada(p) { var d = p && p.indexOf('/') >= 0 ? p.substring(0, p.lastIndexOf('/')) : (p || ''); return api('portada', { c: 'musica', p: d, m: 300 }); }
function obreAlbum(i) {
  var g = X.grups[i], f = { vista: 'cancons', album: g.nom };
  if (g.a) f.artista = g.a;
  X.pila.push({ f: f, t: g.nom }); carregaMusica();
}
function tocaCanco(i) {
  R.cua = [];
  for (var k = 0; k < X.cancons.length; k++) { var c = X.cancons[k]; R.cua.push({ t: c.t || c.p.split('/').pop(), s: (c.a || '') + (c.al ? ' · ' + c.al : ''), u: fUrl('musica', c.p), art: portada(c.p) }); }
  R.pos = i; toca();
}

/* ---------- Pel·lícules (només MP4: és el que saben fer sonar els navegadors vells) ---------- */
function carregaPelis() {
  $('cos').innerHTML = '<div class="gris">' + T('Carregant…') + '</div>';
  getJson(api('pelis/llista'), function (d) {
    var l = d.pelis || [], h = '', n = 0;
    X.pelis = l;
    for (var i = 0; i < l.length; i++) {
      var e = l[i], ok = /^(mp4|m4v)$/i.test(e.ext || '');
      if (!ok) continue;
      n++;
      h += '<div class="it" onclick="obrePeli(' + i + ')"><div class="im poster" style="background-image:' + bg(api('caratula', { p: e.p, m: 300, cau: 1, v: e.pv || 0 })) + '"></div><div class="nm">' + esc(e.titol || e.n || e.p.split('/').pop()) + '</div></div>';
    }
    $('cos').innerHTML = n ? h : '<div class="gris">' + T('No hi ha pel·lícules en MP4 (aquest navegador no pot fer sonar altres formats).') + '</div>';
  }, function () { $('cos').innerHTML = '<div class="gris">' + T('No s\'ha pogut carregar la biblioteca.') + '</div>'; });
}
function obrePeli(i) {
  var e = X.pelis[i];
  atura();
  var g = $('gran');
  g.innerHTML = '<video id="vid" controls autoplay src="' + esc(fUrl('pelis', e.p)) + '"></video><button class="tanca" onclick="tancaGran()">✕ ' + T('Tanca') + '</button>';
  g.style.display = 'block';
  var v = $('vid');
  v.addEventListener('error', function () { avis(T('Aquest navegador no pot reproduir aquest vídeo') + (v.error ? ' (codi ' + v.error.code + ')' : ''), 6000); }, false);
  try { v.play(); } catch (x) { }
}

/* ---------- Passi de fotos ---------- */
var PS = { t: null, n: 0, l: [] };
function passi() {
  var g = $('gran');
  g.innerHTML = '<div class="f" id="f1"></div><div class="hora" id="gran-hora"></div><button class="tanca" onclick="tancaGran()">✕ ' + T('Tanca') + '</button>';
  g.style.display = 'block';
  rellotge();
  getJson(api('fotos'), function (d) {
    var l = [];
    for (var i = 0; i < (d || []).length; i++) if (!d[i][2]) l.push(d[i][0]);
    for (i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = l[i]; l[i] = l[j]; l[j] = x; }
    PS.l = l; PS.n = 0;
    if (!l.length) { avis(T('No hi ha fotos per mostrar')); return; }
    seguentFoto();
  });
}
function seguentFoto() {
  clearTimeout(PS.t);
  var f = $('f1');
  if (!f || !PS.l.length) return;
  var u = api('mini', { c: 'fotos', p: PS.l[PS.n % PS.l.length], m: 1280 }), im = new Image();
  PS.n++;
  im.onload = function () { if ($('f1')) $('f1').style.backgroundImage = bg(u); PS.t = setTimeout(seguentFoto, (X.ajustos.marcSeg || 15) * 1000); };
  im.onerror = function () { PS.t = setTimeout(seguentFoto, 1000); };
  im.src = u;
}
function tancaGran() { clearTimeout(PS.t); var v = $('vid'); if (v) { try { v.pause(); } catch (e) { } } $('gran').innerHTML = ''; $('gran').style.display = 'none'; }

/* ---------- Pantalles: aquest aparell apareix a les altres i rep el que li envien (com la pantalla normal) ---------- */
var DISP = (function () {
  var id = '';
  try { id = JSON.parse(localStorage.getItem('casa.disp') || 'null') || ''; } catch (e) { }
  if (!id) { var m = /(?:^|; )hdisp=([^;]*)/.exec(document.cookie); if (m) id = decodeURIComponent(m[1]); }
  if (!/^[a-z0-9]{6,16}$/.test(id)) { id = ''; for (var i = 0; i < 10; i++) id += 'abcdefghijklmnopqrstuvwxyz0123456789'.charAt(Math.floor(Math.random() * 36)); }
  try { localStorage.setItem('casa.disp', JSON.stringify(id)); } catch (e) { }
  try { document.cookie = 'hdisp=' + encodeURIComponent(id) + '; expires=Fri, 31 Dec 2037 23:59:59 GMT; path=/'; } catch (e) { }
  return { id: id, nom: /Xbox/i.test(navigator.userAgent) ? 'Xbox' : /MSIE |Trident\//.test(navigator.userAgent) ? 'Internet Explorer' : 'Navegador antic' };
})();
var PANT = { dif: 0 };
function hola() {
  var it = R.cua[R.pos], t0 = new Date().getTime();
  getJson(api('pantalles/hola', { d: DISP.id, v: 2, sona: it ? it.t + (it.s ? ' · ' + it.s : '') : '', pausa: it && au.paused ? 1 : '', nom: X.ajustos.nomDisp || DISP.nom, _: t0 }), function (r) {
    var l = r && r.o ? r.o : r;
    if (r && r.t) PANT.dif = r.t - (t0 + new Date().getTime()) / 2;
    if (l && l.length) rebOrdre(l[l.length - 1]);
  });
}
setInterval(hola, 4000);
setTimeout(hola, 1000);
/* el que arriba d'una altra pantalla: ràdio i música sonen aquí; la TV en directe no (aquest navegador no fa HLS) */
function rebOrdre(o) {
  if (!o || !o.tipus) return;
  if (o.tipus == 'ctl') {
    if (o.acc == 'pausa' && !au.paused) au.pause();
    else if (o.acc == 'play' && au.paused && R.cua.length) au.play();
    else if (o.acc == 'atura' || o.acc == 'apaga') { atura(); tancaGran(); }
    return;
  }
  if (o.tipus == 'tv') { avis(T('Aquest navegador no pot mostrar la TV en directe') + (o.t ? ': ' + o.t : ''), 6000); return; }
  if (o.tipus != 'cua' || !o.cua || !o.cua.length) return;
  var cua = [];
  for (var i = 0; i < o.cua.length; i++) {
    var it = o.cua[i];
    if (it.k == 'radio' && it.id) cua.push({ t: it.t, s: it.s || T('Ràdio'), art: it.art, vies: [api('radio/mp3', { u: it.id, mida: 1 }), api('x', { u: it.id, directe: 1 })].concat(/^http:/i.test(it.id) ? [it.id] : []) });
    else if (it.u && it.k != 'spotify') cua.push({ t: it.t, s: it.s, art: it.art, u: it.u });
  }
  if (!cua.length) { avis(T('Això no es pot reproduir en aquest navegador') + (o.t ? ': ' + o.t : ''), 6000); return; }
  avis(T('Des de') + ' ' + (o.de || '') + ': ' + (o.t || ''), 4000);
  /* si diverses pantalles comencen alhora, s'espera l'hora acordada */
  var espera = o.t0 ? Math.max(0, o.t0 - (new Date().getTime() + PANT.dif)) : 0;
  setTimeout(function () { R.cua = cua; R.pos = Math.min(o.pos || 0, cua.length - 1); toca(); }, espera);
}

/* ---------- Fons: les teves fotos, una cada estona ---------- */
var FONS = { l: [], n: 0 };
function carregaFons() {
  getJson(api('fotos'), function (d) {
    var l = [];
    for (var i = 0; i < (d || []).length; i++) if (!d[i][2]) l.push(d[i][0]);
    for (i = l.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = l[i]; l[i] = l[j]; l[j] = x; }
    FONS.l = l; seguentFons();
  });
}
function seguentFons() {
  if (!FONS.l.length) return;
  var u = api('mini', { c: 'fotos', p: FONS.l[FONS.n++ % FONS.l.length], m: 1280 }), im = new Image();
  im.onload = function () { $('fons').style.backgroundImage = bg(u); };
  im.src = u;
}
setInterval(seguentFons, 60000);

/* ---------- Arrencada ---------- */
dades('ajustos', function (a) {
  X.ajustos = a || {};
  rellotge();
  carregaTemps();
  setInterval(carregaTemps, 30 * 60000);
});
dades('radios', function (d) { X.radios = d || []; pintaRapid(); if (X.pest == 'radio') pintaRadios(); });
carregaAgenda();
setInterval(carregaAgenda, 10 * 60000);
pintaDock();
rellotge();
carregaFons();
pinta();
</script>
