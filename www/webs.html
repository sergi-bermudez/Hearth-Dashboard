<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>Webs</title>
<script src="i18n.js"></script>
<style>
.webs{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -9px}
.web{width:calc(50% - 18px);margin:9px;cursor:pointer}
.web .im{padding-top:62%;border-radius:14px;background:#1a1f26 center/contain no-repeat;position:relative;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.web .im .ic{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;fill:#3a434f}
.web .nm{margin-top:8px;font-weight:600}
.web .nm small{color:#8d95a1;font-weight:400;margin-left:6px}
#vista{position:absolute;top:0;left:0;right:0;bottom:0;background:#000;z-index:20;display:none}
#vista .cap{position:absolute;top:0;left:0;right:0;height:56px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:0 10px;background:#111;z-index:2}
#vista .cap .t{-webkit-flex:1;flex:1;margin:0 12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vista .cap button{margin-left:6px}
#marc{position:absolute;top:56px;left:0;right:0;bottom:0}
#img{position:absolute;display:block;-webkit-user-select:none;user-select:none}
#punt{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:20px;border:3px solid #7fb0ff;display:none;pointer-events:none}
#estat{position:absolute;left:0;right:0;top:50%;text-align:center;color:#8d95a1}
@media (max-width:800px){ .web{width:calc(100% - 18px)} }
/* Navegador */
.nav-cerca{display:-webkit-flex;display:flex;margin:0 0 18px}
.nav-cerca input{-webkit-flex:1;flex:1;min-width:0;font-size:17px;padding:12px 14px}
.nav-cerca button{margin-left:8px}
/* barra com la d'un navegador */
#nbarra{display:none;position:absolute;top:0;left:0;right:0;height:52px;background:#202226;border-bottom:1px solid #000;-webkit-align-items:center;align-items:center;padding:0 6px;z-index:2}
#vista.nav .cap{display:none}
#vista.nav #nbarra{display:-webkit-flex;display:flex}
#vista.nav #marc{top:52px}
#nbarra .nb{width:40px;height:40px;padding:0;margin:0 2px;border-radius:20px;background:transparent;-webkit-flex:none;flex:none}
#nbarra .nb:active{background:rgba(255,255,255,.12)}
#nbarra .ic{width:24px;height:24px;fill:#d7dbe0}
#n-form{-webkit-flex:1;flex:1;min-width:0;margin:0 6px;height:36px;border-radius:10px;background:#36393f;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;position:relative}
#n-cad{position:absolute;left:0;right:36px;top:0;bottom:0;line-height:36px;text-align:center;color:#e8eaed;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;padding:0 8px}
#n-adr{-webkit-flex:1;flex:1;min-width:0;height:36px;border:0;background:transparent;color:transparent;font-size:16px;padding:0 10px;border-radius:10px;-webkit-appearance:none}
#n-form.edita #n-adr{color:#fff}
#n-form.edita #n-cad{display:none}
#n-rec{width:36px;height:36px;padding:0;background:transparent;-webkit-flex:none;flex:none}
#n-rec .ic{width:20px;height:20px}
#n-prog{position:absolute;left:0;right:0;bottom:-1px;height:2px;overflow:hidden}
#n-prog div{height:2px;width:0;background:#4f8ff7;-webkit-transition:width .4s,opacity .4s;transition:width .4s,opacity .4s}
#marc{overflow:hidden}
#tecl{position:absolute;left:0;right:0;bottom:0;padding:8px 10px;background:#1b1f25;display:none;z-index:3}
#tecl form{display:-webkit-flex;display:flex}
#tecl input{-webkit-flex:1;flex:1;min-width:0;font-size:17px;padding:10px 12px}
#tecl button{margin-left:6px}
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>Webs</h1><button onclick="if(Casa)Casa.obre('config','webs')">Afegir o editar</button></div>
  <form class="nav-cerca" onsubmit="obreNav($('nav-q').value);return false"><input id="nav-q" type="text" autocapitalize="off" autocorrect="off" placeholder="Busca o escriu una adreça web"><button class="pri" type="submit">Obre</button></form>
  <div class="webs" id="webs"><div class="gris">Carregant…</div></div>
  <p class="gris petit" style="margin-top:20px">Les webs s'obren en un navegador amagat al PC, de la mida d'aquesta pantalla, i aquí en veus la imatge. Toca per fer-hi un clic, arrossega per moure-la i fes servir ⌨ per escriure.</p>
</div>
<div id="vista">
  <div class="cap"><button onclick="tanca()">‹ Webs</button><div class="t" id="v-t"></div>
    <button onclick="roda(-500)" id="b-amunt">▲</button><button onclick="roda(500)" id="b-avall">▼</button><button onclick="recarrega()">⟳</button></div>
  <div id="nbarra">
    <button class="nb" onclick="tanca()" title="Webs"><svg class="ic" viewBox="0 0 24 24"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button>
    <button class="nb" onclick="navAcc('nav-enrere')" title="Enrere"><svg class="ic" viewBox="0 0 24 24"><path d="M15.4 7.4L14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg></button>
    <button class="nb" onclick="navAcc('nav-endavant')" title="Endavant"><svg class="ic" viewBox="0 0 24 24"><path d="M8.6 16.6L10 18l6-6-6-6-1.4 1.4 4.6 4.6z"/></svg></button>
    <form id="n-form" onsubmit="navVes($('n-adr').value);return false"><span id="n-cad"></span><input id="n-adr" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Busca o escriu una adreça" onfocus="navAdrFocus(true)" onblur="navAdrFocus(false)"><button type="button" id="n-rec" onclick="navAcc('nav-recarrega')" title="Recarrega"><svg class="ic" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button></form>
    <button class="nb" onclick="navTeclat()" title="Escriu a la web"><svg class="ic" viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 2H5v-2h2v2zm0-3H5V8h2v2zm9 7H8v-2h8v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg></button>
    <div id="n-prog"><div></div></div>
  </div>
  <div id="marc"><div id="estat">Carregant…</div><img id="img" alt=""><div id="punt"></div>
    <div id="tecl"><form onsubmit="navEscriu(true);return false"><input id="tecl-t" type="text" autocapitalize="off" autocorrect="off"><button type="button" onclick="navEscriu(false)">Posa</button><button class="pri" type="submit">Envia ↵</button><button type="button" onclick="$('tecl').style.display='none'">✕</button></form></div></div>
</div>
<script src="comu.js"></script>
<script>
dinsCasa('webs');
var W = { defs: [], obert: null, t: null, cards: {}, actiu: true, seq: [] };
function url(w, completa) { return api('web/imatge', { id: w.id, min: w.mode == 'directe' ? 300 : Math.max(2, w.interval || 10) * 1000, t: Date.now() }); }
function pinta() {
  var h = '';
  for (var i = 0; i < W.defs.length; i++) {
    var w = W.defs[i];
    h += '<div class="web" onclick="obre(' + i + ')"><div class="im" id="card-' + esc(w.id) + '">' + svg(IC.web) + '</div><div class="nm">' + esc(w.nom) +
      '<small>' + (w.mode == 'directe' ? 'en directe' : 'cada ' + (w.interval || 10) + ' s') + '</small></div></div>';
  }
  $('webs').innerHTML = h || '<div class="gris" style="margin:9px">Encara no hi ha cap web. Toca «Afegir o editar».</div>';
  refrescaCards(0);
}
function refrescaCards(i) {
  clearTimeout(W.t);
  if (!W.actiu || W.obert || !W.defs.length) return;
  var w = W.defs[i % W.defs.length], el = $('card-' + w.id), u = url(w), im = new Image();
  im.onload = function () { if (el) { el.style.backgroundImage = bg(u); el.innerHTML = ''; } W.t = setTimeout(function () { refrescaCards(i + 1); }, 1500); };
  im.onerror = function () { W.t = setTimeout(function () { refrescaCards(i + 1); }, 4000); };
  im.src = u;
}
function obre(i) {
  var w = W.defs[i];
  W.obert = w;
  clearTimeout(W.t);
  $('v-t').textContent = w.nom;
  $('vista').style.display = 'block';
  $('estat').style.display = 'block';
  $('img').style.display = 'none';
  carrega();
}
function encaixa() {
  var im = $('img'), m = $('marc');
  if (!im.naturalWidth) return;
  var r = Math.min(m.clientWidth / im.naturalWidth, m.clientHeight / im.naturalHeight);
  var w = Math.round(im.naturalWidth * r), h = Math.round(im.naturalHeight * r);
  im.style.width = w + 'px'; im.style.height = h + 'px';
  im.style.left = Math.round((m.clientWidth - w) / 2) + 'px'; im.style.top = Math.round((m.clientHeight - h) / 2) + 'px';
}
function carrega() {
  var w = W.obert;
  if (!w) return;
  var nou = new Image(), u = url(w);
  nou.onload = function () {
    if (W.obert != w) return;
    var im = $('img');
    im.src = u;
    im.style.display = 'block';
    $('estat').style.display = 'none';
    setTimeout(encaixa, 0);
    W.t = setTimeout(carrega, w.mode == 'directe' ? 350 : Math.max(2, w.interval || 10) * 1000);
  };
  nou.onerror = function () {
    $('estat').textContent = 'No s\'ha pogut obrir aquesta web al PC. Torno a provar…';
    $('estat').style.display = 'block';
    W.t = setTimeout(carrega, 5000);
  };
  nou.src = u;
}
$('img').addEventListener('click', function (e) {
  if (W.obert && W.obert.nav) { if (+new Date() - (W.touchT || 0) > 700) navClic(e.clientX, e.clientY); return; }
  var r = this.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  var p = $('punt');
  p.style.left = (e.clientX - $('marc').getBoundingClientRect().left) + 'px';
  p.style.top = (e.clientY - $('marc').getBoundingClientRect().top) + 'px';
  p.style.display = 'block';
  setTimeout(function () { p.style.display = 'none'; }, 600);
  post(api('web/clic', { id: W.obert.id, x: fx.toFixed(4), y: fy.toFixed(4) }), '', function () { clearTimeout(W.t); setTimeout(carrega, 700); }, errXarxa('fer el clic'));
}, false);
function roda(d) { post(api('web/roda', { id: W.obert.id, d: d }), '', function () { clearTimeout(W.t); setTimeout(carrega, 500); }, errXarxa('moure la web')); }
function recarrega() { post(api('web/recarrega', { id: W.obert.id }), '', function () { clearTimeout(W.t); setTimeout(carrega, 2500); }, errXarxa('recarregar')); }
function tanca() { W.obert = null; clearTimeout(W.t); clearTimeout(W.ti); $('vista').style.display = 'none'; $('vista').className = ''; $('tecl').style.display = 'none'; refrescaCards(0); }

/* ---------- Navegador: l'Edge del PC obre la web de la mida d'aquesta pantalla i aquí arriba una captura
   cada cop que toques, mous o escrius (no és un vídeo). Tocar = clic, arrossegar = moure, ⌨ = escriure. ---------- */
function navId() { var i = ls('navId'); if (!i) { i = 'nav-' + Math.random().toString(36).substring(2, 10); ls('navId', i); } return i; }
/* la mida en punts de la pantalla i la densitat (retina = 2): el PC pinta la web exactament així */
function navMida() { var m = $('marc'); W.mida = { w: m.clientWidth, h: m.clientHeight, dsf: Math.min(2, Math.max(1, window.devicePixelRatio || 1)) }; return W.mida; }
function navParams(id) { var mi = navMida(); return { id: id, w: mi.w, h: mi.h, dsf: mi.dsf, mobil: mi.w < 700 ? 1 : '' }; }
function obreNav(q) {
  var w = { id: navId(), nav: true, nom: 'Navegador' };
  W.obert = w;
  clearTimeout(W.t);
  $('vista').className = 'nav';
  $('vista').style.display = 'block';
  $('estat').textContent = 'Obrint…'; $('estat').style.display = 'block';
  $('img').style.display = 'none';
  navPinta(q || '');
  post(api('web/nav-obre', navParams(w.id)), '', function () {
    if (q) navVes(q); else navRefresca();
  }, function () { $('estat').textContent = 'No s\'ha pogut obrir el navegador al PC.'; });
}
function navAdrFocus(f) {
  $('n-form').className = f ? 'edita' : '';
  if (f) setTimeout(function () { try { $('n-adr').setSelectionRange(0, 9999); } catch (e) { } }, 0);
}
function navPinta(url, titol) {
  $('n-adr').value = url || '';
  var m = /^https?:\/\/(?:www\.)?([^\/?#]+)/i.exec(url || '');
  $('n-cad').textContent = m ? (/^https:/i.test(url) ? '🔒 ' : '') + m[1] : (url || '');
}
/* barra de progrés: corre mentre s'espera que la web canviï */
function navProg(on) {
  var b = $('n-prog').firstChild;
  if (on) { b.style.opacity = '1'; b.style.width = '15%'; setTimeout(function () { if (W.carregant) b.style.width = '70%'; }, 60); }
  else { b.style.width = '100%'; setTimeout(function () { if (!W.carregant) { b.style.opacity = '0'; setTimeout(function () { b.style.width = '0'; }, 400); } }, 300); }
  W.carregant = on;
}
function navVes(u) {
  if (!W.obert || !W.obert.nav) return;
  $('n-adr').blur();
  navPinta(u);
  navProg(true);
  $('estat').textContent = 'Carregant…';
  post(api('web/nav-ves', { id: W.obert.id, u: u }), '', navRefresca, errXarxa('obrir la web'));
}
function navAcc(a) { navProg(true); post(api('web/' + a, { id: W.obert.id }), '', navRefresca, errXarxa('navegar')); }
/* després de cada acció: captures seguides una estona (la web pot trigar a canviar) i després una de tant en tant */
function navRefresca() {
  var w = W.obert; if (!w || !w.nav) return;
  W.seq = [250, 900, 2000, 4000];
  clearTimeout(W.t);
  W.t = setTimeout(navCaptura, 120);
  clearTimeout(W.ti); W.infoFins = Date.now() + 15000; W.ti = setTimeout(navInfo, 600);
}
function navCaptura() {
  var w = W.obert; if (!w || !w.nav || !W.actiu) return;
  var u = api('web/imatge', { id: w.id, min: 200, t: Date.now() }), nou = new Image();
  nou.onload = function () {
    if (W.obert != w) return;
    var im = $('img');
    im.src = u; im.style.display = 'block';
    im.style.webkitTransform = im.style.transform = '';
    /* la captura ve a la densitat de la pantalla: es mostra a la mida en punts */
    var mi = W.mida || navMida(), d = mi.dsf || 1;
    im.style.left = '0'; im.style.top = '0'; im.style.width = Math.round(nou.width / d) + 'px'; im.style.height = Math.round(nou.height / d) + 'px';
    $('estat').style.display = 'none';
    if (W.carregant && W.seq.length <= 2 && !(W.info && W.info.carregant)) navProg(false);
    W.t = setTimeout(navCaptura, W.seq.length ? W.seq.shift() : 6000);
  };
  nou.onerror = function () { $('estat').textContent = 'El PC no respon. Torno a provar…'; $('estat').style.display = 'block'; W.t = setTimeout(navCaptura, 4000); };
  nou.src = u;
}
function navInfo() {
  var w = W.obert; if (!w || !w.nav) return;
  getJson(api('web/nav-info', { id: w.id }), function (d) {
    if (W.obert != w || !d) return;
    if (document.activeElement != $('n-adr')) navPinta(d.url, d.titol);
    var abans = W.info;
    W.info = d;
    /* mentre la web es carrega (o acaba de canviar d'adreça), captures seguides fins que acabi */
    if (d.carregant || (abans && abans.url != d.url)) {
      if (!W.carregant) navProg(true);
      if (W.seq.length < 2) { W.seq = [800]; clearTimeout(W.t); W.t = setTimeout(navCaptura, 400); }
    } else if (W.carregant && W.seq.length <= 2) navProg(false);
    clearTimeout(W.ti);
    if (Date.now() < W.infoFins) W.ti = setTimeout(navInfo, d.carregant ? 700 : 1500);
    if (d.edita && $('tecl').style.display != 'block') navMostraTeclat(d);
    else if (!d.edita && document.activeElement != $('tecl-t')) $('tecl').style.display = 'none';
  });
}
function navMostraTeclat(d) {
  var t = $('tecl-t');
  t.type = d && d.contrasenya ? 'password' : 'text';
  t.value = d ? d.valor || '' : '';
  $('tecl').style.display = 'block';
}
function navTeclat() { navMostraTeclat(W.info && W.info.edita ? W.info : null); $('tecl-t').focus(); }
function navEscriu(enter) {
  var t = $('tecl-t');
  post(api('web/nav-escriu', { id: W.obert.id, t: t.value, enter: enter ? 1 : '' }), '', function () { if (enter) { t.blur(); $('tecl').style.display = 'none'; } navRefresca(); }, errXarxa('escriure'));
}
function navClic(cx, cy) {
  var r = $('img').getBoundingClientRect(), fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  if (fx < 0 || fy < 0 || fx > 1 || fy > 1) return;
  var p = $('punt'), mr = $('marc').getBoundingClientRect();
  p.style.left = (cx - mr.left) + 'px'; p.style.top = (cy - mr.top) + 'px'; p.style.display = 'block';
  setTimeout(function () { p.style.display = 'none'; }, 500);
  navProg(true);
  post(api('web/clic', { id: W.obert.id, x: fx.toFixed(4), y: fy.toFixed(4) }), '', navRefresca, errXarxa('fer el clic'));
}
function navMou(dx, dy, x0, y0) {
  var r = $('img').getBoundingClientRect();
  post(api('web/roda', { id: W.obert.id, d: Math.round(-dy), dx: Math.round(-dx), x: ((x0 - r.left) / r.width).toFixed(3), y: ((y0 - r.top) / r.height).toFixed(3) }), '', navRefresca, errXarxa('moure la web'));
}
(function () {
  var m = $('marc'), T0 = null;
  m.addEventListener('touchstart', function (e) {
    if (!W.obert || !W.obert.nav || e.touches.length != 1 || e.target.tagName == 'INPUT' || e.target.tagName == 'BUTTON') { T0 = null; return; }
    var t = e.touches[0]; T0 = { x: t.clientX, y: t.clientY, x1: t.clientX, y1: t.clientY, t: Date.now() };
  }, false);
  m.addEventListener('touchmove', function (e) {
    if (!T0) return;
    var t = e.touches[0]; T0.x1 = t.clientX; T0.y1 = t.clientY;
    e.preventDefault();
    /* la imatge segueix el dit mentre arriba la nova */
    var im = $('img'), tr = 'translate(' + Math.round(T0.x1 - T0.x) + 'px,' + Math.round(T0.y1 - T0.y) + 'px)';
    im.style.webkitTransform = tr; im.style.transform = tr;
  }, false);
  m.addEventListener('touchend', function (e) {
    if (!T0) return;
    var dx = T0.x1 - T0.x, dy = T0.y1 - T0.y, a = T0; T0 = null;
    W.touchT = +new Date();
    e.preventDefault();
    /* un toc encara que el dit es mogui una mica (passa molt a l'iPad) */
    var dist = Math.sqrt(dx * dx + dy * dy), curt = Date.now() - a.t < 300;
    if (dist < 14 || (curt && dist < 28)) { var im = $('img'); im.style.webkitTransform = im.style.transform = ''; navClic(a.x, a.y); }
    else navMou(Math.abs(dx) > Math.abs(dy) * 2 ? dx * 1.2 : 0, dy * 1.2, a.x, a.y);
  }, false);
  m.addEventListener('wheel', function (e) {
    if (!W.obert || !W.obert.nav) return;
    e.preventDefault();
    clearTimeout(W.rw); W.rdy = (W.rdy || 0) + e.deltaY; W.rx = e.clientX; W.ry = e.clientY;
    W.rw = setTimeout(function () { var d = W.rdy; W.rdy = 0; navMou(0, -d, W.rx, W.ry); }, 120);
  }, false);
})();
/* si la pantalla gira o canvia de mida, la web del PC també */
window.addEventListener('resize', function () {
  if (!W.obert || !W.obert.nav) return;
  clearTimeout(W.rz);
  W.rz = setTimeout(function () { post(api('web/nav-obre', navParams(W.obert.id)), '', navRefresca); }, 400);
});
window.addEventListener('resize', function () { setTimeout(encaixa, 50); });
window.casaMostra = function () { W.actiu = true; if (W.obert && W.obert.nav) navRefresca(); else if (W.obert) carrega(); else refrescaCards(0); };
window.casaAmaga = function () { W.actiu = false; clearTimeout(W.t); };
window.casaTanca = window.casaAmaga;
window.casaObre = function (a) {
  a = decodeURIComponent(a);
  for (var i = 0; i < W.defs.length; i++) if (W.defs[i].id == a) obre(i);
  W.pendent = a;
};
dades('webs', function (d) {
  W.defs = d || [];
  pinta();
  var h = W.pendent || (location.hash.length > 1 ? decodeURIComponent(location.hash.substring(1)) : '');
  if (h) for (var i = 0; i < W.defs.length; i++) if (W.defs[i].id == h) obre(i);
});
