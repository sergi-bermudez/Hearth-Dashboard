<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="stylesheet" href="comu.css">
<title>YouTube</title>
<script src="i18n.js"></script>
<style>
.yt{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:0 -8px}
.yv{width:33.33%;padding:0 8px 18px;cursor:pointer}
.yv .im{position:relative;padding-top:56.25%;border-radius:12px;background:#1d2229 center/cover no-repeat;overflow:hidden}
.yv .dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.8);border-radius:5px;padding:1px 6px;font-size:13px;font-weight:600}
.yv .dur.dir{background:#e0283b}
.yv .hd{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.75);border-radius:5px;padding:1px 6px;font-size:12px;font-weight:700}
.yv .hd.fet{background:#2fd36b;color:#000}
.yv .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3)}
.yv .prog div{height:4px;background:#ff3b3b}
.yv .t{font-weight:600;font-size:15px;line-height:1.25;margin-top:8px;max-height:2.5em;overflow:hidden}
.yv .c{color:#8d95a1;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yv .bt{float:right;background:none;padding:2px 4px;margin:6px -4px 0 4px}
.yv .bt .ic{width:22px;height:22px;fill:#8d95a1}
@media (orientation:portrait){ .yv{width:50%} }
#full{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:60;display:none}
#full .card{position:absolute;left:50%;top:50%;width:420px;margin-left:-210px;-webkit-transform:translateY(-50%);transform:translateY(-50%);background:#1a1f27;border-radius:18px;padding:18px}
#full .card .im{padding-top:56.25%;border-radius:12px;background:#000 center/cover}
#full .card h3{margin:12px 0 4px;font-size:18px}
#full .card button{display:block;width:100%;margin-top:10px;padding:13px}
</style>
</head>
<body>
<div id="pag">
  <div class="capc"><h1>YouTube</h1></div>
  <div class="cerca"><input type="search" id="q" placeholder="Cerca a YouTube…" onkeydown="if(event.keyCode==13)cerca()"><button class="pri" onclick="cerca()">Cercar</button></div>
  <div class="xips" id="xips"></div>
  <div id="cont"></div>
</div>
<div id="full" onclick="if(event.target==this)tancaFull()"><div class="card" id="full-c"></div></div>
<script src="comu.js"></script>
<script>
dinsCasa('youtube');
var Y = { dades: { cerques: [], canals: [] }, llista: [], titol: '', hd: {}, t: null };

function desa() { desaDades('youtube', Y.dades); }
function inici() {
  Y.titol = '';
  pintaXips();
  var v = veient(), h = '';
  if (v.length) {
    h += '<h2 style="margin-top:6px">' + T('Continuar veient') + '</h2><div class="yt">';
    Y.llista = [];
    for (var i = 0; i < Math.min(v.length, 9); i++) { Y.llista.push({ id: v[i].p, t: v[i].n, c: '', d: v[i].d, img: 'https://i.ytimg.com/vi/' + v[i].p + '/mqdefault.jpg' }); }
    h += cartes(Y.llista) + '</div>';
  }
  if (!h) h = '<div class="gris" style="margin-top:20px">' + T('Cerca vídeos o afegeix els teus canals preferits (toca els tres punts d\'un vídeo ▸ Seguir el canal).') + '</div>';
  $('cont').innerHTML = h;
  setTimeout(mandros, 30);
  comprovaEines();
}
function veient() {
  var v = ls('ytveient') || {}, r = [];
  for (var k in v) if (v.hasOwnProperty(k)) r.push(v[k]);
  r.sort(function (a, b) { return b.ts - a.ts; });
  return r;
}
function pintaXips() {
  var h = '', i, c = Y.dades.canals || [], q = Y.dades.cerques || [];
  for (i = 0; i < c.length; i++) h += '<span class="xip" onclick="obreCanal(' + i + ')">' + svg(IC.video) + ' ' + esc(c[i].nom) + '</span>';
  for (i = 0; i < Math.min(q.length, 8); i++) h += '<span class="xip" onclick="$(\'q\').value=' + js(q[i]).replace(/"/g, '&quot;') + ';cerca()">' + svg(IC.cerca) + ' ' + esc(q[i]) + '</span>';
  $('xips').innerHTML = h;
}
function cerca() {
  var q = retalla($('q').value);
  if (!q) { inici(); return; }
  $('q').blur();
  var l = Y.dades.cerques || [], p = l.indexOf(q);
  if (p >= 0) l.splice(p, 1);
  l.unshift(q); Y.dades.cerques = l.slice(0, 12); desa(); pintaXips();
  carrega(api('youtube/cerca', { q: q }), '«' + q + '»');
}
function obreCanal(i) { var c = Y.dades.canals[i]; carrega(api('youtube/canal', { u: c.u }), c.nom); }
function carrega(url, titol) {
  Y.titol = titol;
  $('cont').innerHTML = '<div class="gris" style="margin:14px 4px">' + T('Carregant…') + '</div>';
  getJson(url, function (l) {
    Y.llista = l;
    $('cont').innerHTML = '<h2 style="margin-top:6px">' + esc(titol) + ' <button onclick="inici()" style="float:right;font-size:14px">' + T('Inici') + '</button></h2><div class="yt">' + cartes(l) + '</div>' +
      (l.length ? '' : '<div class="gris">' + T('Cap resultat.') + '</div>');
    setTimeout(mandros, 30);
    sondejaHd();
  }, function (st, txt) {
    var m = ''; try { m = JSON.parse(txt).error; } catch (e) { }
    $('cont').innerHTML = '<div class="ajuda">' + T('No s\'ha pogut carregar.') + ' ' + esc(m || '') + '</div>';
  });
}
function cartes(l) {
  var h = '', vt = ls('ytveient') || {};
  for (var i = 0; i < l.length; i++) {
    var v = l[i], s = vt[v.id], hd = Y.hd[v.id];
    h += '<div class="yv" onclick="toca(' + i + ')"><div class="im" data-bg="' + esc(imgx(v.img, 320)) + '">' +
      (v.directe ? '<span class="dur dir">' + T('DIRECTE') + '</span>' : v.d ? '<span class="dur">' + durada(v.d) + '</span>' : '') +
      (hd ? '<span class="hd' + (hd == 'fet' ? ' fet' : '') + '" id="hd-' + v.id + '">' + (hd == 'fet' ? 'HD' : /%$/.test(hd) ? 'HD ' + hd : '') + '</span>' : '') +
      (s && s.d ? '<div class="prog"><div style="width:' + Math.round(100 * s.t / s.d) + '%"></div></div>' : '') +
      '</div><button class="bt" onclick="event.stopPropagation();mes(' + i + ')">' + svg('M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z') + '</button>' +
      '<div class="t">' + esc(v.t) + '</div><div class="c">' + esc(v.c || '') + '</div></div>';
  }
  return h;
}
function toca(i, qualitat) {
  var v = Y.llista[i];
  if (!v || !Casa) return;
  var hd = qualitat == '720' || (qualitat == null && Y.hd[v.id] == 'fet');
  Casa.video({ id: v.id, nom: v.t, s: v.c || 'YouTube', u: api('youtube/video', { id: v.id, q: hd ? '720' : '360' }), poster: imgx(v.img, 320), k: 'yt', desa: 'ytveient' });
}
function mes(i) {
  var v = Y.llista[i], hd = Y.hd[v.id], h = '<div class="im" style="background-image:' + bg(imgx(v.img, 480)) + '"></div><h3>' + esc(v.t) + '</h3><div class="gris">' + esc(v.c || '') + '</div>';
  h += '<button class="pri" onclick="tancaFull();toca(' + i + ',\'360\')">' + svg(IC.play) + ' ' + T('Mira-ho ara') + '</button>';
  if (hd == 'fet') h += '<button onclick="tancaFull();toca(' + i + ',\'720\')">' + svg(IC.play) + ' ' + T('Mira-ho en HD') + '</button>';
  else if (!v.directe) h += '<button onclick="tancaFull();preparaHd(' + i + ')">' + (hd && /%$/.test(hd) ? Tf('Preparant en HD… {1}', hd) : T('Prepara-ho en HD (cal esperar una mica)')) + '</button>';
  if (v.c && v.cu !== false) h += '<button onclick="tancaFull();segueix(' + i + ')">' + T('Seguir el canal') + '</button>';
  h += '<button onclick="tancaFull()">' + T('Tanca') + '</button>';
  $('full-c').innerHTML = h;
  $('full').style.display = 'block';
}
function tancaFull() { $('full').style.display = 'none'; }
function preparaHd(i) {
  var v = Y.llista[i];
  getJson(api('youtube/hd', { id: v.id }), function (d) { Y.hd[v.id] = d.estat || '0%'; avis(T('Preparant en HD. Quan acabi, el vídeo tindrà l\'etiqueta HD.'), 4000); refrescaHd(); sondejaHd(); }, errXarxa(T('preparar el vídeo')));
}
function sondejaHd() {
  clearTimeout(Y.t);
  var pend = [];
  for (var k in Y.hd) if (Y.hd.hasOwnProperty(k) && /%$/.test(Y.hd[k])) pend.push(k);
  if (!pend.length) return;
  Y.t = setTimeout(function () {
    var n = pend.length;
    for (var i = 0; i < pend.length; i++) (function (id) {
      getJson(api('youtube/hd', { id: id }), function (d) {
        Y.hd[id] = d.estat;
        if (/^error/.test(d.estat)) { avis(d.estat, 5000); delete Y.hd[id]; }
        if (--n === 0) { refrescaHd(); sondejaHd(); }
      }, function () { if (--n === 0) sondejaHd(); });
    })(pend[i]);
  }, 3000);
}
function refrescaHd() {
  for (var k in Y.hd) if (Y.hd.hasOwnProperty(k)) {
    var e = $('hd-' + k), s = Y.hd[k];
    if (!e) continue;
    e.className = 'hd' + (s == 'fet' ? ' fet' : '');
    e.textContent = s == 'fet' ? 'HD' : 'HD ' + s;
  }
  if (Y.llista.length && !document.querySelector('.hd')) { var c = $('cont').querySelector('.yt'); if (c) { c.innerHTML = cartes(Y.llista); setTimeout(mandros, 30); } }
}
function segueix(i) {
  var v = Y.llista[i];
  /* El nom del canal serveix per trobar-lo: cerquem el seu enllaç */
  var u = 'https://www.youtube.com/@' + v.c.replace(/\s+/g, '');
  var nom = prompt(T('Enllaç del canal (pots enganxar el de YouTube):'), u);
  if (!nom) return;
  Y.dades.canals = Y.dades.canals || [];
  Y.dades.canals.push({ nom: v.c, u: nom });
  desa(); pintaXips(); avis(T('Canal afegit'));
}
function comprovaEines() {
  getJson(api('youtube/info'), function (d) {
    if (!d.ytdlp) $('cont').innerHTML = '<div class="ajuda">' + T('Per fer servir YouTube cal el programa gratuït yt-dlp al PC. Ves a Configuració ▸ YouTube i prem «Descarregar yt-dlp».') + '</div>' + $('cont').innerHTML;
  }, function () { });
}
window.casaMostra = function () { if (!Y.titol) inici(); };
iniciaMandros();
dades('youtube', function (d) { if (d) Y.dades = d; inici(); });
</script>
</body>
</html>
